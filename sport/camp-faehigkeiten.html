const FAEH = [

function fuenf(k){
  const cx = 190, cy = 188, R = 110, pt = i => [cx + R * Math.sin(i * 2 * Math.PI / 5), cy - R * Math.cos(i * 2 * Math.PI / 5)];
  let s = "";
  for(let a = 0; a < 5; a++) for(let b = a + 1; b < 5; b++){ const [x1, y1] = pt(a), [x2, y2] = pt(b); s += `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${CL}" stroke-width="${(b - a) % 4 === 1 || (b - a) === 4 ? 3 : 1.5}" ${(b - a) % 4 === 1 || (b - a) === 4 ? "" : 'stroke-dasharray="4 5"'}/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="40" fill="${CB}" stroke="${CL}" stroke-width="2"/>` + TX(cx, cy - 4, "motorische", {s:12, c:HG, w:600}) + TX(cx, cy + 12, "Fähigkeiten", {s:12.5, c:HELL});
  FAEH.forEach((f, i) => { const [x, y] = pt(i), an = k < 0 || k === i;
    s += `<g opacity="${an ? 1 : .3}"><circle cx="${x}" cy="${y}" r="38" fill="${CB2}" stroke="${k === i ? GE : f.c}" stroke-width="${k === i ? 5 : 3}"/>${f.i(x, y - 6, f.c)}` +
      TX(x, y + (i === 0 ? -46 : 56), f.n, {s:13.5, c:k === i ? GE : f.c}) + `</g>`; });
  return CK(380, 360, s);
}
// konditionell – koordinativ

  TX(112, 70, "konditionell", {s:16, c:OR}) + TX(112, 88, "Energie, Muskeln, Herz", {s:11.5, c:HG, w:600}) +
  [["Ausdauer", GR, 116], ["Kraft", RO, 150], ["Schnelligkeit", OR, 184]].map(([t, c, y]) => `<rect x="34" y="${y - 20}" width="156" height="28" rx="14" fill="${c}"/>` + TX(112, y - 1, t, {s:14, c:CB})).join("") +

// Zirkel: Belastung und Pause
const ZIRKEL = CK(380, 250, TX(190, 26, "So läuft ein Fitness-Zirkel", {s:16, c:HELL}) +

    return `<circle cx="${x}" cy="${y}" r="24" fill="${CB2}" stroke="${f.c}" stroke-width="3"/>` + TX(x, y + 5, i + 1, {s:15, c:f.c}); }).join("") +
  Array.from({length:6}, (_, i) => { const a = -Math.PI / 2 + (i + .5) * Math.PI / 3, x = 120 + 80 * Math.cos(a), y = 140 + 80 * Math.sin(a), d = a * 180 / Math.PI + 90;
    return `<path d="M-5 -6 L4 0 L-5 6" transform="translate(${x} ${y}) rotate(${d})" fill="none" stroke="${GE}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`; }).join("") +
  `<rect x="232" y="88" width="66" height="30" rx="6" fill="${RO}"/>` + TX(265, 108, "30 s", {s:14, c:CB}) + TX(265, 136, "Belastung", {s:12, c:HELL, w:600}) +
  `<rect x="304" y="88" width="56" height="30" rx="6" fill="${BL}"/>` + TX(332, 108, "30 s", {s:14, c:CB}) + TX(332, 136, "Pause", {s:12, c:HELL, w:600}) +

    {bild:fuenf(0), titel:"Ausdauer", text:"**Lange durchhalten**, ohne zu ermüden, und sich **schnell erholen**. Beispiele: Dauerlauf, Radtour, ein ganzes Basketballspiel. Es gibt **Grundlagenausdauer** (locker und lang) und **Kraftausdauer** (viele Wiederholungen mit Kraft)."},
    {bild:fuenf(1), titel:"Kraft", text:"Einen **Widerstand überwinden oder halten**: das eigene Körpergewicht, eine Hantel, einen Gegner. **Maximalkraft** ist die größte Kraft (z. B. Gewichtheben), **Schnellkraft** die Kraft in kürzester Zeit (z. B. Absprung), **Kraftausdauer** viele Wiederholungen (z. B. Liegestütze)."},

    {bild:fuenf(3), titel:"Beweglichkeit", text:"Der **Bewegungsspielraum** deiner **Gelenke** und die **Dehnfähigkeit** deiner **Muskeln**. Wichtig zum Beispiel beim Turnen, Tanzen oder Hürdenlauf. Beweglichkeit **geht schnell verloren**, wenn man sie nicht übt."},
    {bild:fuenf(4), titel:"Koordination", text:"Bewegungen **gezielt steuern**, gesteuert von **Gehirn und Nerven**. Dazu gehören **Gleichgewicht**, **Rhythmus**, **Orientierung** im Raum, **Reaktion** und das genaue **Dosieren** von Kraft. Beispiele: Balancieren, Jonglieren, Dribbeln."}

  gruppen: { titel:"Zusammenspiel der Fähigkeiten", folien:[

    {bild:fuenf(-1), titel:"Selten allein", text:"In fast jeder Sportart wirken **mehrere Fähigkeiten zusammen**. Beim **Basketball**: Koordination fürs Dribbeln, Schnelligkeit im Konter, Ausdauer für 40 Minuten. Beim **Turnen**: Kraft, Beweglichkeit und Koordination."},
    {bild:FOTO("mf8-sportarten","🏅","Verschiedene Sportarten"), titel:"Jede Sportart hat Schwerpunkte", text:"Der **Marathon** braucht vor allem **Ausdauer**, das **Gewichtheben** **Kraft**, der **100-m-Sprint** **Schnelligkeit** (und Schnellkraft). Wer seine Stärken kennt, findet leichter „seine“ Sportart."}

  testen: { titel:"Fähigkeiten testen", folien:[
    {bild:FOTO("mf8-ausdauertest","🏃","Ausdauertest"), titel:"Ausdauer testen", text:"Zum Beispiel mit einem **Dauerlauf über eine feste Zeit** (etwa 12 Minuten, Cooper-Test) oder einem **Pendellauf**, der immer schneller wird. Gemessen wird die **Strecke** oder die erreichte **Stufe**."},
    {bild:FOTO("mf8-sprungtest","🦘","Standweitsprung"), titel:"Kraft testen", text:"Der **Standweitsprung** aus dem Stand misst die **Schnellkraft** der Beine. **Liegestütze oder Sit-ups in 30 Sekunden** messen die **Kraftausdauer**."},
    {bild:FOTO("mf8-sprinttest","⏱️","20-m-Sprint"), titel:"Schnelligkeit & Beweglichkeit", text:"Ein **20-m-Sprint** aus dem Stand misst die **Schnelligkeit**. Die **Rumpfbeuge** im Stand oder Sitz (Wie weit kommen die Hände?) misst die **Beweglichkeit**."},
    {bild:FOTO("mf8-balance","🤹","Balancieren rückwärts"), titel:"Koordination testen", text:"**Rückwärts über einen Balken balancieren**, **seitlich hin und her springen** oder Bälle **jonglieren**: Gemessen wird, wie viele Schritte oder Sprünge **ohne Fehler** gelingen."}
  ]},
  zirkel: { titel:"Eine Zirkelstation planen", folien:[
    {bild:ZIRKEL, titel:"Der Fitness-Zirkel", text:"Beim **Zirkeltraining** gibt es mehrere **Stationen**. An jeder wird eine Übung gemacht, zum Beispiel **30 Sekunden Belastung**, dann **30 Sekunden Pause** und **Wechsel** zur nächsten Station."},
    {bild:fuenf(-1), titel:"Eine gute Station …", text:"… trainiert **eine Fähigkeit gezielt**, ist **sicher** aufgebaut, wird **verständlich beschrieben** (am besten mit Skizze) und hat eine klare **Dosierung**: Zeit oder Wiederholungen. Und sie lässt sich **leichter oder schwerer** machen."},
    {bild:FOTO("mf8-station","📋","Stationskarte"), titel:"Sicherheit zuerst", text:"Genug **Abstand** zu Wänden und anderen Stationen, **Matten** unter Sprüngen, nichts Rutschiges, Geräte **fest** aufgebaut. Lieber eine einfache Übung, die alle **sauber** ausführen können."}
  ]},
  reime: { titel:"Merk-Reime", folien:[
    {bild:fuenf(-1), titel:"Die fünf", text:"**„Ausdauer, Kraft und Schnelligkeit, Beweglichkeit, Koordination – fünf Fähigkeiten, eine Station!“**"},
    {bild:fuenf(0), titel:"Ausdauer", text:"**„Wer lange läuft und nicht ermüdet, hat Ausdauer gut ausgebrütet.“**"},
    {bild:fuenf(4), titel:"Koordination", text:"**„Balancieren, jonglieren, fein – Koordination muss es sein.“**"},
    {bild:GRUPPEN, titel:"Konditionell", text:"**„Kraft, Ausdauer, Tempo schnell – das nennt man auch konditionell.“**"}
  ]}
};

        {t:"5 Liegestütze", k:1}, {t:"30 Sekunden Wandsitz", k:1, e:"Halten gegen das eigene Gewicht: Kraft (genauer Kraftausdauer)."}, {t:"Klimmzug an der Stange", k:1},
        {t:"20 Sekunden Skippings, so schnell du kannst", k:2}, {t:"Auf ein Signal hin klatschen", k:2, e:"Schnell auf ein Signal reagieren: Reaktionsschnelligkeit."}, {t:"10-m-Sprint", k:2},

    { id:"gruppe", typ:"rush", lernen:"gruppen", icon:"⚡", titel:"Konditionell oder koordinativ?", art:"Speed-Game · 60 Sekunden",

      items:[
