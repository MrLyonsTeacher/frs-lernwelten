<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3A0E14">
<title>Herz-Lernwelt</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../lernwelt/lernwelt.css">
<link rel="stylesheet" href="sport-kit.css">
<style>
:root{
  color-scheme:light;
  --bg:#F5EFEF; --surface:#FFFFFF; --surface-2:#F9F3F3; --ink:#2B1418; --muted:#6A5458; --line:#DECFD0;
  --accent:#D3263A; --accent-ink:#FFFFFF; --accent-2:#FFC233; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#B42318; --bad-bg:#FBE2DE;
  --xray:#101A33; --glow:#FF5A3C;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #E2D4D5; --shadow:0 3px 0 #D6C4C6; --border-opt:2px solid #E2D4D5;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#FFE0E3; --card-back:#3A0E14; --tile-bg:#FFE9B8; --tile-ink:#2B1418;
  --chip-bg:#3A0E14; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #E2D4D5;
  --track:#E8DDDE; --star:#D3263A; --star-off:#E2D4D5;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(211,38,58,.12),transparent 42%)}
.chip{border:0}
.herz-hero{background:linear-gradient(160deg,#3A0E14 0,#7A1424 60%,#FF9A3D 170%)}
@media (prefers-reduced-motion: no-preference){ .herz-hero .schlag{transform-box:fill-box;transform-origin:50% 60%;animation:schlag 1.1s ease-in-out infinite}
  @keyframes schlag{0%,100%{transform:scale(1)}12%{transform:scale(1.1)}24%{transform:scale(.98)}36%{transform:scale(1.06)}}
  .herz-hero .ekg{stroke-dasharray:640;stroke-dashoffset:640;animation:ekg 2.2s linear infinite} @keyframes ekg{to{stroke-dashoffset:0}} }
</style>
</head>
<body>
<main class="lw" id="app"></main>

<script src="../qrcode.js"></script>
<script src="../ergebnis.js"></script>
<script src="../lernwelt/lernwelt.js"></script>
<script src="sport-kit.js"></script>
<script>
/* Bilder: ChatGPT-Illustrationen (sport/herz-bilder/NAME.webp), sobald vorhanden in BILDER eintragen. */
const BILDER = new Set([]);
const FOTO = (n, alt, ersatz) => BILDER.has(n) ? `<img class="lnbild" src="herz-bilder/${n}.webp" alt="${alt||""}">` : ersatz;

/* =========================================================
   Selbst gezeichnete Schaubilder
   ========================================================= */
const GE = "#FFD34D", OR = "#FF9A3D", GR = "#5BE38C", RO = "#FF6B6B", BL = "#5FE9FF", HG = "#9FB0CF", LI = "#C99BFF";
const ROT = "#E5404F", BLAU = "#4A86E8";
const zeile = (x, y, w, h, farbe, a, b, sa=13.5) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="8" height="${h}" rx="3" fill="${farbe}"/>` +
  TX(x + 18, y + (b ? h/2 - 3 : h/2 + 5), a, {s:sa, a:"start", c:"#FFFFFF"}) + (b ? TX(x + 18, y + h/2 + 14, b, {s:11, a:"start", c:HG, w:600}) : "");
const herzForm = (x, y, s, c) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 9 C0 -3 -17 -6 -17 5 C-17 14 -4 20 0 26 C4 20 17 14 17 5 C17 -6 0 -3 0 9 Z" fill="${c}"/>`;

// Herz mit Lungen- und Körperkreislauf (Schema, Blick von vorn: rechte Herzhälfte links im Bild)
function kreislauf(fig){
  const pf = (d, c, w=9) => `<path d="${d}" fill="none" stroke="#101A33" stroke-width="${w + 6}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const sp = (x, y, r, c) => `<path transform="translate(${x} ${y}) rotate(${r})" d="M-9 -8 L9 0 L-9 8 Z" fill="${c}" stroke="#101A33" stroke-width="1.5"/>`;
  const lab = (x, y, w, t, c, s=12.5) => `<rect x="${x}" y="${y}" width="${w}" height="${t.includes("|") ? 40 : 26}" rx="8" fill="#1E2C4D" stroke="${c}" stroke-width="2"/>` + TX(x + w/2, y + (t.includes("|") ? 16 : 18), t, {s, c});
  const Z = {
    hohlvene: { zr:[50,206,40,236, 74,334,86,40], g: pf("M156 430 L70 430 L70 216 L162 216", BLAU) + sp(112, 430, 180, BLAU) + sp(70, 330, -90, BLAU) + sp(130, 216, 0, BLAU) + lab(78, 352, 82, "Hohlvene", BLAU) },
    lungenarterie: { zr:[94,90,36,222, 4,30,114,34], g: `<path d="M162 300 L112 300 L112 104 L150 104" fill="none" stroke="#101A33" stroke-width="15" stroke-linejoin="round"/>` + pf("M162 300 L112 300 L112 104 L150 104", BLAU) + sp(112, 170, -90, BLAU) +
        `<line x1="112" y1="${36}" x2="112" y2="96" stroke="#FFFFFF" stroke-width="1.5" opacity=".7"/>` + lab(6, 32, 108, "Lungenarterie", BLAU) },
    lungenvene: { zr:[352,90,36,136, 362,30,114,34], g: pf("M330 104 L370 104 L370 216 L344 216", ROT) + sp(370, 160, 90, ROT) + lab(364, 32, 110, "Lungenvene", ROT) },
    aorta: { zr:[392,286,36,156, 416,320,62,34], g: pf("M344 300 L410 300 L410 430 L352 430", ROT) + sp(410, 370, 90, ROT) + sp(380, 430, 180, ROT) + lab(418, 322, 58, "Aorta", ROT) },
    lunge: { zr:[136,40,238,90], g: `<ellipse cx="195" cy="86" rx="56" ry="40" fill="#F4A6B8" stroke="#B5577A" stroke-width="2.5"/><ellipse cx="315" cy="86" rx="56" ry="40" fill="#F4A6B8" stroke="#B5577A" stroke-width="2.5"/>` +
        `<path d="M255 40 L255 60 M255 60 Q238 70 228 84 M255 60 Q272 70 282 84" stroke="#B5577A" stroke-width="4" fill="none"/>` + TX(195, 92, "Lunge", {s:15, c:"#5A1430"}) + TX(315, 92, "Lunge", {s:15, c:"#5A1430"}) },
    koerper: { zr:[150,396,204,70], g: `<rect x="156" y="402" width="192" height="58" rx="12" fill="#F2C9A6"/>` + TX(252, 425, "Körper", {s:15, c:"#3A2012"}) + TX(252, 445, "Muskeln & Organe", {s:12, c:"#3A2012", w:600}) },
    ra: { zr:[160,188,84,64], g: `<rect x="162" y="190" width="80" height="60" rx="10" fill="#3B5FA8"/>` + TX(202, 213, "rechter|Vorhof", {s:12.2, c:"#FFFFFF"}) },
    rv: { zr:[160,254,84,80], g: `<rect x="162" y="256" width="80" height="76" rx="10" fill="#2B4A8C"/>` + TX(202, 288, "rechte|Kammer", {s:12.2, c:"#FFFFFF"}) },
    la: { zr:[262,188,84,64], g: `<rect x="264" y="190" width="80" height="60" rx="10" fill="#C23447"/>` + TX(304, 213, "linker|Vorhof", {s:12.2, c:"#FFFFFF"}) },
    lv: { zr:[262,254,84,80], g: `<rect x="264" y="256" width="80" height="76" rx="10" fill="#9E1F33"/>` + TX(304, 288, "linke|Kammer", {s:12.2, c:"#FFFFFF"}) }
  };
  let s = `<line x1="253" y1="186" x2="253" y2="338" stroke="#FFFFFF" stroke-width="3" opacity=".5"/>` + TX(202, 180, "rechte Herzhälfte", {s:11, c:BL}) + TX(304, 180, "linke Herzhälfte", {s:11, c:RO});
  for(const [id, z] of Object.entries(Z)){
    const r = z.zr, zr = `<rect class="zr" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="10"/>` + (r.length > 4 ? `<rect class="zr" x="${r[4]}" y="${r[5]}" width="${r[6]}" height="${r[7]}" rx="10"/>` : "");
    s += fig ? `<g data-z="${id}">${zr}${z.g}</g>` : z.g; }
  s += TX(240, 476, "rot = sauerstoffreich · blau = sauerstoffarm", {s:12, c:HG, w:600});
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 480 486" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Herz mit Lungen- und Körperkreislauf"><rect width="480" height="486" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.kreislauf = () => kreislauf(true);

// Herzfrequenz-Zonen bei HFmax ≈ 205 (als Infokarte oder Antipp-Schaubild)
const ZONEN = [["z1","Z1","sehr locker","50–60 %","103–122",BL,"L"],["z2","Z2","locker – Grundlage","60–70 %","123–143",GR,"L"],["z3","Z3","mittel","70–80 %","144–163",GE,"L / M"],
  ["z4","Z4","hart","80–90 %","164–184",OR,"M"],["z5","Z5","maximal","90–100 %","185–205",RO,"M / K"]];
function zonen(fig){
  let s = TX(220, 28, "Herzfrequenz-Zonen (HFmax ≈ 205)", {s:16.5, c:"#FFFFFF"});
  ZONEN.forEach(([id,z,n,p,b,c,e],k) => { const y = 344 - (k+1)*60;
    const g = `<rect x="20" y="${y}" width="400" height="54" rx="10" fill="${c}" opacity=".92"/>` + TX(42, y + 35, z, {s:20, c:"#101A33", w:800}) +
      TX(78, y + 23, n, {s:14.5, a:"start", c:"#101A33"}) + TX(78, y + 42, p + " von HFmax", {s:11.5, a:"start", c:"#101A33", w:600}) + TX(408, y + 25, b, {s:15, a:"end", c:"#101A33"}) + TX(408, y + 43, "Schläge/min", {s:10.5, a:"end", c:"#101A33", w:600});
    s += fig ? `<g data-z="${id}"><rect class="zr" x="16" y="${y - 3}" width="408" height="60" rx="12"/>${g}</g>` : g; });
  s += TX(220, 366, "HFmax ≈ 220 − Alter · Werte sind grobe Richtwerte", {s:11.5, c:HG, w:600});
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 440 378" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Herzfrequenz-Zonen"><rect width="440" height="378" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.zonen = () => zonen(true);

// Pulskurven von Lena und Tom (Werte wie auf AB 01; Aufwärmen = Beispielwert)
const MP = ["Ruhe","Aufwärmen","4:4","1 min Pause","4:4","Sprint","Cool-down"], LENA = [68,118,176,124,178,188,96], TOM = [84,136,186,158,190,196,128];
function pulskurve(){
  const X = i => 70 + i * 52, Y = v => 266 - (v - 60) * 1.55;
  let s = ZONEN.map(([,z,,,b,c]) => { const [a, e] = b.split("–").map(Number); return `<rect x="56" y="${Y(e)}" width="336" height="${Y(a) - Y(e)}" fill="${c}" opacity=".14"/>` + TX(400, Y((a + e) / 2) + 4, z, {s:11, a:"start", c}); }).join("");
  [60,100,140,180].forEach(v => s += `<line x1="56" y1="${Y(v)}" x2="392" y2="${Y(v)}" stroke="#2A3A60" stroke-width="1"/>` + TX(50, Y(v) + 4, v, {s:11, a:"end", c:HG, w:600}));
  const kurve = (W, c, d) => `<path d="${W.map((v,i) => `${i ? "L" : "M"}${X(i)} ${Y(v)}`).join("")}" fill="none" stroke="${c}" stroke-width="4" ${d ? 'stroke-dasharray="8 5"' : ""} stroke-linejoin="round"/>` + W.map((v,i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${c}"/>`).join("");
  s += kurve(TOM, OR, true) + kurve(LENA, BL, false);
  s += MP.map((m,i) => TX(X(i), 290 + (i % 2) * 14, m, {s:10.5, c:"#FFFFFF", w:600})).join("");
  s += `<rect x="70" y="20" width="18" height="5" fill="${BL}"/>` + TX(94, 26, "Lena", {s:13, a:"start", c:BL}) + `<rect x="160" y="20" width="18" height="5" fill="${OR}"/>` + TX(184, 26, "Tom", {s:13, a:"start", c:OR}) + TX(392, 26, "Puls", {s:12, a:"end", c:HG});
  return KARTE(430, 318, s);
}
// Mias Ruhepuls über 12 Wochen (AB 02)
function mia(){
  const W = [76,75,74,73,71,70,75,72,69,67,66,65,65], X = i => 52 + i * 27, Y = v => 230 - (v - 60) * 10;
  let s = [60,65,70,75,80].map(v => `<line x1="44" y1="${Y(v)}" x2="384" y2="${Y(v)}" stroke="#2A3A60" stroke-width="1"/>` + TX(38, Y(v) + 4, v, {s:11.5, a:"end", c:HG, w:600})).join("");
  s += `<rect x="${X(7) - 13}" y="40" width="26" height="${Y(60) - 40}" fill="${RO}" opacity=".16"/>` + TX(X(7), 52, "krank", {s:12, c:RO});
  s += `<path d="${W.map((v,i) => `${i ? "L" : "M"}${X(i)} ${Y(v)}`).join("")}" fill="none" stroke="${BL}" stroke-width="4" stroke-linejoin="round"/>` + W.map((v,i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${BL}"/>`).join("");
  s += [0,2,4,6,8,10,12].map(i => TX(X(i), 252, "W" + i, {s:11, c:HG, w:600})).join("") + TX(214, 24, "Mias Ruhepuls (morgens im Liegen)", {s:15, c:"#FFFFFF"}) + TX(X(0) + 8, Y(76) - 10, "76", {s:12, c:BL}) + TX(X(12), Y(65) - 12, "65", {s:12, c:BL});
  return KARTE(410, 266, s);
}

const ICON = {
  herz: KARTE(380, 236, `${herzForm(110, 74, 4.2, "#C8263A")}<path d="M96 70 q14 -22 30 -4" stroke="#FFB3BE" stroke-width="5" fill="none" stroke-linecap="round"/>` +
    TX(270, 58, "Das Herz", {s:19, c:"#FFFFFF"}) + TX(270, 86, "ein Hohlmuskel", {s:13.5, c:HG, w:600}) + TX(270, 110, "so groß wie eine Faust", {s:13.5, c:HG, w:600}) + TX(270, 134, "etwa 300 g schwer", {s:13.5, c:HG, w:600}) +
    TX(270, 172, "ca. 100 000 Schläge", {s:15, c:GE}) + TX(270, 192, "pro Tag", {s:13, c:GE}) + TX(190, 226, "Es pumpt Blut durch den ganzen Körper.", {s:12.5, c:"#FFFFFF", w:600})),
  puls: KARTE(360, 220, `<path d="M20 120 L110 120 L126 78 L144 160 L160 100 L172 120 L240 120 L256 78 L274 160 L290 100 L302 120 L340 120" fill="none" stroke="${RO}" stroke-width="5" stroke-linejoin="round"/>` +
    TX(180, 36, "Puls messen", {s:18, c:"#FFFFFF"}) + TX(180, 186, "15 Sekunden zählen × 4 = Schläge pro Minute", {s:13, c:GE}) + TX(180, 206, "am Handgelenk (Daumenseite) oder am Hals", {s:11.5, c:HG, w:600})),
  energiewege: KARTE(400, 260, TX(200, 26, "Drei Energiewege", {s:17, c:"#FFFFFF"}) +
    [["K","kurz-explosiv","bis ca. 10 s · Sofortspeicher im Muskel,|ohne Sauerstoff · Sprint, Sprung, Wurf",RO],["M","mittel-hart","ca. 10 s bis 2 min · Zucker ohne genug|Sauerstoff · Muskeln „brennen“, schnell müde",OR],["L","lang-locker","ab ca. 2 min · Zucker und Fett mit|Sauerstoff (aerob) · lange, aber langsamer",GR]].map(([b,a,u,c],k) => { const y = 42 + k*72;
      return `<rect x="12" y="${y}" width="376" height="64" rx="12" fill="#1E2C4D"/><rect x="12" y="${y}" width="56" height="64" rx="12" fill="${c}"/>` + TX(40, y + 43, b, {s:30, c:"#101A33", w:800}) +
        TX(80, y + 22, a, {s:15, a:"start", c}) + TX(80, y + 40, u, {s:10.6, a:"start", c:"#FFFFFF", w:600}); }).join("")),
  kette: KARTE(400, 236, TX(200, 26, "Warum steigt der Puls?", {s:17, c:"#FFFFFF"}) +
    [["Muskeln|arbeiten stark",OR],["brauchen mehr|Sauerstoff",BL],["Herz schlägt|schneller",RO],["mehr Blut zu|den Muskeln",GR]].map(([t,c],k) => { const x = 12 + k*97;
      return `<rect x="${x}" y="50" width="86" height="80" rx="12" fill="#1E2C4D" stroke="${c}" stroke-width="2.5"/>` + TX(x + 43, 84, t, {s:11.8, c}) + (k < 3 ? PFEIL(x + 87, 90, x + 96, 90, "#FFFFFF", 2.5) : ""); }).join("") +
    `<rect x="12" y="146" width="376" height="74" rx="12" fill="#14301F"/>` + TX(200, 174, "Pause: Bedarf sinkt → Puls sinkt.", {s:14, c:GR}) + TX(200, 198, "Ein trainiertes Herz muss seltener schlagen.", {s:12.5, c:"#FFFFFF", w:600})),
  erholung: KARTE(380, 236, TX(190, 28, "Der Erholungs-Check", {s:17, c:"#FFFFFF"}) +
    SCHILD(16, 44, 348, 46, "Erholungswert = Puls direkt danach − Puls nach 1 min Pause", {s:12.4, c:"#FFFFFF"}) +
    zeile(16, 102, 348, 36, GR, "über 40 Schläge: sehr schnelle Erholung", "") + zeile(16, 144, 348, 36, GE, "25 bis 40: gute Erholung", "") + zeile(16, 186, 348, 36, OR, "unter 25: da geht noch was", "") +
    TX(190, 232, "grobe Orientierung · ± 4 Schläge Messfehler sind normal", {s:10.8, c:HG, w:600})),
  einfluss: KARTE(400, 236, TX(200, 26, "Was den Puls noch beeinflusst", {s:16, c:"#FFFFFF"}) +
    [["Ausdauer","mehr Blut pro Schlag",GR],["Tagesform","Schlaf, Krankheit",GE],["Aufregung","Nervosität",LI],["Hitze & Trinken","zu wenig getrunken",OR],["Messfehler","falsch gezählt",RO],["persönliche HFmax","bei jedem anders",BL]].map(([a,b,c],k) =>
      zeile(k % 2 ? 204 : 12, 40 + Math.floor(k/2)*64, 184, 56, c, a, b, 13)).join("")),
  hmv: KARTE(420, 266, TX(210, 26, "Wie viel Blut pumpt das Herz?", {s:16, c:"#FFFFFF"}) +
    SCHILD(14, 40, 392, 36, "Herzminutenvolumen = Puls × Schlagvolumen", {s:13.5, c:GE}) +
    `<rect x="14" y="86" width="392" height="26" rx="6" fill="#2A3A60"/>` + ["","Puls","Schlagvol.","pro Minute"].map((t,k) => TX([70,186,270,360][k], 104, t, {s:11.5, c:HG})).join("") +
    [["Tom · Ruhe","75","70 ml","5,3 l",OR],["Lena · Ruhe","52","100 ml","5,2 l",BL],["Tom · Belastung","195","100 ml","19,5 l",OR],["Lena · Belastung","195","140 ml","27,3 l",BL]].map(([a,p,v,h,c],k) => { const y = 116 + k*34;
      return `<rect x="14" y="${y}" width="392" height="30" rx="6" fill="${k % 2 ? "#17243F" : "#1E2C4D"}"/>` + TX(24, y + 20, a, {s:12.5, a:"start", c}) + TX(186, y + 20, p, {s:13}) + TX(270, y + 20, v, {s:13}) + TX(360, y + 20, h, {s:14, c:GE}); }).join("") +
    TX(210, 260, "Gleiche Leistung in Ruhe – Lena braucht viel weniger Schläge.", {s:11.5, c:HG, w:600})),
  anpassungen: KARTE(420, 280, TX(210, 26, "Was Ausdauertraining verändert", {s:16, c:"#FFFFFF"}) +
    [["Herzmuskel kräftiger","mehr Blut pro Schlag",RO],["Ruhepuls sinkt","Herz arbeitet sparsamer",GE],["mehr Kapillaren","O₂ leichter in die Muskeln",BL],["mehr Mitochondrien","mehr Energie mit Sauerstoff",GR],["mehr Blut im Körper","mehr O₂-Transportmittel",LI],["Puls sinkt schneller","schnellere Erholung",OR]].map(([a,b,c],k) =>
      zeile(k % 2 ? 214 : 12, 40 + Math.floor(k/2)*78, 194, 68, c, a, b, 13)).join("")),
  ruhepuls: KARTE(380, 236, TX(190, 28, "Den echten Ruhepuls messen", {s:16.5, c:"#FFFFFF"}) +
    [["morgens direkt nach dem Aufwachen",GE],["noch im Liegen, vor dem Aufstehen",BL],["60 Sekunden lang zählen",GR],["immer unter denselben Bedingungen",LI]].map(([t,c],k) => zeile(16, 44 + k*44, 348, 38, c, t, "", 13.5)).join("") +
    TX(190, 226, "Typisch bei Jugendlichen: etwa 60–80 Schläge/min", {s:11.6, c:HG, w:600})),
  sportherz: KARTE(380, 220, herzForm(100, 70, 2.6, "#B52A3D") + herzForm(270, 56, 3.4, "#D3263A") + TX(100, 186, "untrainiert", {s:13, c:HG}) + TX(270, 186, "Sportherz", {s:14, c:GE}) +
    TX(190, 30, "Das Sportherz", {s:17, c:"#FFFFFF"}) + TX(190, 210, "kräftiger, etwas größer – gesund, bildet sich ohne Training zurück", {s:11, c:"#FFFFFF", w:600}))
};
ICON.gefaesse = KARTE(380, 220, TX(190, 30, "Arterien und Venen", {s:17, c:"#FFFFFF"}) + herzForm(190, 86, 1.7, "#C8263A") +
  PFEIL(218, 112, 340, 112, RO, 6) + PFEIL(46, 150, 160, 150, BLAU, 6) +
  TX(280, 96, "Arterien", {s:15, c:RO}) + TX(280, 136, "vom Herzen weg", {s:12, c:"#FFFFFF", w:600}) + TX(100, 136, "Venen", {s:15, c:BL}) + TX(100, 176, "zum Herzen hin", {s:12, c:"#FFFFFF", w:600}) +
  TX(190, 206, "Merke: Arterie = Abfahrt vom Herzen", {s:12.5, c:GE}));

/* =========================================================
   Inhalte (E1; abgestimmt auf AB 01 und 02)
   ========================================================= */
const LERNEN = {
  herz: { titel:"Herz, Lungen- & Körperkreislauf", folien:[
    {bild:ICON.herz, titel:"Das Herz", text:"Das Herz ist ein **Hohlmuskel**, etwa so groß wie deine **Faust** und rund **300 g** schwer. Es schlägt etwa **100 000-mal am Tag** und pumpt das Blut durch den ganzen Körper – ein Leben lang, ohne Pause."},
