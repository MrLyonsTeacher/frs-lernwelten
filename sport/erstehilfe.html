<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B5261E">
<title>Erste-Hilfe-Lernwelt</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../lernwelt/lernwelt.css">
<link rel="stylesheet" href="sport-kit.css">
<style>
.ln-art img.lnbild{display:block;width:100%;height:auto;max-height:min(58vh,calc(var(--avail,700px) - 260px));object-fit:contain;margin:0 auto;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.ln-stage:has(.lnbild){grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.4rem}
.ln-art:has(.lnbild){align-self:stretch;display:flex;align-items:center;justify-content:center}
.ln-art > span:has(.lnbild){display:block;width:100%;animation:lnPop .6s both}
@media (max-aspect-ratio:1/1), (max-width:640px){ .ln-stage:has(.lnbild){grid-template-columns:1fr;overflow-y:auto} .ln-art img.lnbild{max-height:32vh;width:auto;max-width:100%} }
:root{
  color-scheme:light;
  --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#F7F4EF; --ink:#1E2430; --muted:#5D6472; --line:#D8D2C7;
  --accent:#C8261C; --accent-ink:#FFFFFF; --accent-2:#FF9F1C; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#B42318; --bad-bg:#FBE2DE;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #DDD6CA; --shadow:0 3px 0 #D3CBBE; --border-opt:2px solid #DDD6CA;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#FFE0DC; --card-back:#7A1712; --tile-bg:#FFE7C2; --tile-ink:#1E2430;
  --chip-bg:#1E2430; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #DDD6CA;
  --track:#E6E0D6; --star:#C8261C; --star-off:#DDD6CA;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(255,159,28,.14),transparent 42%)}
.chip{border:0}
/* Startbild: Bergwacht-Station mit Hubschrauber */
.berg-hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#2B3F66 0,#E58A4E 62%,#F6C27A 100%);color:#fff;padding:clamp(1.4rem,4vw,2.4rem);min-height:270px;isolation:isolate}
.berg-hero .kicker{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:#FFE08A;margin:0;letter-spacing:.04em}
.berg-hero h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,8.5vw,4.6rem);line-height:.92;margin:.3rem 0 .7rem;max-width:12ch;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.berg-hero p{margin:0 0 .6rem;max-width:36ch;color:#FFF3E2;font-size:1.06rem;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.berg-hero .hero-art{position:absolute;right:0;top:0;height:100%;width:62%;z-index:-1}
@media (max-width:640px){ .berg-hero .hero-art{opacity:.35;width:100%} }
.rotor{transform-box:fill-box;transform-origin:50% 50%}
.heli{transform-box:fill-box}
.blink{transform-box:fill-box}
@media (prefers-reduced-motion: no-preference){
  .rotor{animation:rot .35s linear infinite} @keyframes rot{from{transform:scaleX(1)}50%{transform:scaleX(.15)}to{transform:scaleX(1)}}
  .heli{animation:hover 3.2s ease-in-out infinite} @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .blink{animation:bl 1.2s steps(1) infinite} @keyframes bl{50%{opacity:.15}}
}
</style>
</head>
<body>
<main class="lw" id="app"></main>

<script src="../qrcode.js"></script>
<script src="../ergebnis.js"></script>
<script src="../lernwelt/lernwelt.js"></script>

    <path d="M150 40 l-14 22" stroke="#FFE08A" stroke-width="5" stroke-linecap="round"/><path d="M136 62 l0 -12 M136 62 l11 -4" stroke="#FFE08A" stroke-width="5" stroke-linecap="round"/>
    ${T(110,164,"Kopf nach VORNE beugen","#FFE08A",15)}${T(110,186,"Nase zudrücken, Nacken kühlen")}`),
  bruch: svgBox("0 0 220 200", `${BG()}
    <rect x="30" y="80" width="68" height="22" rx="10" fill="#F4E9D2"/><rect x="120" y="86" width="70" height="22" rx="10" fill="#F4E9D2" transform="rotate(10 155 97)"/>
    <path d="M98 78 l10 8 l-8 6 l12 10" stroke="#FF5A4F" stroke-width="4" fill="none"/>

  kopf: svgBox("0 0 220 200", `${BG()}
    <circle cx="110" cy="80" r="42" fill="#F2C9A6"/>${[0,1,2].map(i=>`<path d="M${70+i*40} 26 l6 -12 l6 12 l-6 4z" fill="#FFE08A"/>`).join("")}

  seitenlage: svgBox("0 0 220 200", `${BG()}
    <rect x="16" y="140" width="188" height="10" rx="4" fill="#6B7487"/>
    <circle cx="44" cy="118" r="16" fill="#F2C9A6"/><path d="M60 122 C90 112 130 112 160 120" stroke="#3B6FD6" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M150 122 L178 104 L196 136" stroke="#3B6FD6" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M86 120 L74 138" stroke="#F2C9A6" stroke-width="10" stroke-linecap="round"/>
    ${T(110,40,"bewusstlos, atmet","#FFE08A",16)}${T(110,62,"→ stabile Seitenlage")}${T(110,186,"Mund ist tiefster Punkt")}`),
  herz: svgBox("0 0 220 200", `${BG()}
    ${[["1","Prüfen",8],["2","Rufen",78],["3","Drücken",148]].map(([n,t,x])=>`<rect x="${x}" y="14" width="64" height="150" rx="12" fill="#3B4253"/><circle cx="${x+14}" cy="28" r="10" fill="#FFE08A"/>${T(x+14,33,n,"#1E2430",13)}${T(x+32,154,t,"#FFE08A",12)}`).join("")}
    <circle cx="40" cy="78" r="16" fill="#F2C9A6"/><path d="M28 74 q12 8 24 0" fill="none" stroke="#2A2F3D" stroke-width="2"/>
    <path d="M18 104 q22 -10 44 0" fill="none" stroke="#9FD8FF" stroke-width="3"/><path d="M22 116 q18 -8 36 0" fill="none" stroke="#9FD8FF" stroke-width="3"/>${T(40,136,"max. 10 s","#D7E0F0",10)}
    <rect x="96" y="50" width="28" height="56" rx="6" fill="#E9EDF5"/><rect x="100" y="57" width="20" height="38" rx="3" fill="#C8261C"/>${T(110,81,"112","#FFF",9)}

    <path d="M60 96 a50 50 0 0 1 100 0 v10 h-100z" fill="#FF9F1C"/><rect x="56" y="104" width="108" height="10" rx="5" fill="#C8261C"/>

    ${T(110,40,"Helm & Schoner","#FFE08A",16)}${T(110,192,"Ausrüstung schützt")}`),

    <circle cx="80" cy="84" r="26" fill="none" stroke="#FFE08A" stroke-width="8"/><circle cx="140" cy="84" r="16" fill="none" stroke="#FFE08A" stroke-width="6"/>

/* Stabile Seitenlage Schritt für Schritt (Blick von oben, Kopf rechts, Helferin unten) */
function seitenlage(n){
  const SKIN="#F2C9A6", SKIN_D="#D9A27E", SHIRT="#8E6CC8", SHIRT_D="#6E4FA8", JEANS="#5B8BD6", JEANS_D="#3F6DB8", SHOE="#7A4A2A", OUT="#2A2F3D";
  const pts = a => a.map(p=>p.join(" ")).join(" L");
  // Glied mit Umriss; optional Naht (dunklere Linie in der Mitte)
  const L = (a, w, col, naht) => `<path d="M${pts(a)}" fill="none" stroke="${OUT}" stroke-width="${w+3}" stroke-linecap="round" stroke-linejoin="round"/><path d="M${pts(a)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`+
    (naht ? `<path d="M${pts(a)}" fill="none" stroke="${naht}" stroke-width="1.2" stroke-dasharray="3 2.5" stroke-linecap="round" stroke-linejoin="round"/>` : "");
  // Hand: Handfläche + Daumen + Finger angedeutet, Richtung a (Grad)
  const hand = (x,y,a,glove) => `<g transform="translate(${x} ${y}) rotate(${a})"><path d="M-3 -5 L7 -5 C11 -5 12 -2 12 0 C12 2 11 5 7 5 L-3 5 Z" fill="${glove||SKIN}" stroke="${OUT}" stroke-width="1.2"/><path d="M7 -2.5 L11 -2.5 M7 0 L12 0 M7 2.5 L11 2.5" stroke="${glove?"#7D8590":SKIN_D}" stroke-width=".9"/><ellipse cx="2" cy="-6.5" rx="3.6" ry="2" fill="${glove||SKIN}" stroke="${OUT}" stroke-width="1"/></g>`;
  const schuh = (x,y,a) => `<g transform="translate(${x} ${y}) rotate(${a})"><path d="M-6 -6 C4 -7 10 -4 10 0 C10 4 4 7 -6 6 Z" fill="${SHOE}" stroke="${OUT}" stroke-width="1.2"/><path d="M-4 -5.5 L-4 5.5" stroke="#4A2C18" stroke-width="2"/></g>`;
  const kopf = (x,y,seite,offen) => {
    let k = `<ellipse cx="${x+8}" cy="${y+(seite?-11:0)}" rx="${seite?4:0}" ry="3" fill="${SKIN}" stroke="${OUT}"/>`;
    k += `<circle cx="${x}" cy="${y}" r="13" fill="${SKIN}" stroke="${OUT}" stroke-width="1.5"/>`;
    if(!seite){
      k += `<path d="M${x+1} ${y-13} C${x+12} ${y-14} ${x+17} ${y-6} ${x+16} ${y} C${x+17} ${y+6} ${x+12} ${y+14} ${x+1} ${y+13} C${x+8} ${y+8} ${x+9} ${y-8} ${x+1} ${y-13} Z" fill="#F2C230" stroke="${OUT}" stroke-width="1.2"/>`+
           `<ellipse cx="${x+2}" cy="${y-14}" rx="3" ry="2.2" fill="${SKIN}" stroke="${OUT}"/><ellipse cx="${x+2}" cy="${y+14}" rx="3" ry="2.2" fill="${SKIN}" stroke="${OUT}"/>`+
           `<path d="M${x-3} ${y-7} q-2 1.5 0 3 M${x-3} ${y+4} q-2 1.5 0 3" fill="none" stroke="${OUT}" stroke-width="1.3"/><path d="M${x-8} ${y-1} l-3 1 l3 1" fill="none" stroke="${SKIN_D}" stroke-width="1.3"/><path d="M${x-10} ${y-3} q-1 3 0 6" fill="none" stroke="#B5524F" stroke-width="1.4"/>`;
    } else {
      k += `<path d="M${x-10} ${y-8} C${x-2} ${y-18} ${x+16} ${y-12} ${x+15} ${y+2} C${x+14} ${y+8} ${x+10} ${y+10} ${x+6} ${y+6} C${x+8} ${y-2} ${x} ${y-8} ${x-10} ${y-8} Z" fill="#F2C230" stroke="${OUT}" stroke-width="1.2"/>`+
           `<ellipse cx="${x+2}" cy="${y+1}" rx="2.6" ry="3.2" fill="${SKIN}" stroke="${OUT}"/><path d="M${x-7} ${y+1} q1.5 2 3 0" fill="none" stroke="${OUT}" stroke-width="1.3"/><path d="M${x-12} ${y+4} l-1 3 l3 0" fill="none" stroke="${SKIN_D}" stroke-width="1.3"/>`+
           (offen ? `<ellipse cx="${x-8}" cy="${y+10}" rx="3" ry="2" fill="#8A2A2A" stroke="${OUT}" stroke-width=".8"/>` : `<path d="M${x-10} ${y+9} q3 1 5 0" fill="none" stroke="#B5524F" stroke-width="1.4"/>`);
    }
    return k;
  };
  const rumpf = (x,y,w,h) => `<path d="M${x} ${y+8} C${x} ${y} ${x+6} ${y} ${x+14} ${y} L${x+w-12} ${y} C${x+w-2} ${y} ${x+w} ${y+6} ${x+w} ${y+h/2} C${x+w} ${y+h-6} ${x+w-2} ${y+h} ${x+w-12} ${y+h} L${x+14} ${y+h} C${x+6} ${y+h} ${x} ${y+h} ${x} ${y+h-8} Z" fill="${SHIRT}" stroke="${OUT}" stroke-width="1.5"/>`+
    `<path d="M${x+w-4} ${y+h/2-9} L${x+w-12} ${y+h/2} L${x+w-4} ${y+h/2+9}" fill="none" stroke="${SHIRT_D}" stroke-width="1.6"/>`+
    `<path d="M${x+8} ${y+3} L${x+8} ${y+h-3}" stroke="#3B2F2A" stroke-width="4"/><rect x="${x+5.5}" y="${y+h/2-3}" width="5" height="6" fill="#D9B64A"/>`+
    `<path d="M${x-6} ${y+4} C${x-2} ${y} ${x+4} ${y} ${x+6} ${y+4} L${x+6} ${y+h-4} C${x+4} ${y+h} ${x-2} ${y+h} ${x-6} ${y+h-4} Z" fill="${JEANS}" stroke="${OUT}" stroke-width="1.2"/>`;
  const pfeil = d => `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".5"/><path d="${d}" fill="none" stroke="#FF4A3F" stroke-width="4" stroke-linecap="round"/>`;
  const spitze = (x,y,a) => `<path d="M0 0 L-11 -7 L-11 7 Z" fill="#FF4A3F" transform="translate(${x} ${y}) rotate(${a})"/>`;
  // Helferin: kniet unten, Warnweste, Zopf, Arme mit Handschuhen zu den Griffpunkten
  const helferin = (hx, ziele) => {
    const GL = "#C9CED6", SY = 166;
