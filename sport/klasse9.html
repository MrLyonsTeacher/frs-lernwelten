<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1030">
<title>Athletopolis – Sport Klasse 9</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Athletopolis – Sport-Welt Klasse 9.
   Gemalte Bilder (Übersicht + ein Bild je Viertel), darüber Effekte (SVG) und antippbare Orte.
   Antippen = kurzer „Kameraflug“: hineinzoomen + verwischen + überblenden zum Nahbild. */
:root{ --ink:#fff; --night:#1A1030; --gold:#FFC94D; --panel:rgba(22,14,44,.82); --top:56px;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif; --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; }
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--night)}
.frame{position:absolute;left:50%;top:50%;width:max(100vw,150vh);height:max(66.667vw,100vh);transform:translate(-50%,-50%)}
.frame[hidden]{display:none}
.cam,.drift{position:absolute;inset:0}
.cam{will-change:transform,filter,opacity}
.drift img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.drift svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  .drift{animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.035) translate(-.4%,.3%)}}
  .fly-out{animation:flyOut .55s cubic-bezier(.5,0,.9,.5) forwards}
  .fly-in{animation:flyIn .55s cubic-bezier(.1,.6,.3,1) .12s both}
  .back-out{animation:backOut .5s cubic-bezier(.5,0,.9,.5) forwards}
  .back-in{animation:backIn .55s cubic-bezier(.1,.6,.3,1) .1s both}
  @keyframes flyOut{to{transform:scale(3.6);filter:blur(10px);opacity:0}}
  @keyframes flyIn{from{transform:scale(1.5);filter:blur(14px);opacity:0}to{transform:none;filter:none;opacity:1}}
  @keyframes backOut{to{transform:scale(.6);filter:blur(12px);opacity:0}}
  @keyframes backIn{from{transform:scale(3.2);filter:blur(12px);opacity:0}to{transform:none;filter:none;opacity:1}}
  .fx .pulse{animation:pulse 3.2s ease-in-out infinite}
  .fx .beat{animation:beat 1.1s ease-in-out infinite}
  .fx .flick{animation:flick 2.3s steps(1) infinite}
  .fx .blink{animation:blink 1.6s steps(1) infinite}
  .fx .puff{animation:puff 5s linear infinite}
  .fx .tw{animation:tw 2.6s ease-in-out infinite}
  .fx .fly{animation:ff 9s ease-in-out infinite}
  .veil .fog{animation:fog 9s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}
  @keyframes beat{0%,100%{opacity:.25;transform:scale(.94)}12%{opacity:.95;transform:scale(1.06)}24%{opacity:.4;transform:scale(.98)}36%{opacity:.85;transform:scale(1.04)}60%{opacity:.25;transform:scale(.94)}}
  @keyframes flick{0%,100%{opacity:.55}40%{opacity:.85}46%{opacity:.35}52%{opacity:.9}80%{opacity:.6}}
  @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
  @keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.5}100%{opacity:0;transform:translate(26px,-110px) scale(2.2)}}
  @keyframes tw{0%,100%{opacity:0}50%{opacity:.95}}
  @keyframes ff{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:.9}50%{transform:translate(18px,-22px)}70%{opacity:.7}}
  @keyframes fog{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
  .spot .pin{animation:pin 2.4s ease-in-out infinite}
  @keyframes pin{50%{box-shadow:0 0 0 10px rgba(255,201,77,0)}}
}
.fx *{transform-box:fill-box;transform-origin:center}
.fx .pulse,.fx .beat,.fx .flick{opacity:.55}
.fx .puff,.fx .tw,.fx .fly,.fx .blink{opacity:0}
@media (prefers-reduced-motion: reduce){ .fx .puff,.fx .tw,.fx .fly{display:none} .fx .blink{opacity:1} }

/* Orte */
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.3rem;background:none;border:0;padding:.4rem;z-index:2}
.spot .pin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;background:rgba(22,14,44,.78);border:3px solid var(--gold);box-shadow:0 0 0 0 rgba(255,201,77,.7)}
.spot .lbl{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:1.05rem;line-height:1;background:var(--panel);padding:.32rem .6rem;border-radius:999px;white-space:nowrap;border:1px solid rgba(255,255,255,.22)}
.spot small{display:block;font-family:var(--font-body);font-weight:400;text-transform:none;letter-spacing:0;font-size:.72rem;opacity:.85;margin-top:.15rem;text-align:center}
.spot.zu .pin{border-color:#9C93B8;filter:grayscale(.6);animation:none}
.spot.zu .lbl{opacity:.8}
.spot:focus-visible .pin,.spot:hover .pin{background:var(--gold);color:#1A1030}

/* Kopf, Karte, Hinweis */
.top{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:.6rem;padding:0 .8rem;z-index:5;background:linear-gradient(rgba(22,14,44,.85),rgba(22,14,44,0))}
.top h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.5rem;margin:0;letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.top .sub{font-size:.85rem;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.top .sp{flex:1}
.tb{background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.45rem .9rem;font-weight:700;text-decoration:none;color:#fff;font-size:.95rem;min-height:40px;display:inline-flex;align-items:center;gap:.35rem}
.tb[hidden]{display:none}
.card{position:fixed;left:max(.8rem,env(safe-area-inset-left));bottom:max(.8rem,env(safe-area-inset-bottom));width:min(360px,calc(100vw - 1.6rem));background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:.9rem 1rem;z-index:4}
.card[hidden]{display:none}
.card h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.6rem;line-height:1;margin:0 0 .15rem}
.card .e{color:var(--gold);font-weight:700;font-size:.85rem;margin:0 0 .4rem}
.card p{margin:.2rem 0 .6rem;font-size:.95rem;line-height:1.35}
.th{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:.5rem .65rem;margin-top:.4rem;min-height:48px}
.th .i{font-size:1.4rem;width:1.8rem;text-align:center}
.th b{display:block;line-height:1.15}
.th span.s{font-size:.8rem;opacity:.8}
.th:not(.zu):hover{background:rgba(255,201,77,.25);border-color:var(--gold)}
.th.zu{opacity:.55;cursor:default}
.th.go{background:var(--gold);color:#1A1030;border-color:var(--gold)} .th.go:hover{background:#FFD978}
.toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(255,255,255,.3);padding:.6rem 1rem;border-radius:999px;font-weight:700;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.dock{display:none}
.fade{position:fixed;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.fade.on{opacity:1}

/* Hochformat (Handy): Bild oben, Orte als Liste darunter */
@media (orientation:portrait){
  body{overflow:auto}
  .stage{position:relative;inset:auto;height:auto;min-height:100%;padding-top:var(--top)}
  .frame{position:relative;left:0;top:0;transform:none;width:100vw;height:66.667vw;overflow:hidden}
  .frame[hidden]{display:none}
  .spot .lbl{display:none} .spot .pin{width:30px;height:30px;font-size:.9rem;border-width:2px} .spot{padding:.1rem}
  .top{position:fixed;background:var(--night)} .top .sub{display:none}
  .dock{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.7rem}
  .dock[hidden]{display:none}
  .dock .th{margin:0}
  .card{position:relative;left:auto;bottom:auto;width:auto;margin:.7rem;backdrop-filter:none}
  .toast{bottom:8%;white-space:normal;width:max-content;max-width:92vw;text-align:center;border-radius:16px}
}
</style>
</head>
<body>
<div class="top">
  <button class="tb" id="back" hidden>← Stadt</button>
  <a class="tb" id="home" href="../index.html" aria-label="Zur Startseite">🏠</a>
  <div><h1 id="ttl">Athletopolis</h1></div><span class="sub" id="sub">Profil Sport · Klasse 9 · Tippe auf ein Stadtviertel</span>
  <span class="sp"></span>
</div>
<div class="stage" id="stage">
  <div class="frame" id="fOver"><div class="cam"><div class="drift" id="dOver"></div></div></div>
  <div class="frame" id="fDet" hidden><div class="cam"><div class="drift" id="dDet"></div></div></div>
  <div class="frame" id="fSub" hidden><div class="cam"><div class="drift" id="dSub"></div></div></div>
  <div class="dock" id="dock"></div>
  <div class="card" id="card" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="fade" id="fade"></div>

<script>
/* =========================================================
   Inhalt der Welt. Koordinaten = Bildpunkte im 1536 × 1024-Bild.
   offen:true  → Viertel ist freigeschaltet.  Themen: pfad = fertige Lernwelt, sonst „kommt bald“.
   ========================================================= */
const ORTE = [
  { id:"herz", name:"Herz-Kraftwerk", icon:"❤️", einheit:"E1 · Herz-Kreislauf & Energie", x:965, y:262, veil:[165,115], offen:false,
    text:"Hier schlägt das Herz der Stadt: Es pumpt Blut und Sauerstoff durch alle Adern-Bahnen.",
    themen:[{t:"Herz, Lungen- & Körperkreislauf", i:"🫀"},{t:"Energiewege & Herzfrequenz-Zonen", i:"⚡"},{t:"Was meine Pulskurve verrät", i:"📈"},{t:"Ausdauer macht das Herz stark", i:"🏃"}],
    fx:[["glow",830,350,250,"#FF5A3C","beat"],["smoke",440,165],["smoke",580,85],["sun",215,95],["flies",[60,620,1480,980],10]] },
  { id:"werft", name:"Skelett-Werft", icon:"🦴", einheit:"E2 · Bewegungsapparat & Verletzungen", x:585, y:655, veil:[0,0], offen:true,
    text:"In der Werft wird der Bewegungsapparat gebaut und repariert. Tippe auf ein Gebäude.",
    themen:[
      {t:"Knochen & Skelett", s:"Röntgen-Klinik", i:"🩻", pfad:"knochen.html", x:835, y:455, bild:"klinik",
        text:"In der Röntgen-Klinik schaust du durch die Haut: Skelett, Aufbau der Knochen und wie sie stark bleiben.",
        fx:[["glow",860,410,150,"#5FE9FF","flick"],["glow",1150,500,60,"#5FE9FF","flick"],["sun",150,80],["water",[0,800,600,1000],10],["flies",[300,560,1500,980],8]]},
      {t:"Gelenke, Bänder, Sehnen & Knorpel", s:"Robo-Werkstatt", i:"🦾", pfad:"gelenke.html", x:1115, y:500, bild:"werkstatt",
        text:"In der Robo-Werkstatt wird ein Athlet gebaut: Gelenke als Scharniere und Kugellager, Bänder und Sehnen als Stahlseile.",
        fx:[["sparks",[925,395,1025,475],14,"#FFF0A8"],["glow",975,432,60,"#FFE08A","flick"],["glow",860,520,240,"#FFA53C","pulse"],["smoke",765,90],["smoke",860,70],["smoke",945,125],["sun",190,95],["flies",[60,700,1480,1000],8]]},
      {t:"Sportverletzungen & ihre Ursachen", s:"Flutlicht-Stadion", i:"🏟️", x:810, y:235, veil:[170,105], bild:"stadion",
        text:"Im Stadion passiert’s: Umknicken, Zerrung, Prellung. Hier ermittelst du, was verletzt ist und warum.",
        fx:[["glow",635,180,80,"#FFF3C4","flick"],["glow",980,170,80,"#FFF3C4","flick"],["glow",520,235,70,"#FFF3C4","flick"],["glow",1065,240,70,"#FFF3C4","flick"],["smoke",1362,255],["sun",172,75],["water",[0,820,420,1000],8]]},
      {t:"Erste Hilfe & Vorbeugen", s:"Bergwacht-Station", i:"🚁", x:1320, y:265, veil:[180,125], bild:"bergwacht",
        text:"Die Bergwacht ist zur Stelle: Erste Hilfe bei Sportverletzungen und wie du mit Aufwärmen vorbeugst.",
        fx:[["blink",893,35],["blink",925,80],["glow",1070,430,130,"#FFC65A","pulse"],["glow",180,520,60,"#FFF3C4","flick"],["glow",300,485,60,"#FFF3C4","flick"],["sun",195,95],["flies",[60,600,1480,1000],8]]} ],
    fx:[["glow",832,470,70,"#5FE9FF","flick"],["glow",1110,520,110,"#FFA53C","pulse"],["sparks",[1040,470,1190,590],9,"#FFE08A"],["smoke",975,325],["smoke",1080,315],
        ["blink",1356,100],["sun",172,70],["water",[40,780,700,990],12],["flies",[200,300,1450,700],8]] },
  { id:"muskel", name:"Muskel-Fitnesscenter", icon:"🏋️", einheit:"E3 · Training & Fitness", x:590, y:195, veil:[200,95], offen:false,
    text:"Im Fitnesscenter wird trainiert: Belastung, Erholung und der eigene Trainingsplan.",
    themen:[{t:"Was ist Training? – Fitness messen", i:"⏱️"},{t:"Superkompensation", i:"📊"},{t:"Trainingsprinzipien & -methoden", i:"🧩"},{t:"Mein Trainingsplan", i:"📝"},{t:"Hat mein Training gewirkt?", i:"🔁"}],
    fx:[["glow",810,520,260,"#FFC65A","pulse"],["sun",228,85],["flies",[60,560,1480,980],10]] },
  { id:"markt", name:"Markthalle", icon:"🍎", einheit:"E4 · Ernährung", x:880, y:378, veil:[140,80], offen:false,
    text:"In der Markthalle gibt es alles, was ein Sportlerkörper braucht: Energie, Nährstoffe, Wasser.",
    themen:[{t:"Energie: Was mein Körper verbraucht", i:"⚡"},{t:"Nährstoffe – was steckt im Essen?", i:"🥗"},{t:"Trinken – Wasser für Leistung", i:"💧"},{t:"Essen rund ums Training", i:"🍝"},{t:"Meine Ernährungsanalyse", i:"📋"}],
    fx:[["glow",800,330,280,"#FFC65A","pulse"],["sparks",[620,540,760,640],8,"#CFF3FF"],["sparks",[1210,560,1300,620],4,"#CFF3FF"],["sparks",[230,440,320,500],4,"#CFF3FF"],["flies",[60,700,1480,1000],8]] },
  { id:"labor", name:"Doping-Labor", icon:"🧪", einheit:"E5 · Doping", x:612, y:452, veil:[100,85], offen:false,
    text:"In der dunklen Seitengasse wird getrickst. Was ist Doping, und warum ist es so gefährlich?",
    themen:[{t:"Was ist Doping?", i:"❓"},{t:"Wirkung & Risiken", i:"⚠️"},{t:"Kontrollen, Fair Play & Grauzonen", i:"🔍"},{t:"Debatte: Doping freigeben?", i:"🗣️"}],
    fx:[["glow",705,330,90,"#8CFF4A","pulse"],["glow",800,340,60,"#D56BFF","pulse"],["glow",880,600,130,"#8CFF4A","flick"],["smoke",890,235],["sun",185,88]] },
  { id:"gehirn", name:"Gehirn-Arena", icon:"🧠", einheit:"E6 · Emotionen, Fair Play & Sinn", x:1075, y:128, veil:[120,95], offen:false,
    text:"In der Arena im Kopf geht es um Gefühle im Sport, Fair Play und die Frage: Warum treibe ich Sport?",
    themen:[{t:"Wettkampf & Fair Play", i:"🤝"},{t:"Emotionen im Sport", i:"😤"},{t:"Emotionen steuern & Mut", i:"🧘"},{t:"Warum treiben wir Sport?", i:"🧭"},{t:"Meine Sport-Biografie & Motive", i:"📖"}],
    fx:[["glow",835,300,260,"#FF9EC4","pulse"],["glow",590,185,90,"#FFF3C4","flick"],["glow",1065,178,90,"#FFF3C4","flick"],["sun",128,178],["flies",[60,620,1480,980],10]] }
];
const STADT_FX = [["sun",228,88],["glow",955,255,95,"#FF5A3C","beat"],["glow",1075,80,85,"#FF9EC4","pulse"],["glow",655,400,55,"#8CFF4A","pulse"],["glow",520,665,42,"#5FE9FF","flick"],
  ["glow",650,650,60,"#FFA53C","pulse"],["smoke",868,148],["smoke",905,190],["blink",1196,468],["glow",930,540,80,"#FFF3C4","flick"],
  ["water",[20,300,330,560],8],["water",[1180,180,1520,420],8],["water",[330,930,900,1010],6],["flies",[420,150,1300,900],12]];

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s), ALLE = /[?&]alle=1/.test(location.search);
const offen = o => ALLE || o.offen, pct = (v, n) => (v / n * 100).toFixed(2) + "%";
const rnd = (a, b) => a + Math.random() * (b - a);
let gid = 0;
function fxSVG(list, veils){
  let defs = "", out = "";
  const grad = (col, o=1) => { const id = "g" + (++gid); defs += `<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity="${o}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`; return id; };
  list.forEach(f => { const k = f[0];
    if(k === "glow") out += `<circle class="${f[5]}" cx="${f[1]}" cy="${f[2]}" r="${f[3]}" fill="url(#${grad(f[4],.9)})"/>`;
    if(k === "sun") out += `<circle class="pulse" cx="${f[1]}" cy="${f[2]}" r="150" fill="url(#${grad("#FFD9A0",.8)})" style="animation-duration:6s"/>`;
    if(k === "smoke") for(let i=0;i<4;i++) out += `<circle class="puff" cx="${f[1]}" cy="${f[2]}" r="18" fill="url(#${grad("#FFFFFF",.75)})" style="animation-delay:${(i*1.25).toFixed(2)}s"/>`;
    if(k === "blink") out += `<circle class="blink" cx="${f[1]}" cy="${f[2]}" r="7" fill="#FF3B3B"/><circle class="blink" cx="${f[1]}" cy="${f[2]}" r="26" fill="url(#${grad("#FF3B3B",.8)})"/>`;
    if(k === "sparks") for(let i=0;i<f[2];i++) out += `<circle class="tw" cx="${rnd(f[1][0],f[1][2]).toFixed(0)}" cy="${rnd(f[1][1],f[1][3]).toFixed(0)}" r="${rnd(2,4.5).toFixed(1)}" fill="${f[3]}" style="animation-delay:${rnd(0,2.6).toFixed(2)}s;animation-duration:${rnd(.7,1.6).toFixed(2)}s"/>`;
    if(k === "water") for(let i=0;i<f[2];i++) out += `<ellipse class="tw" cx="${rnd(f[1][0],f[1][2]).toFixed(0)}" cy="${rnd(f[1][1],f[1][3]).toFixed(0)}" rx="${rnd(8,18).toFixed(0)}" ry="2.2" fill="#FFE9C9" style="animation-delay:${rnd(0,4).toFixed(2)}s;animation-duration:${rnd(2.4,4.5).toFixed(2)}s"/>`;
    if(k === "flies") for(let i=0;i<f[2];i++) out += `<circle class="fly" cx="${rnd(f[1][0],f[1][2]).toFixed(0)}" cy="${rnd(f[1][1],f[1][3]).toFixed(0)}" r="3" fill="#FFF2B0" style="animation-delay:${rnd(0,9).toFixed(2)}s;animation-duration:${rnd(6,11).toFixed(2)}s"/>`;
  });
  let v = "";
  (veils || []).forEach(([x,y,rx,ry]) => { if(rx) v += `<ellipse class="fog" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${grad("#241A4A",1)})"/><ellipse cx="${x}" cy="${y}" rx="${rx*.8}" ry="${ry*.8}" fill="url(#${grad("#241A4A",.9)})"/>`; });
  return `<svg class="veil" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"><defs>${defs}</defs>${v}</svg>
          <svg class="fx" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true" style="mix-blend-mode:screen"><defs>${defs}</defs>${out}</svg>`;
}
const spotHTML = (id, x, y, icon, name, sub, zu) => `<button class="spot${zu?" zu":""}" data-id="${id}" style="left:${pct(x,1536)};top:${pct(y,1024)}"><span class="pin" aria-hidden="true">${zu?"🔒":icon}</span><span class="lbl">${name}${sub?`<small>${sub}</small>`:""}</span></button>`;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Übersicht ---------- */
function drawOver(){
  $("#dOver").innerHTML = `<img src="welt9/stadt.webp" alt="Athletopolis: eine Stadt in Form eines Athleten">` +
    fxSVG(STADT_FX, ORTE.filter(o => !offen(o)).map(o => [o.x, o.y - 10, o.veil[0], o.veil[1]])) +
    ORTE.map(o => spotHTML(o.id, o.x, o.y, o.icon, o.name, o.einheit.split(" · ")[0], !offen(o))).join("");
  $("#dock").innerHTML = ORTE.map(o => `<button class="th${offen(o)?"":" zu"}" data-id="${o.id}"><span class="i">${offen(o)?o.icon:"🔒"}</span><span><b>${o.name}</b><span class="s">${o.einheit}</span></span></button>`).join("");
}
/* ---------- Viertel ---------- */
let cur = null, sub = null, busy = false;
const START = "Profil Sport · Klasse 9 · Tippe auf ein Stadtviertel";
const org = o => `${pct(o.x,1536)} ${pct(o.y,1024)}`, tOffen = t => ALLE || !!t.pfad;
function drawDet(o){
  const spots = o.themen.filter(t => t.x);
  $("#dDet").innerHTML = `<img src="welt9/${o.id}.webp" alt="${o.name}">` +
    fxSVG(o.fx, spots.filter(t => !tOffen(t) && t.veil).map(t => [t.x, t.y, t.veil[0], t.veil[1]])) +
    spots.map(t => spotHTML("t" + o.themen.indexOf(t), t.x, t.y, t.i, t.s, "", !tOffen(t))).join("");
}
function cardDet(o){
  $("#card").innerHTML = `<h2>${o.icon} ${o.name}</h2><p class="e">${o.einheit}</p><p>${o.text}</p>` +
    o.themen.map((t, i) => `<button class="th${tOffen(t)?"":" zu"}" data-id="t${i}"><span class="i">${tOffen(t)?t.i:"🔒"}</span><span><b>${t.t}</b><span class="s">${t.pfad ? (t.s || "Lernwelt öffnen") : "kommt bald"}</span></span></button>`).join("");
}
function cardSub(t){
  $("#card").innerHTML = `<h2>${t.i} ${t.s}</h2><p class="e">${t.t}</p><p>${t.text||""}</p>` +
    (t.pfad ? `<button class="th go" data-go="1"><span class="i">▶</span><span><b>Lernwelt starten</b><span class="s">Infokarten und Spiele</span></span></button>` : `<div class="th zu"><span class="i">🔒</span><span><b>Kommt bald</b><span class="s">Diese Lernwelt wird noch gebaut.</span></span></div>`);
}
function head(back, ttl, subt){ $("#back").hidden = !back; $("#back").textContent = back ? "← " + back : ""; $("#home").hidden = !!back; $("#ttl").textContent = ttl; $("#sub").textContent = subt; }
function anim(el, cls, origin){ const c = el.querySelector(".cam"); c.style.transformOrigin = origin || "50% 50%"; c.classList.remove("fly-out","fly-in","back-out","back-in"); void c.offsetWidth; c.classList.add(cls); return c; }
function flug(von, nach, origin, instant, fertig){   // hinein: von → nach
  nach.hidden = false; const done = () => { von.hidden = true; busy = false; fertig(); };
  if(instant || reduced){ done(); return; } busy = true; anim(von, "fly-out", origin); anim(nach, "fly-in"); setTimeout(done, 700);
}
function rueck(von, nach, origin, fertig){           // heraus: von → nach
  nach.hidden = false; const done = () => { von.hidden = true; busy = false; nach.querySelector(".cam").classList.remove("back-in","fly-out"); };
  fertig(); if(reduced){ nach.querySelector(".cam").classList.remove("fly-out"); done(); return; } busy = true; anim(von, "back-out"); anim(nach, "back-in", origin); setTimeout(done, 680);
}
function enter(o, instant){
  if(busy) return; if(!offen(o)){ toast(`🔒 ${o.name} ist noch gesperrt – kommt bald!`); return; }
  cur = o; drawDet(o);
  flug($("#fOver"), $("#fDet"), org(o), instant, () => { cardDet(o); $("#card").hidden = false; $("#dock").hidden = true; head("Stadt", o.name, o.einheit); history.replaceState(null, "", "#o=" + o.id); });
}
function enterSub(t, instant){
  sub = t; $("#dSub").innerHTML = `<img src="welt9/${t.bild}.webp" alt="${t.s}">` + fxSVG(t.fx || [], []);
  $("#card").hidden = true;
  flug($("#fDet"), $("#fSub"), org(t), instant, () => { cardSub(t); $("#card").hidden = false; head(cur.name, t.s, t.t); history.replaceState(null, "", "#o=" + cur.id + "&t=" + cur.themen.indexOf(t)); });
}
function leave(){
  if(busy || !cur) return;
  if(sub){ const t = sub; sub = null; $("#card").hidden = true;
    rueck($("#fSub"), $("#fDet"), org(t), () => { cardDet(cur); $("#card").hidden = false; head("Stadt", cur.name, cur.einheit); history.replaceState(null, "", "#o=" + cur.id); }); return; }
  const o = cur; cur = null;
  rueck($("#fDet"), $("#fOver"), org(o), () => { $("#card").hidden = true; $("#dock").hidden = false; head("", "Athletopolis", START); history.replaceState(null, "", location.pathname + location.search); });
}
function openThema(i){
  const t = cur.themen[i]; if(!t || busy) return; if(!tOffen(t)){ toast(`🔒 „${t.t}“ kommt bald!`); return; }
  if(t.bild) enterSub(t); else if(t.pfad) start(t);
}
function start(t){
  if(busy || !t.pfad) return; busy = true;
  if(!reduced) anim(sub ? $("#fSub") : $("#fDet"), "fly-out", sub ? "50% 55%" : org(t));
  $("#fade").classList.add("on"); setTimeout(() => { location.href = t.pfad; }, reduced ? 0 : 430);
}
document.addEventListener("click", e => {
  if(e.target.closest("#back")){ leave(); return; } if(e.target.closest("[data-go]")){ start(sub); return; }
  const b = e.target.closest("[data-id]"); if(!b) return;
  const id = b.dataset.id; if(/^t\d+$/.test(id)) openThema(+id.slice(1)); else enter(ORTE.find(o => o.id === id));
});
addEventListener("pageshow", e => { if(e.persisted){ busy = false; $("#fade").classList.remove("on"); document.querySelectorAll(".cam").forEach(c => { if(!c.parentNode.hidden) c.classList.remove("fly-out"); }); } });
drawOver(); ORTE.forEach(o => { new Image().src = `welt9/${o.id}.webp`; o.themen.forEach(t => { if(t.bild) new Image().src = `welt9/${t.bild}.webp`; }); });
{ const m = location.hash.match(/o=([a-z]+)/), o = m && ORTE.find(x => x.id === m[1]), n = location.hash.match(/t=(\d+)/);
  if(o && offen(o)){ enter(o, true); const t = n && o.themen[+n[1]]; if(t && t.bild && tOffen(t)) enterSub(t, true); } }
</script>
</body>
