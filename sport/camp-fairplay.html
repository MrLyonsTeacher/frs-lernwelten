// Gesichter: Freude, Stolz, Enttäuschung, Wut, Nervosität
function gesicht(x, y, r, art, c){
  const aug = (dx, form) => form === "zu" ? `<path d="M${x+dx-5} ${y-5} q5 4 10 0" stroke="${CB}" stroke-width="2.6" fill="none" stroke-linecap="round"/>` : `<circle cx="${x+dx}" cy="${y-5}" r="${form === "gross" ? 4 : 3.2}" fill="${CB}"/>`;

    freude: aug(-10) + aug(10) + `<path d="M${x-13} ${y+5} Q${x} ${y+22} ${x+13} ${y+5} Z" fill="${CB}"/>`,
    stolz: aug(-10, "zu") + aug(10, "zu") + `<path d="M${x-11} ${y+8} Q${x} ${y+17} ${x+11} ${y+8}" stroke="${CB}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${x-16} ${y-14} l7 -3 M${x+16} ${y-14} l-7 -3" stroke="${CB}" stroke-width="2.4" stroke-linecap="round"/>`,
    enttaeuscht: aug(-10) + aug(10) + `<path d="M${x-11} ${y+14} Q${x} ${y+5} ${x+11} ${y+14}" stroke="${CB}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${x-15} ${y-10} l8 -4 M${x+15} ${y-10} l-8 -4" stroke="${CB}" stroke-width="2.4" stroke-linecap="round"/><path d="M${x+14} ${y+1} q3 6 0 9 q-3 -3 0 -9" fill="${BL}"/>`,

    nervoes: aug(-10, "gross") + aug(10, "gross") + `<path d="M${x-11} ${y+11} q4 -4 7 0 t7 0 t7 0" stroke="${CB}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M${x+18} ${y-16} q4 7 0 10 q-4 -3 0 -10" fill="${BL}"/>`
  };
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>${F[art]}`;

  return CK(380, 200, TX(190, 28, "Gefühle im Wettkampf", {s:16.5, c:HELL}) + GEF.map(([a, n, c], i) => { const x = 42 + i * 74, an = k < 0 || k === i;

}

// STOPP-Regel
const STOPP = [["S","Stehen bleiben","nicht sofort reagieren"],["T","Tief durchatmen","dreimal langsam ein und aus"],["O","Ordnen","Was ist eigentlich passiert?"],["P","Positiv handeln","eine faire Lösung wählen"],["P","Partner holen","Mitspieler, Schiri oder Lehrkraft"]];
function stopp(k){
  const okt = (cx, cy, r) => Array.from({length:8}, (_, i) => { const a = Math.PI / 8 + i * Math.PI / 4; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  let s = `<polygon points="${okt(74, 160, 58)}" fill="${RO}" stroke="${HELL}" stroke-width="5"/>` + TX(74, 170, "STOPP", {s:21, c:HELL, st:"letter-spacing:1px"});
  STOPP.forEach(([b, t, e], i) => { const y = 58 + i * 46, an = k < 0 || k === i;
    s += `<g opacity="${an ? 1 : .3}"><rect x="148" y="${y - 18}" width="218" height="40" rx="10" fill="${k === i ? GE : CB2}" stroke="${CL}" stroke-width="1.5"/>` +
      `<circle cx="168" cy="${y + 2}" r="13" fill="${RO}"/>` + TX(168, y + 8, b, {s:16, c:HELL}) + TX(188, y - 1, t, {s:13.5, c:k === i ? CB : HELL, a:"start"}) + TX(188, y + 14, e, {s:10.5, c:k === i ? CB : HG, a:"start", w:600}) + `</g>`; });
  return CK(380, 300, TX(190, 24, "Wenn’s kocht: die STOPP-Regel", {s:16, c:HELL}) + s);
}

    {bild:gefuehle(2), titel:"Verlieren", text:"**„Verloren? Gratulier mit Stil – auch das gehört zum fairen Spiel.“**"}
