  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --xray:#101A33; --glow:#FFD34D;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #D2D9E5; --shadow:0 3px 0 #C6CEDC; --border-opt:2px solid #D2D9E5;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#FFE1DC; --card-back:#101A33; --tile-bg:#FFE9B8; --tile-ink:#14203A;
  --chip-bg:#101A33; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #D2D9E5;
  --track:#DCE2EC; --star:#D63A2F; --star-off:#D2D9E5;
}
body{background:var(--bg) radial-gradient(circle at 0 0,rgba(255,211,77,.14),transparent 40%)}
.chip{border:0}
.ln-art img.lnbild{display:block;width:100%;height:auto;max-height:min(58vh,calc(var(--avail,700px) - 260px));object-fit:contain;margin:0 auto;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.ln-stage:has(.lnbild){grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.4rem}
.ln-art:has(.lnbild){align-self:stretch;display:flex;align-items:center;justify-content:center}
.ln-art > span:has(.lnbild){display:block;width:100%;animation:lnPop .6s both}
@media (max-aspect-ratio:1/1), (max-width:640px){ .ln-stage:has(.lnbild){grid-template-columns:1fr;overflow-y:auto} .ln-art img.lnbild{max-height:32vh;width:auto;max-width:100%} }
/* Startbild: Stadion bei Flutlicht */
.flut-hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#0B1226 0,#14244A 70%,#1B5E3A 70%,#1F6B42 100%);color:#fff;padding:clamp(1.4rem,4vw,2.4rem);min-height:270px;isolation:isolate}
.flut-hero .kicker{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--accent-2);margin:0;letter-spacing:.04em}
.flut-hero h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,8.5vw,4.6rem);line-height:.92;margin:.3rem 0 .7rem;max-width:12ch;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.flut-hero p{margin:0 0 .6rem;max-width:36ch;color:#D7E0F0;font-size:1.06rem}
.flut-hero .hero-art{position:absolute;right:0;top:0;height:100%;width:60%;z-index:-1}
@media (max-width:640px){ .flut-hero .hero-art{opacity:.35;width:100%} }
.beamL,.beamR{transform-box:fill-box;transform-origin:50% 0}
@media (prefers-reduced-motion: no-preference){ .beamL{animation:sweep 5s ease-in-out infinite} .beamR{animation:sweep 6s ease-in-out infinite reverse} @keyframes sweep{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}} }
.sk g.jm.z-hl .jr{fill:rgba(255,211,77,.6); stroke:#FFD34D; stroke-width:3.4}
.zg .ztarget{font-size:clamp(1.6rem,4.6vw,2.6rem)}
</style>
