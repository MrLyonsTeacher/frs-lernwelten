<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14223D">
<title>Trainings-Lernwelt</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../lernwelt/lernwelt.css">
<link rel="stylesheet" href="sport-kit.css">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F2F6F8; --ink:#14223D; --muted:#56637A; --line:#CBD5DF;
  --accent:#D9541A; --accent-ink:#FFFFFF; --accent-2:#FFC233; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --xray:#101A33; --glow:#FFC233;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #D0D9E2; --shadow:0 3px 0 #C3CDD8; --border-opt:2px solid #D0D9E2;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#FFE3D4; --card-back:#14223D; --tile-bg:#FFE7B8; --tile-ink:#14223D;
  --chip-bg:#14223D; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #D0D9E2;
  --track:#DCE3EA; --star:#D9541A; --star-off:#D0D9E2;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(217,84,26,.12),transparent 42%)}
.chip{border:0}
.gym-hero{background:linear-gradient(160deg,#14223D 0,#1E3A5C 55%,#D9541A 140%)}
.gym-hero .hero-art .hantel{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: no-preference){ .gym-hero .hantel{animation:heben 2.6s ease-in-out infinite} @keyframes heben{50%{transform:translateY(-14px)}}
  .gym-hero .zeiger{transform-origin:300px 96px;animation:uhr 6s linear infinite} @keyframes uhr{to{transform:rotate(360deg)}} }
</style>
</head>
<body>
<main class="lw" id="app"></main>

<script src="../qrcode.js"></script>
<script src="../ergebnis.js"></script>
<script src="../lernwelt/lernwelt.js"></script>
<script src="sport-kit.js"></script>
<script>
/* =========================================================
   Bilder: ChatGPT-Illustrationen (sport/training-bilder/NAME.webp), sobald vorhanden in BILDER eintragen.
   Bis dahin wird die selbst gezeichnete Grafik bzw. das Symbol gezeigt.
   ========================================================= */
const BILDER = new Set([]);
const FOTO = (n, alt, ersatz) => BILDER.has(n) ? `<img class="lnbild" src="training-bilder/${n}.webp" alt="${alt||""}">` : ersatz;

/* =========================================================
   Selbst gezeichnete Schaubilder
   ========================================================= */
const GE = "#FFD34D", OR = "#FF9A3D", GR = "#5BE38C", RO = "#FF6B6B", BL = "#5FE9FF", HG = "#9FB0CF";
// Leistungsverlauf für eine Folge von Trainings (Zeit in Tagen) – wie im Spiel „Timing-Coach“
function verlauf(ts){ const h = [{t:0,b:0}]; ts.slice(1).forEach(t => { const p = h[h.length-1]; h.push({t, b:p.b + SK_R(t - p.t)}); });
  return t => { if(t <= 0) return 0; let k = h.length - 1; while(k > 0 && h[k].t > t) k--; return h[k].b + SK_R(t - h[k].t); }; }
const pfad = (f, a, b, xs, ys, st=.04) => { let p = ""; for(let t = a; t <= b + 1e-9; t += st) p += `${p?"L":"M"}${xs(t).toFixed(1)} ${ys(f(t)).toFixed(1)}`; return p; };

// Hantel, Herz, Blitz … als kleine Symbole (Mittelpunkt x,y)
const SYM = {
  hantel:(x,y,c=OR) => `<g transform="translate(${x} ${y})"><rect x="-22" y="-3.5" width="44" height="7" rx="3" fill="#C9D4E6"/><rect x="-27" y="-14" width="8" height="28" rx="2.5" fill="${c}"/><rect x="19" y="-14" width="8" height="28" rx="2.5" fill="${c}"/><rect x="-33" y="-9" width="6" height="18" rx="2" fill="${c}"/><rect x="27" y="-9" width="6" height="18" rx="2" fill="${c}"/></g>`,
  herz:(x,y,c=RO,s=1) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 9 C0 -3 -17 -6 -17 5 C-17 14 -4 20 0 26 C4 20 17 14 17 5 C17 -6 0 -3 0 9 Z" fill="${c}"/>`,
  blitz:(x,y,c=GE) => `<path transform="translate(${x} ${y})" d="M4 -20 L-11 3 L-1 3 L-5 20 L11 -4 L1 -4 Z" fill="${c}"/>`,
  bogen:(x,y,c=GR) => `<g transform="translate(${x} ${y})" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"><path d="M-18 14 Q0 -26 18 14"/><path d="M12 7 L18 14 L22 5"/></g>`,
  baelle:(x,y) => `<g transform="translate(${x} ${y})"><path d="M-20 12 Q0 -26 20 12" fill="none" stroke="#9FB0CF" stroke-width="2" stroke-dasharray="3 4"/><circle cx="-16" cy="2" r="6.5" fill="${BL}"/><circle cx="0" cy="-12" r="6.5" fill="${GE}"/><circle cx="16" cy="2" r="6.5" fill="${RO}"/></g>`,
  uhr:(x,y,c="#EAF0FA") => `<g transform="translate(${x} ${y})"><circle r="17" fill="none" stroke="${c}" stroke-width="4"/><rect x="-4" y="-25" width="8" height="6" rx="1.5" fill="${c}"/><path d="M0 0 L0 -10 M0 0 L7 4" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/></g>`,
  batterie:(x,y,stufe,c=GR) => `<g transform="translate(${x} ${y})"><rect x="-24" y="-13" width="44" height="26" rx="5" fill="none" stroke="#EAF0FA" stroke-width="3.5"/><rect x="21" y="-6" width="5" height="12" rx="2" fill="#EAF0FA"/>${[0,1,2,3].map(k => k < stufe ? `<rect x="${-20 + k*10}" y="-9" width="8" height="18" rx="2" fill="${c}"/>` : "").join("")}</g>`,
  haken:(x,y,c=GR) => `<path transform="translate(${x} ${y})" d="M-8 0 L-2 7 L9 -7" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`,
  kreuz:(x,y,c=RO) => `<path transform="translate(${x} ${y})" d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`
};

const ICON = {
  merkmale: KARTE(340, 230, TX(170, 34, "Training ist …", {s:19, c:"#EAF0FA"}) +
    // Klemmbrett (geplant)
    `<g transform="translate(62 106)"><circle r="44" fill="#1E2C4D"/><rect x="-20" y="-26" width="40" height="52" rx="5" fill="#F4E9D2"/><rect x="-9" y="-31" width="18" height="10" rx="3" fill="${OR}"/>
      ${[ -12, -2, 8, 18 ].map(y => `<path d="M-12 ${y} h6" stroke="${GR}" stroke-width="3" stroke-linecap="round"/><path d="M-2 ${y} h14" stroke="#14223D" stroke-width="3" stroke-linecap="round"/>`).join("")}</g>` +
    // Kalender (regelmäßig)
    `<g transform="translate(170 106)"><circle r="44" fill="#1E2C4D"/><rect x="-26" y="-22" width="52" height="46" rx="5" fill="#F4E9D2"/><rect x="-26" y="-22" width="52" height="11" rx="4" fill="${RO}"/>
      ${[0,1,2].map(r => [0,1,2,3].map(c => `<rect x="${-21 + c*11.5}" y="${-6 + r*10}" width="9" height="7" rx="1.5" fill="${(c===1||c===3) ? GR : "#C9C0AE"}"/>`).join("")).join("")}</g>` +
    // Zielscheibe (zielgerichtet)
    `<g transform="translate(278 106)"><circle r="44" fill="#1E2C4D"/><circle r="27" fill="#F4E9D2"/><circle r="19" fill="${RO}"/><circle r="11" fill="#F4E9D2"/><circle r="4.5" fill="${RO}"/><path d="M30 -30 L3 -3" stroke="${GE}" stroke-width="4" stroke-linecap="round"/><path d="M24 -36 L34 -34 L32 -24" fill="none" stroke="${GE}" stroke-width="3"/></g>` +
    TX(62, 178, "geplant", {s:17, c:GE}) + TX(170, 178, "regelmäßig", {s:17, c:GE}) + TX(278, 178, "zielgerichtet", {s:17, c:GE}) +
    TX(170, 212, "… um die Leistung zu verbessern.", {s:14.5, c:HG, w:600})),
  faehigkeiten: KARTE(380, 290, [[190,52,"herz","Ausdauer"],[318,118,"hantel","Kraft"],[274,232,"blitz","Schnelligkeit"],[106,232,"bogen","Beweglichkeit"],[62,118,"baelle","Koordination"]].map(([x,y]) => `<line x1="190" y1="150" x2="${x}" y2="${y}" stroke="#2E4472" stroke-width="3"/>`).join("") +
    `<circle cx="190" cy="150" r="52" fill="#22345C" stroke="${GE}" stroke-width="3"/>` + TX(190, 146, "Motorische|Fähigkeiten", {s:15, c:"#FFFFFF"}) +
    [[190,52,"herz","Ausdauer"],[318,118,"hantel","Kraft"],[274,232,"blitz","Schnelligkeit"],[106,232,"bogen","Beweglichkeit"],[62,118,"baelle","Koordination"]].map(([x,y,s,t]) => {
      const sym = s === "herz" ? SYM.herz(x, y-13, RO, .85) : s === "hantel" ? SYM.hantel(x, y) : SYM[s](x, y);
      return `<circle cx="${x}" cy="${y}" r="28" fill="#1E2C4D" stroke="#3A5288" stroke-width="2"/>${sym}` + TX(x, y + (y > 200 ? 46 : -36) + (s === "herz" ? 0 : 0), t, {s:15, c:GE}); }).join("")),
  fair: KARTE(360, 236, TX(180, 34, "Fair testen = gleich & genau", {s:18, c:GE}) +
    [["gleiches Aufwärmen","im Januar und im März"],["gleicher Ort, gleiche Strecke","Halle oder draußen – aber immer gleich"],["gleiche Variante","z. B. Liegestütz immer auf den Knien"],["genau zählen & messen","nur saubere Wiederholungen"]].map(([a,b],k) =>
      `<rect x="22" y="${56 + k*44}" width="316" height="38" rx="10" fill="#1E2C4D"/><circle cx="44" cy="${75 + k*44}" r="12" fill="#14834F"/>${SYM.haken(44, 75 + k*44, "#FFFFFF")}` +
      TX(66, 72 + k*44, a, {s:14.5, a:"start", c:"#FFFFFF"}) + TX(66, 88 + k*44, b, {s:11.5, a:"start", c:HG, w:600})).join("")),
  vergleich: KARTE(340, 220, TX(170, 32, "Dein Vergleich: du mit dir selbst", {s:16.5, c:GE}) +
    `<rect x="40" y="60" width="110" height="120" rx="12" fill="#1E2C4D"/><rect x="190" y="60" width="110" height="120" rx="12" fill="#1E2C4D"/>` +
    TX(95, 86, "Januar", {s:16, c:"#FFFFFF"}) + TX(245, 86, "März", {s:16, c:"#FFFFFF"}) + TX(95, 106, "Eingangstest", {s:12.5, c:HG, w:600}) + TX(245, 106, "Ausgangstest", {s:12.5, c:HG, w:600}) +
    `<rect x="70" y="${170-34}" width="50" height="34" rx="4" fill="${BL}"/><rect x="220" y="${170-52}" width="50" height="52" rx="4" fill="${GR}"/>` + PFEIL(155, 120, 186, 120, GE, 4) +
    TX(170, 206, "Werte sind persönlich – keine Rangliste.", {s:13.5, c:HG, w:600})),
  pausen: KARTE(340, 230, TX(170, 30, "Pausen-Experiment (Beispiel)", {s:16.5, c:GE}) +
    [[1,22,"frisch",BL],[2,15,"nach 20 s|Pause",RO],[3,21,"nach 2 min|Pause",GR]].map(([n,v,t,c],k) => { const x = 62 + k*100, h = v*5.4;
      return `<rect x="${x}" y="${178 - h}" width="56" height="${h}" rx="6" fill="${c}"/>` + TX(x + 28, 170 - h, v + " ×", {s:15, c:"#FFFFFF"}) + TX(x + 28, 196, "Durchgang " + n, {s:12.5, c:"#FFFFFF"}) + TX(x + 28, 211, t.split("|")[0] + " " + (t.split("|")[1]||""), {s:11, c:HG, w:600}); }).join("") +
    `<line x1="40" y1="178" x2="310" y2="178" stroke="#5B6C93" stroke-width="2"/>`),
  erholung: KARTE(380, 236, TX(190, 30, "Wie lange dauert die Erholung?", {s:16.5, c:GE}) +
    [0,1,2,3].map(d => `<line x1="${140 + d*66}" y1="48" x2="${140 + d*66}" y2="202" stroke="#24345A" stroke-width="1.5"/>` + TX(140 + d*66, 222, d === 0 ? "0" : d + (d === 1 ? " Tag" : " Tage"), {s:12, c:HG, w:600})).join("") +
    [["Puls & Atmung","nach einem Sprint",.06,"Minuten",BL],["Energiespeicher","nach Ausdauertraining",1.5,"1–2 Tage",GE],["Muskeln","nach Krafttraining",2.5,"2–3 Tage",OR]].map(([a,b,d,t,c],k) => { const y = 72 + k*48;
      return TX(14, y + 2, a, {s:13, a:"start", c:"#FFFFFF"}) + TX(14, y + 17, b, {s:10, a:"start", c:HG, w:600}) +
        `<rect x="140" y="${y - 10}" width="${Math.max(10, d*66)}" height="22" rx="7" fill="${c}"/>` + TX(140 + Math.max(10, d*66) + 7, y + 6, t, {s:13.5, a:"start", c}); }).join("")),
  experimentText: "",
  stellschrauben: KARTE(420, 250, TX(210, 28, "Die 5 Stellschrauben der Belastung", {s:16.5, c:GE}) +
    [["Intensität","wie hart?",OR],["Dauer","wie lange am Stück?",BL],["Umfang","wie viel insgesamt?",GR],["Dichte","wie lang die Pausen?",RO],["Häufigkeit","wie oft pro Woche?","#C99BFF"]].map(([n,q,c],k) => {
      const x = k < 3 ? 72 + k*138 : 141 + (k-3)*138, y = k < 3 ? 80 : 172, w = -40 + k*35;
      return `<circle cx="${x}" cy="${y}" r="26" fill="#1E2C4D" stroke="${c}" stroke-width="5"/>${[0,1,2,3,4,5,6,7].map(j => { const a = j*Math.PI/4; return `<circle cx="${(x + Math.cos(a)*33).toFixed(1)}" cy="${(y + Math.sin(a)*33).toFixed(1)}" r="2.2" fill="#3A5288"/>`; }).join("")}
        <line x1="${x}" y1="${y}" x2="${(x + Math.cos((w-90)*Math.PI/180)*19).toFixed(1)}" y2="${(y + Math.sin((w-90)*Math.PI/180)*19).toFixed(1)}" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="5" fill="#FFFFFF"/>` +
        TX(x, y + 48, n, {s:15, c}) + TX(x, y + 63, q, {s:11.2, c:HG, w:600}); }).join("")),
  prinzipien: KARTE(380, 236, TX(190, 28, "Trainingsprinzipien", {s:17, c:GE}) +
    [["Progression","steigern",OR],["Kontinuität","regelmäßig",BL],["Regeneration","Pausen",GR],["Individualität","passend zu mir","#C99BFF"],["Variation","abwechseln",RO]].map(([n,q,c],k) => {
      const x = 22, y = 46 + k*37;
      return `<rect x="${x}" y="${y}" width="336" height="31" rx="9" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="9" height="31" rx="3" fill="${c}"/>` + TX(x + 22, y + 21, n, {s:15, a:"start", c:"#FFFFFF"}) + TX(x + 322, y + 21, q, {s:13.5, a:"end", c}); }).join("")),
  progression: KARTE(300, 220, [0,1,2,3].map(k => `<rect x="${40 + k*56}" y="${170 - (k+1)*30}" width="56" height="${(k+1)*30}" fill="${k===3?OR:"#2A3E69"}" stroke="#101A33" stroke-width="2"/>` + TX(68 + k*56, 192, "W" + (k+1), {s:13, c:HG})).join("") +
    PFEIL(52, 128, 236, 34, GE, 5) + TX(150, 212, "Belastung Schritt für Schritt steigern", {s:13.5, c:"#FFFFFF"})),
  kontinuitaet: KARTE(300, 220, TX(150, 30, "jede Woche: Di + Sa", {s:15, c:GE}) + ["Mo","Di","Mi","Do","Fr","Sa","So"].map((d,k) => TX(48 + k*34, 58, d, {s:12, c:HG})).join("") +
    [0,1,2,3].map(r => [0,1,2,3,4,5,6].map(c => `<rect x="${33 + c*34}" y="${68 + r*32}" width="30" height="26" rx="5" fill="${(c===1||c===5) ? "#14834F" : "#1E2C4D"}"/>${(c===1||c===5) ? SYM.haken(48 + c*34, 81 + r*32, "#FFFFFF") : ""}`).join("")).join("")),
  regeneration: KARTE(300, 220, `<path d="M118 66 a32 32 0 1 0 34 46 a26 26 0 1 1 -34 -46z" fill="${GE}"/>` + TX(124, 160, "Ruhetag", {s:15, c:GE}) +
    SYM.batterie(220, 90, 1, RO) + PFEIL(220, 112, 220, 142, "#EAF0FA", 3) + SYM.batterie(220, 166, 4, GR) + TX(150, 206, "In der Pause wirst du stärker.", {s:14, c:"#FFFFFF"})),
  individualitaet: KARTE(300, 220, [[90,"Lina","Ausdauer",BL,"herz"],[210,"Ali","Kraft",OR,"hantel"]].map(([x,n,z,c,s]) =>
      `<circle cx="${x}" cy="66" r="17" fill="#F2C9A6"/><path d="M${x-26} 132 q0 -40 26 -40 q26 0 26 40 z" fill="${c}"/>` + TX(x, 152, n, {s:15, c:"#FFFFFF"}) +
      `<rect x="${x-46}" y="164" width="92" height="30" rx="9" fill="#1E2C4D" stroke="${c}" stroke-width="2"/>` + TX(x, 184, "Ziel: " + z, {s:12.5, c})).join("") +
    TX(150, 214, "Jeder braucht seinen eigenen Plan.", {s:13, c:HG, w:600})),
  variation: KARTE(300, 220, `<circle cx="150" cy="104" r="58" fill="none" stroke="#2E4472" stroke-width="10"/>` +
    [[150,46,"Laufen",BL],[200,134,"Rad",GE],[100,134,"Zirkel",OR]].map(([x,y,t,c]) => `<circle cx="${x}" cy="${y}" r="27" fill="#1E2C4D" stroke="${c}" stroke-width="3"/>` + TX(x, y + 5, t, {s:12.5, c})).join("") +
    PFEIL(188, 62, 204, 90, "#EAF0FA", 3) + PFEIL(170, 152, 132, 152, "#EAF0FA", 3) + PFEIL(102, 96, 114, 66, "#EAF0FA", 3) + TX(150, 206, "Abwechslung hält motiviert.", {s:14, c:"#FFFFFF"})),
  smart: KARTE(380, 226, TX(190, 30, "Ein gutes Ziel ist SMART", {s:17, c:GE}) +
    [["S","Spezifisch","genau was?",OR],["M","Messbar","mit Zahl",BL],["A","Attraktiv","ich will es",GR],["R","Realistisch","machbar",GE],["T","Terminiert","bis wann?",RO]].map(([b,n,q,c],k) => { const x = 18 + k*70;
      return `<rect x="${x}" y="50" width="64" height="64" rx="12" fill="${c}"/>` + TX(x + 32, 96, b, {s:38, c:"#101A33", w:800}) + TX(x + 32, 138, n, {s:12.6, c:"#FFFFFF"}) + TX(x + 32, 155, q, {s:11, c:HG, w:600}); }).join("") +
    TX(190, 196, "„Bis zum 19.03. schaffe ich im 6-Minuten-Lauf", {s:12.4, c:"#FFFFFF", w:600}) + TX(190, 213, "100 m mehr als im Januar.“", {s:12.4, c:"#FFFFFF", w:600})),
  plan: KARTE(360, 236, TX(180, 30, "Beispiel: 4 Wochen Ausdauer", {s:16.5, c:GE}) +
    [["W1","2 × 20 min locker",40],["W2","25 min + 4 × 2 min zügig",41],["W3","30 min + 5 × 2 min",50],["W4","30 min + 4 × 3 min",54]].map(([w,t,m],k) => { const y = 54 + k*42;
      return TX(34, y + 22, w, {s:15, c:"#FFFFFF"}) + `<rect x="60" y="${y + 4}" width="${m*4.6}" height="26" rx="7" fill="${["#2E6FB0","#3E86C8","#E07A2E",OR][k]}"/>` + TX(68, y + 22, t, {s:12.5, a:"start", c:"#FFFFFF"}); }).join("") +
    TX(180, 228, "Progression: Dauer und Intervalle steigen · 1 Ruhetag dazwischen", {s:11.4, c:HG, w:600})),
  prozent: KARTE(380, 236, TX(190, 32, "So rechnest du deine Veränderung", {s:16.5, c:GE}) +
    SCHILD(20, 50, 340, 40, "Differenz = Ausgangswert (März) − Eingangswert (Januar)", {s:13.2, c:"#FFFFFF"}) +
    SCHILD(20, 98, 340, 40, "Veränderung in % = Differenz : Eingangswert × 100", {s:13.2, c:"#FFFFFF"}) +
    TX(190, 166, "Beispiel Lena · 6-Minuten-Lauf: 1 150 m → 1 240 m", {s:13, c:HG, w:600}) +
    TX(190, 192, "Differenz: + 90 m", {s:15, c:GR}) + TX(190, 218, "90 : 1 150 × 100 ≈ + 7,8 %", {s:15, c:GR})),
  ursachen: KARTE(380, 240, TX(190, 30, "Warum hat sich etwas verändert?", {s:16.5, c:GE}) +
    [["Training nach Plan","Anpassung des Körpers",GR],["Test kenne ich besser","Technik & Taktik",BL],["Tagesform","Schlaf, Krankheit, Motivation",GE],["Messfehler","andere Bedingungen",RO],["kaum trainiert","diese Fähigkeit nicht geübt",OR],["Wachstum","körperliche Entwicklung","#C99BFF"]].map(([a,b,c],k) => {
      const x = k % 2 ? 196 : 16, y = 46 + Math.floor(k/2)*62;
      return `<rect x="${x}" y="${y}" width="168" height="54" rx="10" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="8" height="54" rx="3" fill="${c}"/>` + TX(x + 18, y + 23, a, {s:13.4, a:"start", c:"#FFFFFF"}) + TX(x + 18, y + 41, b, {s:10.8, a:"start", c:HG, w:600}); }).join("")),
  vorsicht: KARTE(340, 220, TX(170, 30, "Vorsicht bei kleinen Zahlen", {s:16.5, c:GE}) +

// glatte Kurve durch Punkte (Catmull-Rom → Bézier)
function glatt(P){ let d = `M${P[0][0]} ${P[0][1]}`; for(let i = 0; i < P.length - 1; i++){ const p0 = P[i-1] || P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2] || p2;
  d += ` C${(p1[0] + (p2[0]-p0[0])/6).toFixed(1)} ${(p1[1] + (p2[1]-p0[1])/6).toFixed(1)} ${(p2[0] - (p3[0]-p1[0])/6).toFixed(1)} ${(p2[1] - (p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`; } return d; }

  let s = Z.map(([id,a,b,,,c]) => `<rect x="${a}" y="36" width="${b-a}" height="226" fill="${c}" opacity=".07"/>`).join("") +

    s += fig ? `<g data-z="${id}"><rect class="zr" x="${a + 2}" y="38" width="${b - a - 4}" height="286" rx="10"/>${g}</g>` : g; });
  const stern = `<path d="M330 85 l4.3 9 l9.8 1.2 l-7.2 6.8 l1.9 9.7 l-8.8 -4.8 l-8.8 4.8 l1.9 -9.7 l-7.2 -6.8 l9.8 -1.2z" fill="${GE}" stroke="#101A33" stroke-width="1.5"/>`;
  s += fig ? `<g data-z="zeitpunkt"><circle class="zr" cx="330" cy="92" r="24"/>${stern}${TX(330, 62, "bester Zeitpunkt", {s:13, c:GE})}</g>` : stern + TX(330, 62, "★ nächstes Training", {s:13, c:GE});

// drei Kurven aus AB 11: zu früh, optimal, zu spät
function dreiKurven(){
  const R = [["zu früh – Übertraining",[0,.9,1.8,2.7],RO],["optimal",[0,2.6,5.2,7.8],GR],["zu spät – kein Fortschritt",[0,6,12,18],GE]];
  return KARTE(380, 300, R.map(([t,ts,c],k) => { const y0 = 12 + k*96, f = verlauf(ts), tE = ts[3] + 3, xs = t => 22 + (t + .4) / (tE + .4) * 336;
    let mn = 0, mx = 0; for(let t = 0; t <= tE; t += .05){ mn = Math.min(mn, f(t)); mx = Math.max(mx, f(t)); }
    const ys = v => y0 + 82 - (v - mn) / (mx - mn) * 50;
    return `<rect x="10" y="${y0}" width="360" height="88" rx="12" fill="#17243F"/>` + TX(22, y0 + 20, t, {s:14, a:"start", c}) +
      `<line x1="22" y1="${ys(0)}" x2="358" y2="${ys(0)}" stroke="${HG}" stroke-width="1.5" stroke-dasharray="5 5"/>` + ts.map(x => `<rect x="${xs(x) - 3}" y="${y0 + 70}" width="6" height="14" rx="2" fill="#E5484D"/>`).join("") +
      `<path d="${pfad(f, -.4, tE, xs, ys, .05)}" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>`; }).join(""));
}
