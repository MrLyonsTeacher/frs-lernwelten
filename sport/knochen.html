<style>
:root{
  color-scheme:light;
  --bg:#F3EEE4; --surface:#FFFDF8; --surface-2:#F6F1E7; --ink:#12223A; --muted:#5B6578; --line:#D6CCB8;
  --accent:#0E9AA7; --accent-ink:#FFFFFF; --accent-2:#FFC94D; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --xray:#0C1B30; --glow:#7FE7FF;
  --radius:18px; --radius-btn:14px; --radius-ic:14px;
  --border:1px solid #DDD3C0; --shadow:0 3px 0 #D9CFBC; --border-opt:2px solid #DDD3C0;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#D7F3F5; --card-back:var(--xray); --tile-bg:#FFE9B8; --tile-ink:#12223A;
  --chip-bg:var(--xray); --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #DDD3C0;
  --track:#E4DCCB; --star:#F2A50C; --star-off:#DCD3C2;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(14,154,167,.10),transparent 42%)}
.chip{border:0}

/* Startbild: Röntgenbild */
.xray-hero{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 78% 40%,#1B3A5E 0,#0C1B30 62%);color:#fff;padding:clamp(1.4rem,4vw,2.4rem);min-height:260px;isolation:isolate}
.xray-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,rgba(127,231,255,.05) 0 2px,transparent 2px 6px)}
.xray-hero .kicker{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--accent-2);margin:0;letter-spacing:.04em}
.xray-hero h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.7rem,9.5vw,5.2rem);line-height:.9;margin:.3rem 0 .7rem;max-width:8ch;text-shadow:0 0 22px rgba(127,231,255,.45)}
.xray-hero p{margin:0;max-width:40ch;color:#CFE3F2;font-size:1.08rem}
.xray-hero .hero-sk{position:absolute;right:clamp(-10px,4vw,50px);top:14px;height:112%;width:auto;z-index:-1;opacity:.95}
.xray-hero .hero-sk .sk-bg{display:none}
.xray-hero .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(127,231,255,.9),transparent);box-shadow:0 0 18px 4px rgba(127,231,255,.35);z-index:-1;top:0}
@media (prefers-reduced-motion: no-preference){ .xray-hero .scanline{animation:scan 4.5s ease-in-out infinite} }
@keyframes scan{0%,100%{top:4%}50%{top:94%}}
@media (max-width:620px){ .xray-hero .hero-sk{opacity:.4;right:-30px} }

</style>
</head>

<script>
/* Röhrenknochen (Oberschenkelknochen, aufgeschnitten) */
function roehre(hl){
  hl = hl || [];
  const g = (id, inner, tag) => `<g data-z="${id}"${hl.includes(id)?' class="z-hl"':''}>${inner}${tag?`${tag[4]!==undefined?`<path class="tagl" d="M${tag[4]} ${tag[5]} L${tag[6]} ${tag[7]}"/>`:""}<text class="tag" x="${tag[0]}" y="${tag[1]}" text-anchor="${tag[2]||"start"}">${tag[3]}</text>`:""}</g>`;
  const head = (y, dir) => { // dir 1 = oben, -1 = unten (gespiegelt an y=270)
    const Y = v => +(dir===1 ? v : 540 - v).toFixed(1);
    return { outer:`M66 ${Y(78)} C66 ${Y(26)} 154 ${Y(26)} 154 ${Y(78)} C154 ${Y(104)} 138 ${Y(116)} 134 ${Y(142)} L86 ${Y(142)} C82 ${Y(116)} 66 ${Y(104)} 66 ${Y(78)} Z`,
      inner:`M74 ${Y(80)} C74 ${Y(40)} 146 ${Y(40)} 146 ${Y(80)} C146 ${Y(100)} 132 ${Y(112)} 128 ${Y(140)} L92 ${Y(140)} C88 ${Y(112)} 74 ${Y(100)} 74 ${Y(80)} Z`,
      cap:`M68 ${Y(66)} C72 ${Y(22)} 148 ${Y(22)} 152 ${Y(66)} C144 ${Y(42)} 76 ${Y(42)} 68 ${Y(66)} Z`,
      fuge:`M76 ${Y(96)} Q110 ${Y(106)} 144 ${Y(96)} L142 ${Y(103)} Q110 ${Y(113)} 78 ${Y(103)} Z`, Y };
  };
  const T = head(0,1), B = head(0,-1);
  return `<svg class="rk" viewBox="0 0 300 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aufgeschnittener Röhrenknochen">
    <defs>
      <pattern id="spong" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
        <rect width="12" height="12" fill="#E7B9A4"/><path d="M0 6 H12 M6 0 V12" stroke="#FFF4E6" stroke-width="2.6"/><circle cx="6" cy="6" r="2.2" fill="#C94F4F"/>
      </pattern>
      <pattern id="komp" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F4E9D2"/><path d="M0 4 H8" stroke="#E2D1AE" stroke-width="1.2"/></pattern>
      <pattern id="mark" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#F5CF5B"/><circle cx="4" cy="4" r="2.2" fill="#F9E08F"/><circle cx="11" cy="10" r="2.6" fill="#EDBE3E"/></pattern>
    </defs>
    <rect width="300" height="540" rx="18" fill="#0C1B30"/>
    ${g("kompakta", `<path d="${T.outer}" fill="url(#komp)"/><path d="${B.outer}" fill="url(#komp)"/><rect x="84" y="138" width="18" height="264" fill="url(#komp)"/><rect x="118" y="138" width="18" height="264" fill="url(#komp)"/>`, [160,184,"start","Kompakter Knochen",158,180,128,180])}
    ${g("spongiosa", `<path d="${T.inner}" fill="url(#spong)"/><path d="${B.inner}" fill="url(#spong)"/>`, [158,64,"start","Schwammknochen"])}
    ${g("mark", `<rect x="102" y="138" width="16" height="264" fill="url(#mark)"/><rect x="99" y="140" width="22" height="260" fill="none" stroke="transparent" stroke-width="2" class="h"/>`, [160,334,"start","Knochenmark",158,330,110,330])}
    ${g("fuge", `<path d="${T.fuge}" fill="#7CC8FF"/><path d="${B.fuge}" fill="#7CC8FF"/><path class="h" d="M76 100 Q110 110 144 100" stroke-width="12"/><path class="h" d="M76 440 Q110 430 144 440" stroke-width="12"/>`, [158,108,"start","Wachstumsfuge"])}
    ${g("knorpel", `<path d="${T.cap}" fill="#CFEFFF"/><path d="${B.cap}" fill="#CFEFFF"/><path class="h" d="M70 60 C76 26 144 26 150 60" stroke-width="12"/><path class="h" d="M70 480 C76 514 144 514 150 480" stroke-width="12"/>`, [158,30,"start","Gelenkknorpel"])}
    ${g("haut", `<path d="M82 146 V396 M138 146 V396" stroke="#F28B8B" stroke-width="4" fill="none"/><path class="h" d="M82 146 V396 M138 146 V396" stroke-width="14"/>`, [160,384,"start","Knochenhaut",158,380,140,380])}
    ${g("gefaess", `<path d="M232 238 C196 236 166 244 140 252 L112 262" stroke="#E0313B" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M232 250 C200 250 170 256 140 262" stroke="#4F7BE0" stroke-width="4" fill="none" stroke-linecap="round"/><path class="h" d="M232 244 C196 242 166 250 140 258 L112 266" stroke-width="22"/>`, [236,226,"end","Blutgefäß"])}
  </svg>`;
}

  konto: svgBox("0 0 220 200", `<rect width="220" height="200" rx="22" fill="#0C1B30"/>
    <path d="M24 170 H200 M24 170 V30" stroke="#5E7591" stroke-width="3"/>
    <path d="M24 162 C60 150 80 90 120 58 C140 46 150 44 170 50 C186 56 192 64 200 72" stroke="#FFC94D" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="40" y="30" width="80" height="140" fill="#7FE7FF" opacity=".12"/><text x="80" y="48" fill="#7FE7FF" font-size="13" text-anchor="middle" font-family="sans-serif">Kindheit &amp; Jugend</text>
    <circle cx="160" cy="46" r="6" fill="#FFC94D"/><text x="160" y="30" fill="#FFC94D" font-size="13" text-anchor="middle" font-family="sans-serif">25–30 J.</text>
    <text x="112" y="192" fill="#CFE3F2" font-size="13" text-anchor="middle" font-family="sans-serif">Alter →</text>`),
  kalzium: svgBox("0 0 200 200", `<rect width="200" height="200" rx="22" fill="#0C1B30"/>
    <path d="M38 60 h46 l-6 110 a6 6 0 0 1 -6 6 h-22 a6 6 0 0 1 -6 -6z" fill="#FFFFFF" stroke="#12223A" stroke-width="3"/><path d="M40 60 h42 l-1 18 h-40z" fill="#DDEBF5"/>
    <path d="M110 120 a34 34 0 0 1 68 0 v12 a8 8 0 0 1 -8 8 h-52 a8 8 0 0 1 -8 -8z" fill="#FFD34D" stroke="#12223A" stroke-width="3"/><circle cx="128" cy="124" r="5" fill="#F0B830"/><circle cx="152" cy="116" r="6" fill="#F0B830"/><circle cx="160" cy="132" r="4" fill="#F0B830"/>
    <circle cx="146" cy="58" r="16" fill="#3FAE5A"/><circle cx="132" cy="66" r="13" fill="#4CC26A"/><circle cx="160" cy="68" r="13" fill="#4CC26A"/><rect x="141" y="72" width="10" height="26" rx="4" fill="#8FD18F"/>

/* =========================================================
   Inhalte
   ========================================================= */
const BONES = [
  {id:"schaedel", name:"Schädel", e:"Der Schädel ist eine harte Kapsel aus mehreren fest verwachsenen Knochen. Er schützt dein **Gehirn** – darum gehört beim Radfahren ein Helm drauf."},
  {id:"unterkiefer", name:"Unterkiefer", e:"Der Unterkiefer ist der einzige **bewegliche** Knochen am Schädel. Ohne ihn könntest du nicht kauen und nicht sprechen."},
  {id:"schluesselbein", name:"Schlüsselbein", e:"Das Schlüsselbein verbindet das Brustbein mit der Schulter. Bei Stürzen auf die Schulter (z. B. vom Fahrrad) bricht es recht häufig.", nah:["schulterblatt"]},
  {id:"schulterblatt", name:"Schulterblatt", e:"Das Schulterblatt ist ein **platter Knochen** hinten auf dem Rücken. Viele Schultermuskeln setzen hier an. Von vorn sieht man nur seinen Rand.", nah:["schluesselbein"]},
  {id:"brustbein", name:"Brustbein", e:"Das Brustbein liegt vorn in der Mitte der Brust. Die Rippen sind über Knorpel damit verbunden. Bei der Herzdruckmassage drückst du auf das Brustbein.", nah:["rippen"]},
  {id:"rippen", name:"Rippen", e:"**12 Rippenpaare** bilden mit dem Brustbein und der Brustwirbelsäule den Brustkorb. Er schützt **Herz und Lunge** und bewegt sich beim Atmen mit.", nah:["brustbein"]},
  {id:"wirbelsaeule", name:"Wirbelsäule", e:"Die Wirbelsäule besteht aus über 30 Wirbeln – wie eine Kette. Sie trägt deinen Oberkörper, federt Stöße ab und schützt das **Rückenmark**."},
  {id:"oberarm", name:"Oberarmknochen", e:"Der Oberarmknochen ist ein langer **Röhrenknochen** zwischen Schulter und Ellenbogen. Bizeps und Trizeps liegen um ihn herum.", nah:["oberschenkel"]},
  {id:"speiche", name:"Speiche", e:"Die Speiche liegt im Unterarm auf der **Daumenseite**. Wenn du die Hand drehst, dreht sich die Speiche um die Elle. Bei Stürzen auf die ausgestreckte Hand bricht sie oft.", nah:["elle"]},
  {id:"elle", name:"Elle", e:"Die Elle liegt im Unterarm auf der Seite des **kleinen Fingers**. Ihr Ende ist die Spitze deines Ellenbogens.", nah:["speiche"]},
  {id:"hand", name:"Handknochen", e:"Eine Hand hat **27 Knochen**: Handwurzel, Mittelhand und Finger. Darum kannst du so fein greifen, werfen und fangen.", nah:["fuss"]},
  {id:"becken", name:"Becken", e:"Das Becken trägt den Oberkörper und verbindet ihn mit den Beinen. Es schützt Organe im Unterbauch, z. B. die Blase."},
  {id:"oberschenkel", name:"Oberschenkelknochen", e:"Der **längste und stärkste** Knochen deines Körpers – etwa ein Viertel deiner Körpergröße lang.", nah:["oberarm"]},
  {id:"kniescheibe", name:"Kniescheibe", e:"Die Kniescheibe sitzt vorn im Knie, eingebettet in die Sehne des großen Oberschenkelmuskels. Sie schützt das Kniegelenk und lenkt die Kraft des Muskels um."},
  {id:"schienbein", name:"Schienbein", e:"Das Schienbein ist der **dicke** Knochen innen am Unterschenkel – vorn liegt er direkt unter der Haut. Er trägt fast das ganze Körpergewicht. Darum gibt’s im Fußball Schienbeinschoner.", nah:["wadenbein"]},
  {id:"wadenbein", name:"Wadenbein", e:"Das Wadenbein ist der **dünne** Knochen außen am Unterschenkel. Es trägt wenig Gewicht, aber Muskeln setzen daran an und es stabilisiert das Sprunggelenk.", nah:["schienbein"]},
  {id:"fuss", name:"Fußknochen", e:"Ein Fuß hat **26 Knochen**. Hände und Füße zusammen haben mehr als die Hälfte aller Knochen deines Körpers!", nah:["hand"]}
];
const pick = ids => ids.map(id => BONES.find(b=>b.id===id));

const PARTS = [
