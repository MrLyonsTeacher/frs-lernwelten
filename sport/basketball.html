<script>
/* =========================================================
   Schaubilder (selbst gezeichnet, Maße nach FIBA-Regeln)
   ========================================================= */
// Spielfeld. o.halb = 3x3-Halbfeld (15 × 11 m), sonst ganzes Feld (28 × 15 m).
// o.hl: "zone" (Zone/3-Sekunden-Raum), "drei" (Bereich hinter der Dreierlinie), "linie" (Dreierlinie), "mitte" (Mittellinie), "aus" (Auslinien), "korb"
// o.sp = [Anzahl Team A, Anzahl Team B] Spielerpunkte, o.titel, o.notiz
const HOLZ = "#D9A566", HOLZ2 = "#C98F52", LINIE = "#FFFFFF";
function feld(o){
  o = o || {}; const hl = o.hl || [], halb = !!o.halb;
  const S = halb ? 21 : 12, L = halb ? 11 : 28, B = 15, x0 = halb ? 32 : 22, y0 = 50;
  const X = m => +(x0 + m * S).toFixed(1), Y = m => +(y0 + m * S).toFixed(1), W = (L) * S, H = B * S;
  const on = id => hl.includes(id), gelb = "#F2C14E";
  // eine Korbseite; m = Spiegel (Abstand von der linken Grundlinie → von der rechten)
  const seite = (rechts) => {
    const fx = m => rechts ? X(L - m) : X(m), dir = rechts ? -1 : 1;
    const ax = fx(2.99), r3 = 6.75 * S, rk = 1.575;
    const drei = `M${fx(0)} ${Y(.9)} L${ax} ${Y(.9)} A${r3} ${r3} 0 0 ${rechts ? 0 : 1} ${ax} ${Y(14.1)} L${fx(0)} ${Y(14.1)}`;
    let g = "";
    if(on("drei")) g += `<path d="M${fx(0)} ${Y(0)} L${fx(0)} ${Y(.9)} L${ax} ${Y(.9)} A${r3} ${r3} 0 0 ${rechts ? 0 : 1} ${ax} ${Y(14.1)} L${fx(0)} ${Y(14.1)} L${fx(0)} ${Y(15)} L${halb ? X(L) : fx(14)} ${Y(15)} L${halb ? X(L) : fx(14)} ${Y(0)} Z" fill="${gelb}" opacity=".45"/>`;
    g += `<rect x="${Math.min(fx(0), fx(5.8))}" y="${Y(5.05)}" width="${5.8 * S}" height="${4.9 * S}" fill="${on("zone") ? gelb : "#B5633A"}" opacity="${on("zone") ? .85 : .55}" stroke="${LINIE}" stroke-width="2"/>`;
    g += `<path d="M${fx(5.8)} ${Y(5.7)} A${1.8 * S} ${1.8 * S} 0 0 ${rechts ? 0 : 1} ${fx(5.8)} ${Y(9.3)}" fill="none" stroke="${LINIE}" stroke-width="2"/>`;
    g += `<path d="M${fx(5.8)} ${Y(5.7)} A${1.8 * S} ${1.8 * S} 0 0 ${rechts ? 1 : 0} ${fx(5.8)} ${Y(9.3)}" fill="none" stroke="${LINIE}" stroke-width="2" stroke-dasharray="4 4"/>`;
    g += `<path d="${drei}" fill="none" stroke="${on("linie") ? gelb : LINIE}" stroke-width="${on("linie") ? 5 : 2}"/>`;
    g += `<path d="M${fx(rk)} ${Y(6.25)} A${1.25 * S} ${1.25 * S} 0 0 ${rechts ? 0 : 1} ${fx(rk)} ${Y(8.75)}" fill="none" stroke="${LINIE}" stroke-width="1.6"/>`;
    g += `<path d="M${fx(1.2)} ${Y(6.6)} L${fx(1.2)} ${Y(8.4)}" stroke="#2B2B2B" stroke-width="4"/>`;
    g += `<circle cx="${fx(rk)}" cy="${Y(7.5)}" r="${.3 * S}" fill="none" stroke="${on("korb") ? gelb : "#E8833A"}" stroke-width="${on("korb") ? 4 : 3}"/>`;
    return g;
  };
  let f = `<rect x="${X(0) - 8}" y="${Y(0) - 8}" width="${W + 16}" height="${H + 16}" rx="6" fill="${HOLZ2}"/>`;
  f += `<rect x="${X(0)}" y="${Y(0)}" width="${W}" height="${H}" fill="${HOLZ}"/>`;
  for(let k = 1; k < (halb ? 14 : 16); k++) f += `<path d="M${X(0)} ${Y(k * (halb ? 15/14 : 15/16))} H${X(L)}" stroke="${HOLZ2}" stroke-width="1" opacity=".6"/>`;
  f += seite(false);
  if(!halb){ f += seite(true) + `<path d="M${X(14)} ${Y(0)} V${Y(15)}" stroke="${on("mitte") ? "#F2C14E" : LINIE}" stroke-width="${on("mitte") ? 5 : 2}"/><circle cx="${X(14)}" cy="${Y(7.5)}" r="${1.8 * S}" fill="none" stroke="${LINIE}" stroke-width="2"/>`; }
  f += `<rect x="${X(0)}" y="${Y(0)}" width="${W}" height="${H}" fill="none" stroke="${on("aus") ? "#E2574C" : LINIE}" stroke-width="${on("aus") ? 5 : 2.5}"/>`;
  // Spieler
  const sp = o.sp || [0, 0], dots = (n, farbe, seite) => {
    const P = halb ? [[7,4],[4.5,11],[8.5,9],[6,7]] : [[5,4],[9,7.5],[5,11],[12,3],[12,12]];
    return P.slice(0, n).map(([mx, my]) => { const xx = seite ? (halb ? X(mx - 1.6) : X(28 - mx)) : X(mx), yy = Y(seite && halb ? my + .8 : my);
      return `<circle cx="${xx}" cy="${yy}" r="${halb ? 9 : 7}" fill="${farbe}" stroke="#1A1A1A" stroke-width="2"/>`; }).join(""); };
  f += dots(sp[0], "#E8833A", false) + dots(sp[1], "#3E7CB1", true);
  const h = Y(15) + 36;
  return CK(380, Math.round(h), TX(190, 28, o.titel || (halb ? "3x3: halbes Feld, ein Korb" : "Basketball 5 gegen 5"), {s:16, c:HELL}) + f +
    (o.notiz ? TX(190, Math.round(h) - 12, o.notiz, {s:12.5, c:HG, w:600}) : ""));
}

// Wurfuhr (Shot Clock)
const uhr = (zahl, sub) => CK(380, 230, TX(190, 30, sub, {s:15, c:HELL}) +
  `<rect x="120" y="54" width="140" height="110" rx="14" fill="#111" stroke="${HG}" stroke-width="4"/><rect x="132" y="66" width="116" height="86" rx="6" fill="#1D0F0F"/>` +
  TX(190, 140, zahl, {s:70, c:"#FF4B3E", st:"font-family:'Barlow Condensed',sans-serif"}) + `<path d="M150 164 v26 M230 164 v26" stroke="${HG}" stroke-width="6"/>` + TX(190, 216, "Ist die Zeit um, bekommt der Gegner den Ball.", {s:12.5, c:HG, w:600}));

// Vier Aufgaben von Regeln
const sym = {
  schild: `<path d="M85 18 L120 30 C120 62 106 82 85 94 C64 82 50 62 50 30 Z" fill="${GR}"/><path d="M70 54 l11 11 l20 -22" stroke="${CB}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  waage: `<path d="M85 20 V86 M60 90 h50" stroke="${SA}" stroke-width="5" stroke-linecap="round"/><path d="M40 36 H130" stroke="${SA}" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 36 L26 66 H54 Z M130 36 L116 66 H144 Z" fill="none" stroke="${BL}" stroke-width="3"/><path d="M26 66 a14 7 0 0 0 28 0 Z M116 66 a14 7 0 0 0 28 0 Z" fill="${BL}"/><circle cx="85" cy="20" r="6" fill="${GE}"/>`,
  fluss: `<path d="M26 66 C50 30 70 90 96 56 C112 36 128 44 140 52" stroke="${BL}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M132 40 L146 54 L128 60" fill="none" stroke="${BL}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="40" r="11" fill="${OR}"/><path d="M33 40 h22 M44 29 v22" stroke="${CB}" stroke-width="2"/>`,
  mass: `<rect x="26" y="50" width="118" height="22" rx="4" fill="${GE}"/>${Array.from({length:12}, (_, k) => `<path d="M${34 + k * 9.5} 50 v${k % 2 ? 7 : 12}" stroke="${CB}" stroke-width="2"/>`).join("")}
    <path d="M85 20 V44" stroke="${HELL}" stroke-width="3"/><path d="M60 26 h50" stroke="${HELL}" stroke-width="3"/><circle cx="85" cy="26" r="9" fill="none" stroke="${OR}" stroke-width="4"/>`
};
const AUFGABEN = [["Sicherheit", sym.schild], ["Chancengleichheit", sym.waage], ["Spielfluss", sym.fluss], ["Vergleichbarkeit", sym.mass]];
const wozu = k => KACHELN("Wozu gibt es Regeln?", AUFGABEN, k);

// Formelles und informelles Fair Play
function fairplay(k){
  const sp = (x, c) => `<circle cx="${x}" cy="0" r="10" fill="${c}"/><path d="M${x} 10 v28 M${x} 38 l-9 20 M${x} 38 l9 20" stroke="${c}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
  const links = `<g transform="translate(0 100)"><rect x="14" y="-58" width="170" height="210" rx="16" fill="${CB2}" stroke="${k === 0 ? GE : CL}" stroke-width="${k === 0 ? 4 : 2}"/>
    <rect x="60" y="-36" width="78" height="96" rx="6" fill="${SA}"/>${[0,1,2,3,4].map(j => `<path d="M72 ${-20 + j * 15} h54" stroke="${CB}" stroke-width="4" stroke-linecap="round"/>`).join("")}
    <circle cx="128" cy="52" r="16" fill="${GR}"/><path d="M120 52 l6 6 l11 -12" stroke="${CB}" stroke-width="4" fill="none" stroke-linecap="round"/>
    ${TX(99, 104, "formell", {s:17, c:k === 0 ? GE : HELL})}${TX(99, 126, "Regeln einhalten", {s:12.5, c:HG, w:600})}</g>`;
  const rechts = `<g transform="translate(182 100)"><rect x="14" y="-58" width="170" height="210" rx="16" fill="${CB2}" stroke="${k === 1 ? GE : CL}" stroke-width="${k === 1 ? 4 : 2}"/>
    <g transform="translate(0 -20)">${sp(70, "#E8833A")}${sp(128, "#3E7CB1")}<path d="M70 20 L99 32 L128 20" stroke="${HELL}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="99" cy="32" r="5" fill="${GE}"/></g>
    <path d="M99 -30 c-6 -10 -18 -4 -12 6 l12 12 l12 -12 c6 -10 -6 -16 -12 -6 z" fill="${RO}"/>
    ${TX(99, 104, "informell", {s:17, c:k === 1 ? GE : HELL})}${TX(99, 126, "Gegner als Partner achten", {s:12.5, c:HG, w:600})}</g>`;
  return CK(380, 270, TX(190, 28, "Zwei Seiten von Fair Play", {s:17, c:HELL}) + `<g opacity="${k === 1 ? .45 : 1}">${links}</g><g opacity="${k === 0 ? .45 : 1}">${rechts}</g>`);
}

/* =========================================================
   Inhalte (abgestimmt auf Camp-Logbuch Etappe 2)
   ========================================================= */
const LERNEN = {

    {bild:feld({hl:["drei","linie"], titel:"Punkte"}), titel:"Punkte", text:"Ein Korb **innerhalb** der Dreierlinie zählt **2 Punkte**, ein Korb von **hinter** der Linie (gelb) **3 Punkte**, ein **Freiwurf** 1 Punkt. Wer auf der Linie steht, wirft noch für 2 Punkte."},
    {bild:FOTO("bb2-schrittfehler","👟","Schrittfehler"), titel:"Schrittfehler & Doppeldribbling", text:"Mit dem Ball in der Hand darfst du **höchstens zwei Schritte** machen (**Schrittfehler**). Wer das Dribbling beendet und den Ball festhält, darf **nicht noch einmal dribbeln** (**Doppeldribbling**). Folge: **Ballverlust**, der Gegner bekommt den Ball."},
    {bild:feld({hl:["zone"], titel:"Die Zone"}), titel:"3 Sekunden in der Zone", text:"Ein Angreifer darf höchstens **3 Sekunden** am Stück in der **Zone** (gelb) unter dem gegnerischen Korb stehen. Sonst gibt es **Ballverlust**. So bleibt der Raum unter dem Korb nicht dauerhaft zugestellt."},
    {bild:uhr("24", "Die Wurfuhr (Shot Clock)"), titel:"24 und 8 Sekunden", text:"Ein Team hat **24 Sekunden** Zeit für einen Wurf, der den Ring berührt. Den Ball aus der eigenen Hälfte über die Mittellinie bringen muss es in **8 Sekunden**. Danach darf der Ball nicht mehr in die eigene Hälfte zurück (**Rückspiel**)."},
    {bild:FOTO("bb2-foul","🛑","Foul im Zweikampf"), titel:"Fouls", text:"Halten, Stoßen, Schlagen und Rempeln sind **Fouls**. Jeder Spieler hat einen unsichtbaren **Zylinder** um sich: Wer hineindrängt, foult. Nach einem Foul gibt es **Einwurf**, beim Wurf **Freiwürfe**. Nach dem **5. Foul** muss ein Spieler vom Feld."},
    {bild:feld({hl:["aus"], titel:"Aus"}), titel:"Aus und Einwurf", text:"Die **Linien gehören zum Aus**. Berührt der Ball die Linie oder den Boden dahinter, bekommt der Gegner einen **Einwurf**. Für den Einwurf hat man **5 Sekunden**."}

  dreier: { titel:"3x3: Basketball in klein", folien:[

    {bild:feld({halb:true, hl:["drei","linie"], titel:"Punkte beim 3x3"}), titel:"Andere Punkte", text:"Beim 3x3 zählt alles **einen Punkt weniger**: ein Korb **innerhalb** des Bogens **1 Punkt**, von **hinter** dem Bogen (gelb) **2 Punkte**. Ein Freiwurf zählt 1 Punkt."},
    {bild:uhr("12", "Wurfuhr beim 3x3"), titel:"12 Sekunden", text:"Ein 3x3-Team hat nur **12 Sekunden** für einen Angriff, halb so viel wie beim großen Spiel. Es gibt keinen Weg über die Mittellinie, und das Feld ist klein. So bleibt das Spiel **schnell und spannend**."},
    {bild:FOTO("bb2-check","🔄","Ball hinter den Bogen bringen"), titel:"Erst raus, dann rein", text:"Nach einem **Korb** bekommt die Verteidigung den Ball direkt **unter dem Korb** und muss ihn erst **hinter den Bogen** dribbeln oder passen. Das gilt auch nach einem **Rebound** oder Ballgewinn der Verteidigung. Erst dann darf sie selbst auf den Korb werfen."},
    {bild:FOTO("bb2-21","🏁","Spielende beim 3x3"), titel:"Bis 21 oder 10 Minuten", text:"Ein 3x3-Spiel dauert **10 Minuten**. Hat ein Team vorher **21 Punkte**, ist das Spiel sofort zu Ende. Statt Sprungball entscheidet zu Beginn ein **Münzwurf**, wer anfängt."}
  ]},
  wozu: { titel:"Wozu gibt es Regeln?", folien:[
    {bild:FOTO("bb2-pfirsichkorb","🧺","Erstes Basketballspiel mit Pfirsichkörben"), titel:"13 Regeln für ein neues Spiel", text:"**1891** erfand der Sportlehrer **James Naismith** in Springfield (USA) ein Spiel für den Winter in der Halle. Als Körbe hingen zwei **Pfirsichkörbe** an der Galerie. Sein Spiel hatte **13 Regeln**. Heute ist das Regelwerk viel länger. Warum eigentlich?"},
    {bild:wozu(0), titel:"A · Sicherheit", text:"Regeln **schützen** die Spieler: Halten, Stoßen und Schlagen sind verboten. Grobe Fouls werden besonders hart bestraft."},
    {bild:wozu(1), titel:"B · Chancengleichheit", text:"Beide Teams haben **die gleichen Chancen**: gleich viele Spieler, gleiche Zeit, gleiche Körbe. Niemand bekommt einen Vorteil."},
    {bild:wozu(2), titel:"C · Spielfluss", text:"Regeln halten das Spiel **in Bewegung**: Die **Wurfuhr** zwingt zum Werfen, die **3-Sekunden-Regel** verhindert, dass jemand den Korb zustellt."},
    {bild:wozu(3), titel:"D · Vergleichbarkeit", text:"Überall auf der Welt gelten **dieselben Maße**: Der Korb hängt in **3,05 m** Höhe. So kann man Spiele und Leistungen überall **vergleichen**."}
  ]},
  fair: { titel:"Fair Play: mehr als Regeln", folien:[
    {bild:fairplay(0), titel:"Formelles Fair Play", text:"Formelles Fair Play heißt: Ich **halte mich an die Regeln**, auch wenn der Schiri gerade nicht hinschaut. Ein **Regelverstoß** wie Trikot festhalten oder Schrittfehler ist unfair."},
    {bild:fairplay(1), titel:"Informelles Fair Play", text:"Informelles Fair Play geht **über die Regeln hinaus**: Ich achte meinen Gegner als **Partner**, ohne den es gar kein Spiel gäbe. Jemanden auslachen ist zum Beispiel nicht verboten, aber **unfair**."},
    {bild:FOTO("bb2-hilfe","🤝","Spiel unterbrechen und helfen"), titel:"Mehr als die Regel verlangt", text:"Fair ist, wer **mehr tut, als die Regel verlangt**: zugeben, dass man den Ball zuletzt berührt hat, das Spiel unterbrechen, wenn sich jemand verletzt, oder **alle Mitspieler** einbeziehen."},
    {bild:FOTO("bb2-streetball","🏀","Streetball ohne Schiri"), titel:"Call your own foul", text:"Im **Streetball** gibt es oft keinen Schiri. Dort ruft man **sein eigenes Foul**. Das funktioniert nur, wenn alle **ehrlich** sind. Genau das ist Fair Play."}
  ]},
  reime: { titel:"Merk-Reime", folien:[
    {bild:FOTO("bb2-schrittfehler","👟"), titel:"Schrittfehler", text:"**„Zwei Schritte nur mit Ball in der Hand, beim dritten Schritt ist der Ball verbrannt.“**"},
    {bild:feld({hl:["zone"], titel:"Die Zone"}), titel:"Zone", text:"**„Drei Sekunden in der Zone, länger stehen gibt’s nicht – ohne!“**"},
    {bild:uhr("12", "Wurfuhr beim 3x3"), titel:"3x3", text:"**„Drei gegen drei auf einen Korb, zwölf Sekunden – und schon ist’s fort.“**"},
    {bild:wozu(-1), titel:"Vier Aufgaben", text:"**„Sicher, gleich, im Fluss, vergleichbar – so macht Regeln Sinn, ganz klar.“**"},
    {bild:fairplay(1), titel:"Fair Play", text:"**„Regeln halten ist formell – den Gegner achten informell.“**"}
  ]}
};

const HERO = campHero({ ort:"spielfeld", symbol:"turm", etappe:"Etappe 2", titel:"Spielregeln & Fairness",
  text:"Vom Schiri-Turm hast du das ganze Feld im Blick: Basketball, 3x3 und die Frage, warum es Regeln gibt und was fair ist. Sammle Holzscheite 🪵 für dein Camp-Feuer." });

const FV = ["5 gegen 5", "3x3"];
LW.start(Object.assign({}, CAMP, {

  titel: "Spielregeln & Fairness – Lernwelt",
  hero: HERO,
  kartenSymbol: "🏀",

  lernen: LERNEN,
  levels: [
    { id:"memory", lernen:"regeln", typ:"memory", icon:"🧠", titel:"Regel-Memory", art:"Memory · 8 Paare",
      anleitung:"Finde **Regel + Erklärung**. Je weniger Züge du brauchst, desto mehr Punkte.",

    { id:"schiri", lernen:"regeln", typ:"quiz", icon:"🧑‍⚖️", titel:"Du bist der Schiri", art:"Spielsituationen entscheiden",
      anleitung:"Lies die Situation und entscheide wie ein Schiri. Richtig = **2 Punkte**.",
