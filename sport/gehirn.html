<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1236">
<title>Gehirn-Arena-Lernwelt</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../lernwelt/lernwelt.css">
<link rel="stylesheet" href="sport-kit.css">
<style>
:root{
  color-scheme:light;
  --bg:#F4EFF3; --surface:#FFFFFF; --surface-2:#F8F3F7; --ink:#2A1236; --muted:#665870; --line:#DCCFDB;
  --accent:#C2347A; --accent-ink:#FFFFFF; --accent-2:#FFC233; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --xray:#101A33; --glow:#FF9EC4;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #E0D4DF; --shadow:0 3px 0 #D3C4D2; --border-opt:2px solid #E0D4DF;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#FFE0EE; --card-back:#2A1236; --tile-bg:#FFE9B8; --tile-ink:#2A1236;
  --chip-bg:#2A1236; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #E0D4DF;
  --track:#E7DDE6; --star:#C2347A; --star-off:#E0D4DF;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(194,52,122,.12),transparent 42%)}
.chip{border:0}
.arena-hero{background:linear-gradient(160deg,#2A1236 0,#5A1F5C 60%,#FF9EC4 170%)}
@media (prefers-reduced-motion: no-preference){ .arena-hero .puls{transform-box:fill-box;transform-origin:50% 50%;animation:puls 2.4s ease-in-out infinite} @keyframes puls{50%{transform:scale(1.06)}}
  .arena-hero .funke{animation:funke 1.8s ease-in-out infinite} @keyframes funke{50%{opacity:.15}} }
</style>
</head>
<body>
<main class="lw" id="app"></main>

<script src="../qrcode.js"></script>
<script src="../ergebnis.js"></script>
<script src="../lernwelt/lernwelt.js"></script>
<script src="sport-kit.js"></script>
<script>
/* Bilder: ChatGPT-Illustrationen (sport/gehirn-bilder/NAME.webp), sobald vorhanden in BILDER eintragen. */
const BILDER = new Set([]);
const FOTO = (n, alt, ersatz) => BILDER.has(n) ? `<img class="lnbild" src="gehirn-bilder/${n}.webp" alt="${alt||""}">` : ersatz;

/* =========================================================
   Selbst gezeichnete Schaubilder
   ========================================================= */
const GE = "#FFD34D", OR = "#FF9A3D", GR = "#5BE38C", RO = "#FF6B6B", BL = "#5FE9FF", HG = "#9FB0CF", LI = "#C99BFF", PI = "#FF9EC4";
const zeile = (x, y, w, h, farbe, a, b, sa=13.5) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="8" height="${h}" rx="3" fill="${farbe}"/>` +
  TX(x + 18, y + (b ? h/2 - 3 : h/2 + 5), a, {s:sa, a:"start", c:"#FFFFFF"}) + (b ? TX(x + 18, y + h/2 + 14, b, {s:11, a:"start", c:HG, w:600}) : "");
const ok = (x, y) => `<circle cx="${x}" cy="${y}" r="10" fill="#14834F"/><path d="M${x-5} ${y} l3.5 4 l7 -8" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>`;
const no = (x, y) => `<circle cx="${x}" cy="${y}" r="10" fill="#8E2A2A"/><path d="M${x-4} ${y-4} l8 8 M${x+4} ${y-4} l-8 8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>`;
const mi = (x, y) => `<circle cx="${x}" cy="${y}" r="10" fill="#8A6A10"/><path d="M${x-5} ${y} h10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>`;

// Umgekehrte U-Kurve: Anspannung und Leistung (als Infokarte oder Antipp-Schaubild)
function ukurve(fig){
  const X = a => 50 + a * 380, Y = l => 250 - l * 180, f = a => Math.exp(-(((a - .5) / .26) ** 2));
  let p = ""; for(let a = 0; a <= 1.0001; a += .01) p += `${p ? "L" : "M"}${X(a).toFixed(1)} ${Y(f(a)).toFixed(1)}`;
  const Z = [["locker", 0, .3, "zu locker", BL, "unkonzentriert,|lustlos, Fehler"], ["richtig", .3, .7, "genau richtig", GR, "wach, konzentriert –|beste Leistung"], ["aufgeregt", .7, 1, "zu aufgeregt", RO, "verkrampft, zittrig,|fehleranfällig"]];
  let s = `<line x1="50" y1="40" x2="50" y2="256" stroke="#5B6C93" stroke-width="2"/>` + PFEIL(50, 256, 444, 256, "#5B6C93", 2) + TX(56, 34, "Leistung", {s:13, a:"start", c:HG}) + TX(440, 276, "Aufregung / Anspannung →", {s:12.5, a:"end", c:HG});
  Z.forEach(([id,a,b,t,c,u]) => {
    const g = `<rect x="${X(a)}" y="44" width="${X(b) - X(a)}" height="210" fill="${c}" opacity=".10"/>` + TX(X((a+b)/2), 300, t, {s:15, c}) + TX(X((a+b)/2), 320, u, {s:11.5, c:"#FFFFFF", w:600});
    s += fig ? `<g data-z="${id}"><rect class="zr" x="${X(a) + 2}" y="42" width="${X(b) - X(a) - 4}" height="306" rx="12"/>${g}</g>` : g; });
  s += `<path d="${p}" fill="none" stroke="${PI}" stroke-width="6" stroke-linecap="round"/>`;
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 480 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umgekehrte U-Kurve"><rect width="480" height="356" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.ukurve = () => ukurve(true);

// Sinnperspektiven-Rad (als Infokarte oder Antipp-Schaubild)
const SINN = [["leistung","Leistung","sich verbessern,|gewinnen",OR],["miteinander","Miteinander","Team,|Gemeinschaft",BL],["gesundheit","Gesundheit","fit sein,|sich wohlfühlen",GR],
  ["wagnis","Wagnis","Mut,|Nervenkitzel",RO],["ausdruck","Ausdruck","gestalten,|sich darstellen",LI],["eindruck","Eindruck","Körper & Natur|erleben",GE]];
function sinnrad(fig){
  const cx = 220, cy = 214, R = 188, r = 56;
  let s = "";
  SINN.forEach(([id,t,u,c],k) => { const a0 = (k / 6) * 2 * Math.PI - Math.PI / 2 - Math.PI / 6, a1 = a0 + Math.PI / 3, am = (a0 + a1) / 2;
    const P = (a, rr) => `${(cx + Math.cos(a) * rr).toFixed(1)} ${(cy + Math.sin(a) * rr).toFixed(1)}`;
    const d = `M${P(a0, r)} L${P(a0, R)} A${R} ${R} 0 0 1 ${P(a1, R)} L${P(a1, r)} A${r} ${r} 0 0 0 ${P(a0, r)} Z`;
    const tx = cx + Math.cos(am) * 124, ty = cy + Math.sin(am) * 124;
    const g = `<path d="${d}" fill="${c}" opacity=".9" stroke="#101A33" stroke-width="4"/>` + TX(+tx.toFixed(1), +(ty - 6).toFixed(1), t, {s:16, c:"#101A33"}) + TX(+tx.toFixed(1), +(ty + 14).toFixed(1), u, {s:11, c:"#1A1A2E", w:600});
    s += fig ? `<g data-z="${id}"><path class="zr" d="${d}"/>${g}</g>` : g; });
  s += `<circle cx="${cx}" cy="${cy}" r="${r - 4}" fill="#1E2C4D"/>` + TX(cx, cy - 4, "Warum", {s:15}) + TX(cx, cy + 15, "Sport?", {s:15});
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 440 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sechs Sinnperspektiven"><rect width="440" height="428" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.sinnrad = () => sinnrad(true);

const ICON = {
  merkmale: KARTE(380, 236, TX(190, 30, "Was macht Sport aus?", {s:18, c:PI}) +
    [["körperliche|Bewegung",GR,"🏃"],["Leistung /|Wettkampf",OR,"🏆"],["feste|Regeln",BL,"📏"],["Fair|Play",PI,"🤝"]].map(([t,c,e],k) => { const x = 50 + k*93;
      return `<circle cx="${x}" cy="100" r="36" fill="#1E2C4D" stroke="${c}" stroke-width="3"/><text x="${x}" y="113" font-size="34" text-anchor="middle">${e}</text>` + TX(x, 160, t, {s:13.5, c}); }).join("") +
    TX(190, 222, "Es gibt keine einzige richtige Definition.", {s:12.5, c:HG, w:600})),
  grenzfaelle: KARTE(420, 292, TX(210, 26, "Ist das Sport? – Merkmale im Check", {s:16, c:PI}) +
    ["Bewegung","Wettkampf","Regeln","Fair Play"].map((t,k) => TX(214 + k*54, 56, t, {s:10.5, c:HG})).join("") +
    [["Fußball im Verein",[1,1,1,1]],["Schach",[0,1,1,1]],["E-Sport-Turnier",[2,1,1,1]],["Joggen im Park",[1,0,0,2]],["Formel 1",[1,1,1,1]],["Disco-Tanzen",[1,0,0,2]]].map(([t,m],r) => { const y = 66 + r*34;
      return `<rect x="10" y="${y}" width="400" height="30" rx="8" fill="${r % 2 ? "#17243F" : "#1E2C4D"}"/>` + TX(20, y + 20, t, {s:12.8, a:"start", c:"#FFFFFF"}) + m.map((v,k) => (v === 1 ? ok : v === 0 ? no : mi)(214 + k*54, y + 15)).join(""); }).join("") +
    TX(210, 282, "– = kaum / umstritten · Schach ist vom DOSB als Sportart anerkannt", {s:11, c:HG, w:600})),
  fairness: KARTE(400, 250, TX(200, 28, "Zwei Arten von Fairness", {s:17, c:PI}) +
    `<rect x="14" y="44" width="180" height="192" rx="14" fill="#14301F" stroke="${GR}" stroke-width="2.5"/><rect x="206" y="44" width="180" height="192" rx="14" fill="#2A1A3A" stroke="${PI}" stroke-width="2.5"/>` +
    TX(104, 72, "formell", {s:18, c:GR}) + TX(104, 92, "Regeln einhalten", {s:12.5, c:"#FFFFFF"}) + TX(104, 124, "kein Foul|keine Tricks|Schiri-Entscheidungen|akzeptieren", {s:12, c:HG, w:600, lh:1.4}) +
    TX(296, 72, "informell", {s:18, c:PI}) + TX(296, 92, "mehr als die Regeln", {s:12.5, c:"#FFFFFF"}) + TX(296, 124, "Respekt|Gegner aufhelfen|ehrlich sein – auch wenn|es niemand sieht", {s:12, c:HG, w:600, lh:1.4})),
  werte: KARTE(400, 236, TX(200, 30, "Die drei olympischen Werte", {s:17, c:PI}) +
    [["Höchst-|leistung","Excellence",GE],["Freund-|schaft","Friendship",BL],["Respekt","Respect",GR]].map(([t,e,c],k) => { const x = 72 + k*128;
      return `<circle cx="${x}" cy="118" r="56" fill="#1E2C4D" stroke="${c}" stroke-width="6"/><circle cx="${x}" cy="118" r="44" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 4"/>` +
        TX(x, t.includes("|") ? 114 : 124, t, {s:15, c}) + TX(x, 198, e, {s:12, c:HG, w:600}); }).join("")),
  emotionen: KARTE(400, 260, TX(200, 26, "Gefühle im Sport – und was der Körper zeigt", {s:15, c:PI}) +
    [["Nervosität / Angst","Herzklopfen, zittrige Knie, Bauchkribbeln",LI],["Freude / Stolz","Gänsehaut, Energie, Kraft",GE],["Ärger / Wut","heißer Kopf, Anspannung",RO],["Scham","heißer Kopf, Blick nach unten",OR],["Enttäuschung","Kloß im Hals, Müdigkeit",BL]].map(([a,b,c],k) =>
      zeile(12, 40 + k*43, 376, 38, c, a, b, 13)).join("")),
  protokoll: KARTE(400, 236, TX(200, 26, "Mein Emotionsprotokoll", {s:17, c:PI}) +
    [["Situation","Was ist passiert?"],["Auslöser","Was hat es ausgelöst?"],["Gefühl","Welche Emotion? 1–10"],["Körper","Was spürst du?"],["Reaktion","Was hast du getan?"],["Nächstes Mal","Was machst du anders?"]].map(([a,b],k) => { const x = 12 + (k % 3) * 128, y = 44 + Math.floor(k/3) * 92;
      return `<rect x="${x}" y="${y}" width="120" height="82" rx="12" fill="#1E2C4D" stroke="${k === 5 ? GR : "#3A4A75"}" stroke-width="2"/><circle cx="${x + 18}" cy="${y + 18}" r="11" fill="${PI}"/>` + TX(x + 18, y + 23, k + 1, {s:13, c:"#101A33"}) +
        TX(x + 60, y + 48, a, {s:13.5, c:"#FFFFFF"}) + TX(x + 60, y + 68, b, {s:10.2, c:HG, w:600}); }).join("")),
  sportarten: KARTE(400, 220, TX(200, 30, "Wie viel Aufregung hilft?", {s:17, c:PI}) +
    `<defs><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="${BL}"/><stop offset="1" stop-color="${OR}"/></linearGradient></defs><rect x="20" y="96" width="360" height="16" rx="8" fill="url(#ag)"/>` +
    TX(20, 80, "eher wenig", {s:14, a:"start", c:BL}) + TX(380, 80, "eher mehr", {s:14, a:"end", c:OR}) +
    TX(20, 142, "präzise, feine Bewegungen:", {s:12, a:"start", c:"#FFFFFF"}) + TX(20, 162, "Bogenschießen, Golf,", {s:12, a:"start", c:HG, w:600}) + TX(20, 180, "Elfmeter, Freiwurf", {s:12, a:"start", c:HG, w:600}) +
    TX(380, 142, "Kraft & Schnellkraft:", {s:12, a:"end", c:"#FFFFFF"}) + TX(380, 162, "Gewichtheben, Sprint,", {s:12, a:"end", c:HG, w:600}) + TX(380, 180, "Kugelstoßen", {s:12, a:"end", c:HG, w:600}) +
    TX(200, 208, "Und: Jeder Mensch ist anders.", {s:12, c:GE})),
  strategien: KARTE(420, 280, TX(210, 26, "Sechs Strategien", {s:17, c:PI}) +
    [["A","Ruhig atmen","4 s ein, 6 s aus",BL],["B","Selbstgespräch","„Ich hab das geübt.“",GR],["C","Routine","immer gleicher Ablauf",GE],["D","Fokuswort","„Ball!“ – „Ruhig!“",OR],["E","Kleine Schritte","Aufgabe in Etappen",LI],["F","Kurz raus","wegdrehen, bis 10 zählen",RO]].map(([b,a,u,c],k) => { const x = 12 + (k % 2) * 202, y = 40 + Math.floor(k/2) * 78;
      return `<rect x="${x}" y="${y}" width="194" height="70" rx="12" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="44" height="70" rx="12" fill="${c}"/>` + TX(x + 22, y + 46, b, {s:26, c:"#101A33", w:800}) +
        TX(x + 56, y + 30, a, {s:14.5, a:"start", c:"#FFFFFF"}) + TX(x + 56, y + 52, u, {s:11.4, a:"start", c:HG, w:600}); }).join("")),
  atmen: KARTE(360, 220, TX(180, 30, "Ruhig atmen", {s:17, c:BL}) + `<path d="M40 160 L150 70 L320 160" fill="none" stroke="${BL}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>` +
    TX(100, 150, "ein", {s:16, c:"#FFFFFF"}) + TX(100, 170, "4 Sekunden", {s:12.5, c:HG, w:600}) + TX(262, 78, "aus – länger", {s:16, c:"#FFFFFF"}) + TX(262, 98, "6 Sekunden", {s:12.5, c:HG, w:600}) +
    TX(180, 200, "Nur ruhig atmen – kein Luftanhalten, kein Hecheln.", {s:12, c:GE})),
  selbstgespraech: KARTE(420, 250, TX(210, 26, "Selbstgespräch umformulieren", {s:17, c:PI}) +
    [["„Ich verhaue das bestimmt.“","„Ich hab das geübt – ich mache meinen Ablauf.“"],["„Der Gegner ist viel zu stark.“","„Ich spiele mein Spiel, Schritt für Schritt.“"],["„Alle schauen mir zu.“","„Ich konzentriere mich auf den Ball.“"]].map(([a,b],k) => { const y = 42 + k*68;
      return `<rect x="12" y="${y}" width="150" height="58" rx="10" fill="#3A1A22"/>` + TX(87, y + 34, a, {s:11, c:"#FFB3B3"}) + PFEIL(166, y + 29, 194, y + 29, "#FFFFFF", 3) +
        `<rect x="198" y="${y}" width="210" height="58" rx="10" fill="#14301F"/>` + TX(303, y + 34, b, {s:10.6, c:"#C8F7D6"}); }).join("")),
  mut: KARTE(380, 250, TX(190, 26, "Mut in kleinen Stufen", {s:17, c:PI}) +
    [["Rolle auf der Matte",BL],["Rolle vom Mattenberg",GR],["niedriger Kasten + Hilfe",GE],["über den Kasten + Hilfe",OR]].map(([t,c],k) => { const x = 16 + k*40, y = 196 - k*40;
      return `<rect x="${x}" y="${y}" width="${348 - k*40}" height="36" rx="6" fill="${c}"/>` + TX(x + 8, y + 23, (k + 1) + "  " + t, {s:11.6, a:"start", c:"#101A33"}); }).join("") +
    TX(190, 244, "Mut = trotz Angst einen überlegten Schritt wagen", {s:11.8, c:"#FFFFFF", w:600})),
  karte: KARTE(420, 230, TX(210, 26, "Meine Strategie-Karte", {s:17, c:PI}) +
    [["WENN …","der Schiri gegen|mich pfeift",RO],["… MERKE ICH ES AN","heißem Kopf",OR],["… DANN MACHE ICH","kurz wegdrehen,|bis 10 zählen",GR],["MEIN SATZ","„Nächster|Ball!“",BL]].map(([a,b,c],k) => { const x = 10 + k*102;
      return `<rect x="${x}" y="44" width="96" height="160" rx="12" fill="#1E2C4D" stroke="${c}" stroke-width="2.5"/>` + TX(x + 48, 68, a, {s:9.6, c}) + TX(x + 48, 118, b, {s:12, c:"#FFFFFF", w:600}); }).join("") +
    TX(210, 222, "Beispiel – deine eigene Karte füllst du selbst aus.", {s:11.2, c:HG, w:600})),
  stationen: KARTE(420, 270, TX(210, 26, "Sport & Gesellschaft", {s:17, c:PI}) +
    [["A","Medien","Was wird gezeigt – was nie?",BL],["B","Geld","Woher bekommt ein Verein Geld?",GE],["C","Umwelt","Anreise, Stadien, Skigebiete",GR],["D","Inklusion","Sport mit und ohne Behinderung",PI]].map(([b,a,u,c],k) => { const x = 12 + (k % 2) * 202, y = 42 + Math.floor(k/2) * 110;
      return `<rect x="${x}" y="${y}" width="194" height="100" rx="14" fill="#1E2C4D" stroke="${c}" stroke-width="2.5"/><circle cx="${x + 28}" cy="${y + 30}" r="16" fill="${c}"/>` + TX(x + 28, y + 36, b, {s:16, c:"#101A33"}) +
        TX(x + 54, y + 36, a, {s:17, a:"start", c:"#FFFFFF"}) + TX(x + 97, y + 72, u, {s:11.2, c:HG, w:600}); }).join(""))
};

/* =========================================================
   Inhalte (abgestimmt auf AB 26, 27, 28, 29 und 32)
   ========================================================= */
const LERNEN = {
  fairplay: { titel:"Wettkampf & Fair Play", folien:[
    {bild:ICON.merkmale, titel:"Was ist Sport?", text:"Sport verbindet **körperliche Bewegung** mit **Leistung** bzw. **Wettkampf**, **festen Regeln** und **Fair Play**. Nicht immer sind alle Merkmale da – darum muss man bei manchen Fällen **abwägen**."},
    {bild:ICON.grenzfaelle, titel:"Grenzfälle", text:"**Schach:** kaum Bewegung, aber Wettkampf und Regeln – vom **DOSB** als Sportart anerkannt. **E-Sport:** Wettkampf und Regeln, wenig Bewegung – **umstritten**. **Joggen:** Bewegung, meist ohne Wettkampf (Freizeitsport). **Formel 1:** hohe körperliche Belastung der Fahrer. **Disco-Tanzen:** Bewegung ohne Regeln und Wettkampf. Entscheidend ist die **Begründung**."},
    {bild:ICON.fairness, titel:"Formelle Fairness", text:"**Formelle Fairness** heißt: **Regeln einhalten** – kein Foul, keine Tricks, **Schiri-Entscheidungen akzeptieren**. Beispiel: Ein Floorballspieler hält sich an die Regel „kein hoher Stock“."},
    {bild:ICON.fairness, titel:"Informelle Fairness", text:"**Informelle Fairness** geht **über die Regeln hinaus**: **Respekt**, dem Gegner aufhelfen, **ehrlich sein – auch wenn es niemand sieht**. Beispiel: Eine Spielerin spielt den Ball ins Aus, weil ein Gegner verletzt am Boden liegt. **Unfair** ist z. B. ein **vorgetäuschtes Foul** oder lautes Jubeln über den Fehler des Gegners."},
    {bild:ICON.werte, titel:"Die olympischen Werte", text:"Die Olympische Bewegung nennt drei Werte: **Höchstleistung** (Excellence) – sein Bestes geben, **Freundschaft** – Verbindung über Grenzen hinweg, und **Respekt** – vor Gegnern, Regeln und sich selbst."},
    {bild:FOTO("em9-gold-geteilt","Zwei Hochspringer teilen sich die Goldmedaille","🥇"), titel:"Geteiltes Gold", text:"Bei Olympia 2021 in Tokio waren zwei Hochspringer gleich hoch gesprungen. Statt in ein Stechen zu gehen, **teilten sie sich die Goldmedaille** – ein Zeichen von **Freundschaft** und **Respekt**."},
    {bild:FOTO("em9-aufhelfen","Läuferin hilft gestürzter Konkurrentin","🤝"), titel:"Fair Play im Turnier", text:"Für das Floorball-Turnier entwickelt ihr eine **Fair-Play-Wertung** mit vier Kriterien (je 0–2 Punkte), z. B. **Regeln einhalten**, **respektvoll** mit Gegner und Schiri, **Fehler zugeben**, **Begrüßung und Verabschiedung**, **alle einbinden**."}
  ]},
  emotionen: { titel:"Emotionen im Sport", folien:[
