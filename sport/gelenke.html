<!DOCTYPE html>
<html lang="de">
<head>

<link rel="stylesheet" href="../fonts/fonts.css">

<style>
:root{
  color-scheme:light;
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#1B2433; --muted:#5A6577; --line:#CBD2DC;
  --accent:#E8650F; --accent-ink:#FFFFFF; --accent-2:#FFC94D; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --xray:#1B2433; --glow:#FFB054;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #D3D9E2; --shadow:0 3px 0 #C7CED8; --border-opt:2px solid #D3D9E2;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#FFE3CC; --card-back:#1B2433; --tile-bg:#FFE3CC; --tile-ink:#1B2433;
  --chip-bg:#1B2433; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #D3D9E2;
  --track:#DCE1E8; --star:#E8650F; --star-off:#D3D9E2;
}
body{background:var(--bg) repeating-linear-gradient(45deg,rgba(27,36,51,.025) 0 12px,transparent 12px 24px)}
.chip{border:0}

/* Startbild: Robo-Werkstatt */
.robo-hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,#28354A 0,#1B2433 60%);color:#fff;padding:clamp(1.4rem,4vw,2.4rem);min-height:260px;isolation:isolate}
.robo-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(135deg,#FFC94D 0 16px,#1B2433 16px 32px);opacity:.9}
.robo-hero .kicker{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--accent-2);margin:0;letter-spacing:.04em}
.robo-hero h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,8.5vw,4.6rem);line-height:.92;margin:.3rem 0 .7rem;max-width:11ch}
.robo-hero p{margin:0 0 .6rem;max-width:34ch;color:#D5DDE8;font-size:1.06rem}
.robo-hero .hero-art{position:absolute;right:clamp(-30px,2vw,40px);top:50%;transform:translateY(-50%);height:112%;z-index:-1;opacity:.95}
@media (max-width:640px){ .robo-hero .hero-art{opacity:.3;right:-60px} }
@media (prefers-reduced-motion: reduce){ .robo-hero .hero-art *{animation:none!important} }
.gear-spin{transform-box:fill-box;transform-origin:center;animation:gspin 9s linear infinite}
.gear-spin.rev{animation-direction:reverse;animation-duration:6s}
@keyframes gspin{to{transform:rotate(360deg)}}

/* farbige Schnittbilder (Gelenk, Knie) */
.rk .bone{fill:#F4E9D2;stroke:#C9B48A;stroke-width:1.5}
</style>
</head>

/* =========================================================
   Grafiken (selbst gezeichnet)
   ========================================================= */
/* Beschriftung als gut lesbares Schild mit Zeigelinie: tag = [Text, x, y, "start"|"end", Zielpunkt-x, Zielpunkt-y] */
const TAGFS = 21;
const tagHTML = tag => { if(!tag) return ""; const [t, x, y, a, zx, zy] = tag, w = Math.round(t.length * TAGFS * .56 + 18), h = TAGFS + 12, x0 = a === "end" ? x - w : x;
  const lx = a === "end" ? x0 : x0 + w, ly = y - TAGFS * .35;
  return (zx != null ? `<g class="tagl"><path d="M${lx} ${ly.toFixed(0)} L${zx} ${zy}"/><circle cx="${zx}" cy="${zy}" r="4.5"/></g>` : "") +
    `<g class="tag"><rect x="${x0}" y="${(y - TAGFS*.85 - 6).toFixed(0)}" width="${w}" height="${h}" rx="${h/2}"/><text x="${x0 + w/2}" y="${y}" text-anchor="middle" font-size="${TAGFS}">${t}</text></g>`; };
const grp = (hl, id, inner, tag) => `<g data-z="${id}"${hl.includes(id)?' class="z-hl"':''}>${inner}${tagHTML(tag)}</g>`;
// Kreisring-Ausschnitt (unten offen) um (cx,cy) zwischen r1 und r2, von Winkel a0 bis a1 (Grad, 0 = rechts, 90 = unten)
function arcBand(cx, cy, r1, r2, a0, a1){
  const P = (r,a) => [(cx + r*Math.cos(a*Math.PI/180)).toFixed(1), (cy + r*Math.sin(a*Math.PI/180)).toFixed(1)];
  const [x1,y1] = P(r2,a0), [x2,y2] = P(r2,a1), [x3,y3] = P(r1,a1), [x4,y4] = P(r1,a0), big = (a1-a0) > 180 ? 1 : 0;
  return `M${x1} ${y1} A${r2} ${r2} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 ${big} 0 ${x4} ${y4} Z`;
}
const arcLine = (cx, cy, r, a0, a1) => { const P = a => [(cx + r*Math.cos(a*Math.PI/180)).toFixed(1), (cy + r*Math.sin(a*Math.PI/180)).toFixed(1)]; const [x1,y1]=P(a0),[x2,y2]=P(a1); return `M${x1} ${y1} A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x2} ${y2}`; };

/* Aufbau eines Gelenks (Schema): Knochen oben mit Gelenkkopf, unten mit Gelenkpfanne, Knorpelüberzug, Gelenkspalt mit Gelenkschmiere,
   Gelenkkapsel mit Innenhaut, Band seitlich, Muskel mit Sehne rechts – helle, anschauliche Darstellung */
function gelenk(hl){
  hl = hl || [];
  const HEAD = "M126 0 L194 0 L194 118 C194 140 214 156 214 192 C214 226 190 248 160 248 C130 248 106 226 106 192 C106 156 126 140 126 118 Z";
  const KN_O = "M106 194 C106 230 130 256 160 256 C190 256 214 230 214 194 C214 226 190 248 160 248 C130 248 106 226 106 194 Z";
  const PF = "M108 268 C108 258 114 254 124 254 C140 256 148 266 160 266 C172 266 180 256 196 254 C206 254 212 258 212 268 L212 300 C212 328 194 342 194 364 L194 470 L126 470 L126 364 C126 342 108 328 108 300 Z";
  const KN_U = "M108 268 C108 258 114 254 124 254 C140 256 148 266 160 266 C172 266 180 256 196 254 C206 254 212 258 212 268 L212 276 C212 266 206 262 196 262 C180 264 172 274 160 274 C148 274 140 264 124 262 C114 262 108 266 108 276 Z";
  const KAP_L = "M126 136 C96 156 82 196 82 236 C82 280 98 318 126 340 L126 322 C108 304 98 274 98 236 C98 204 108 176 126 156 Z";
  const KAP_R = "M194 136 C224 156 238 196 238 236 C238 280 222 318 194 340 L194 322 C212 304 222 274 222 236 C222 204 212 176 194 156 Z";
  return `<svg class="rk hell" viewBox="-70 0 520 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aufbau eines Gelenks">
    <defs>
      <linearGradient id="gBone" x1="0" x2="1"><stop offset="0" stop-color="#E9D6B6"/><stop offset=".45" stop-color="#FBEBD3"/><stop offset=".8" stop-color="#E3CCA6"/><stop offset="1" stop-color="#B49E7C"/></linearGradient>
      <linearGradient id="gSpalt" x1="0" x2="1"><stop offset="0" stop-color="#9EB4CC"/><stop offset=".5" stop-color="#B3C6DA"/><stop offset="1" stop-color="#6F86A0"/></linearGradient>
      <linearGradient id="gKap" x1="0" x2="1"><stop offset="0" stop-color="#F59A9A"/><stop offset="1" stop-color="#EDB9AE"/></linearGradient>
      <linearGradient id="gMus" x1="0" x2="1"><stop offset="0" stop-color="#A9262A"/><stop offset=".6" stop-color="#C9484A"/><stop offset="1" stop-color="#A42528"/></linearGradient>
      <linearGradient id="gSeh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C46A66"/><stop offset=".35" stop-color="#DDB3A8"/><stop offset="1" stop-color="#E8CBC2"/></linearGradient>
    </defs>
    <rect x="-70" width="520" height="470" rx="18" fill="#FBF8F2"/>
    ${grp(hl,"spalt", `<rect x="98" y="168" width="124" height="148" rx="34" fill="url(#gSpalt)"/><path class="h" d="M104 262 C130 262 190 262 216 262" stroke-width="14"/><path class="h" d="M104 200 L104 300 M216 200 L216 300" stroke-width="12"/>`, ["Gelenkschmiere",-62,392,"start",104,256])}
    ${grp(hl,"kapsel", `<path d="${KAP_L}" fill="url(#gKap)"/><path d="${KAP_R}" fill="url(#gKap)"/><path d="M126 156 C108 176 98 204 98 236 C98 274 108 304 126 322 M194 156 C212 176 222 204 222 236 C222 274 212 304 194 322" fill="none" stroke="#E04B4B" stroke-width="3.5"/><path class="h" d="M120 150 C96 176 88 206 88 236 C88 278 102 310 120 330 M200 150 C224 176 232 206 232 236 C232 278 218 310 200 330" stroke-width="16"/>`, ["Gelenkkapsel",442,214,"end",231,236])}
    ${grp(hl,"pfanne", `<path d="${PF}" fill="url(#gBone)"/>`, ["Gelenkpfanne",-62,446,"start",150,330])}
    ${grp(hl,"kopf", `<path d="${HEAD}" fill="url(#gBone)"/>`, ["Gelenkkopf",-62,46,"start",150,180])}
    ${grp(hl,"knorpel", `<path d="${KN_O}" fill="#F7F4EC" stroke="#D9D2C2" stroke-width="1"/><path d="${KN_U}" fill="#F7F4EC" stroke="#D9D2C2" stroke-width="1"/><path class="h" d="M108 206 C112 236 134 252 160 252 C186 252 208 236 212 206" stroke-width="12"/><path class="h" d="M110 264 C130 258 146 270 160 270 C174 270 190 258 210 264" stroke-width="12"/>`, ["Knorpel",-62,150,"start",116,226])}
    ${grp(hl,"band", `<path d="M124 112 C66 168 62 304 124 358" fill="none" stroke="#B9B1A2" stroke-width="12" stroke-linecap="round"/><path d="M124 112 C66 168 62 304 124 358" fill="none" stroke="#EFEAE0" stroke-width="8" stroke-linecap="round"/><path class="h" d="M124 112 C66 168 62 304 124 358" stroke-width="18"/>`, ["Band",-62,290,"start",77,280])}
    ${grp(hl,"sehne", `<path d="M226 316 L246 316 C226 354 210 398 206 470 L196 470 C198 404 210 356 226 316 Z" fill="url(#gSeh)"/><path class="h" d="M234 322 C218 360 206 410 201 466" stroke-width="16"/>`, ["Sehne",442,392,"end",210,396])}
    ${grp(hl,"muskel", `<path d="M214 0 L254 0 C254 44 276 112 278 190 C280 252 264 292 246 318 L226 318 C232 292 246 252 244 200 C242 150 214 110 214 76 Z" fill="url(#gMus)"/>
      <path d="M222 0 C224 60 240 120 248 190 C252 240 244 280 232 314 M232 0 C236 60 254 120 260 190 C264 240 254 284 238 316 M242 0 C246 60 264 120 270 190 C272 240 260 286 244 316" fill="none" stroke="#8E1E22" stroke-width="1.6" opacity=".7"/>`, ["Muskel",442,60,"end",262,120])}
  </svg>`;
}

/* Kniegelenk von vorn: Kniescheibe an ihrem echten Platz vor dem Gelenk, durchsichtig gezeichnet, damit man die Kreuzbänder dahinter sieht */
function knie(hl){
  hl = hl || [];
  const kreuz = `<path d="M140 206 L166 258" stroke="#FF8A3D" stroke-width="7" stroke-linecap="round"/><path d="M162 204 L136 258" stroke="#45C4B0" stroke-width="7" stroke-linecap="round"/>`;
  return `<svg class="rk" viewBox="-80 0 470 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kniegelenk von vorn">
    <rect x="-80" width="470" height="470" rx="18" fill="#1B2433"/>
    ${grp(hl,"oberschenkel", `<path class="bone" d="M122 0 L178 0 L182 150 C200 162 216 180 214 204 C212 222 196 226 184 220 C172 214 162 208 150 208 C138 208 128 214 116 220 C104 226 88 222 86 204 C84 180 100 162 118 150 Z"/>`, ["Oberschenkel",-72,46,"start",122,70])}
    ${grp(hl,"schienbein", `<path class="bone" d="M90 256 C92 246 104 242 150 242 C196 242 206 246 208 256 L204 276 C192 286 180 292 176 304 L172 470 L128 470 L124 304 C120 292 108 286 96 276 Z"/>`, ["Schienbein",-72,410,"start",128,400])}
    ${grp(hl,"wadenbein", `<path class="bone" d="M214 276 C224 276 230 284 226 296 L218 312 L214 470 L200 470 L202 312 L198 292 C198 282 204 276 214 276 Z"/>`, ["Wadenbein",382,410,"end",214,400])}
    ${grp(hl,"meniskus", `<path d="M96 246 C100 236 118 232 140 234 L144 242 C126 242 112 244 104 250 Z" fill="#9FD8FF"/><path d="M204 246 C200 236 182 232 160 234 L156 242 C174 242 188 244 196 250 Z" fill="#9FD8FF"/><path class="h" d="M98 244 C110 236 130 236 142 238 M202 244 C190 236 170 236 158 238" stroke-width="12"/>`, ["Menisken",-72,262,"start",100,246])}
    ${grp(hl,"kreuzband", kreuz + `<path class="h" d="M140 206 L166 258 M162 204 L136 258" stroke-width="16"/>`, ["Kreuzbänder",382,250,"end",166,236])}
    ${grp(hl,"seitenband", `<path d="M88 186 C80 220 84 262 98 300" fill="none" stroke="#D8DEE9" stroke-width="8" stroke-linecap="round"/><path d="M212 186 C222 220 222 256 214 284" fill="none" stroke="#D8DEE9" stroke-width="8" stroke-linecap="round"/><path class="h" d="M88 186 C80 220 84 262 98 300 M212 186 C222 220 222 256 214 284" stroke-width="18"/>`, ["Seitenbänder",382,170,"end",218,200])}
    ${grp(hl,"kniescheibe", `<ellipse cx="150" cy="178" rx="27" ry="35" fill="rgba(255,250,238,.42)" stroke="#6E5532" stroke-width="3" stroke-dasharray="8 4"/>`, ["Kniescheibe",-72,166,"start",124,176])}
    ${grp(hl,"sehne", `<path d="M136 0 L164 0 L163 146 L137 146 Z" fill="#F2F4F7" opacity=".9"/><path d="M140 210 L144 288 L156 288 L160 210" fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-dasharray="5 4" opacity=".8" pointer-events="none"/><path class="h" d="M150 2 L150 142" stroke-width="30"/>`, ["Quadrizepssehne",382,40,"end",164,30])}
  </svg>`;
}

/* animierte Gelenkmodelle (Infokarten) */
const MODEL = {
  kugel: svgBox("0 0 200 200", `<rect width="200" height="200" rx="22" fill="#1B2433"/>
    <path d="M58 130 A44 44 0 0 0 142 130 L150 130 L150 170 L50 170 L50 130 Z" fill="#F4E9D2" stroke="#C9B48A" stroke-width="2"/>
    <g><circle cx="100" cy="112" r="30" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/><rect x="92" y="20" width="16" height="80" rx="8" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="-35 100 112; 35 100 112; 0 100 112; -35 100 112" dur="4s" repeatCount="indefinite"/></g>
    <ellipse cx="100" cy="30" rx="44" ry="12" fill="none" stroke="#7FE7FF" stroke-width="2.5" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="0;22" dur="1s" repeatCount="indefinite"/></ellipse>
    <text x="100" y="192" fill="#D5DDE8" font-size="14" text-anchor="middle" font-family="sans-serif">alle Richtungen</text>`),
  scharnier: svgBox("0 0 200 200", `<rect width="200" height="200" rx="22" fill="#1B2433"/>
    <rect x="30" y="86" width="74" height="22" rx="10" fill="#F4E9D2" stroke="#C9B48A" stroke-width="2"/>
    <g><rect x="100" y="86" width="74" height="22" rx="10" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 104 97; -100 104 97; 0 104 97" dur="3s" repeatCount="indefinite"/></g>
    <circle cx="104" cy="97" r="13" fill="#E8650F" stroke="#9E4209" stroke-width="2"/><circle cx="104" cy="97" r="4" fill="#1B2433"/>
    <text x="100" y="180" fill="#D5DDE8" font-size="14" text-anchor="middle" font-family="sans-serif">beugen &amp; strecken</text>`),
  sattel: svgBox("0 0 200 200", `<rect width="200" height="200" rx="22" fill="#1B2433"/>
    <path d="M44 150 Q100 112 156 150 L156 172 L44 172 Z" fill="#F4E9D2" stroke="#C9B48A" stroke-width="2"/>
    <g><path d="M60 120 Q100 150 140 120 L140 96 Q100 120 60 96 Z" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/><rect x="92" y="34" width="16" height="70" rx="8" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="-14 100 132; 14 100 132; -14 100 132" dur="2.6s" repeatCount="indefinite"/></g>
    <text x="100" y="192" fill="#D5DDE8" font-size="14" text-anchor="middle" font-family="sans-serif">wie ein Pferdesattel</text>`),
  dreh: svgBox("0 0 200 200", `<rect width="200" height="200" rx="22" fill="#1B2433"/>
    <!-- Kopf dreht sich auf dem Ring (Nein-Schütteln) -->
    <rect x="95" y="52" width="10" height="34" rx="4" fill="#C99A20"/>
    <circle cx="100" cy="38" r="23" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/>
    <g><circle cx="92" cy="34" r="3" fill="#1B2433"/><circle cx="108" cy="34" r="3" fill="#1B2433"/><path d="M100 37 l-3 8 h5" fill="none" stroke="#9E6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M93 50 q7 4 14 0" fill="none" stroke="#1B2433" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-11 0;0 0;11 0;0 0" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></g>
    <!-- unterer Knochen mit Zapfen (2. Halswirbel) -->
    <path d="M52 172 L52 140 Q52 128 66 128 L88 128 L88 92 Q88 78 100 78 Q112 78 112 92 L112 128 L134 128 Q148 128 148 140 L148 172 Z" fill="#F4E9D2" stroke="#C9B48A" stroke-width="2"/>
    <!-- Ring (1. Halswirbel): hintere Hälfte hinter, vordere Hälfte vor dem Zapfen -->
    <path d="M54 104 A46 15 0 0 1 146 104" fill="none" stroke="#C99A20" stroke-width="13"/>
    <path d="M54 104 A46 15 0 0 0 146 104" fill="none" stroke="#FFC94D" stroke-width="13"/>
    <circle r="6" fill="#E8650F" stroke="#1B2433" stroke-width="1.5"><animate attributeName="cx" values="100;62;100;138;100" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="119;113;119;113;119" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></circle>
    <text x="100" y="192" fill="#D5DDE8" font-size="14" text-anchor="middle" font-family="sans-serif">Ring dreht um den Zapfen</text>`),
  ei: svgBox("0 0 200 200", `<rect width="200" height="200" rx="22" fill="#1B2433"/>
    <path d="M48 128 Q100 176 152 128 L152 168 L48 168 Z" fill="#F4E9D2" stroke="#C9B48A" stroke-width="2"/>
    <g><ellipse cx="100" cy="122" rx="44" ry="24" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/><rect x="92" y="40" width="16" height="70" rx="8" fill="#FFC94D" stroke="#C99A20" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="-16 100 130; 16 100 130; -16 100 130" dur="3.2s" repeatCount="indefinite"/></g>
    <text x="100" y="192" fill="#D5DDE8" font-size="14" text-anchor="middle" font-family="sans-serif">eiförmig: 4 Richtungen</text>`),
  schwamm: svgBox("0 0 220 200", `<rect width="220" height="200" rx="22" fill="#1B2433"/>
    <rect x="40" y="20" width="140" height="40" rx="8" fill="#F4E9D2"><animate attributeName="y" values="20;40;20" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="40" y="70" width="140" height="56" rx="12" fill="#9FD8FF"><animate attributeName="height" values="56;36;56" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="70;90;70" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="40" y="132" width="140" height="30" rx="8" fill="#F4E9D2"/>
    <g fill="#FFE27A"><circle cx="30" cy="100" r="5"><animate attributeName="cx" values="56;20;56" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="190" cy="100" r="5"><animate attributeName="cx" values="164;200;164" dur="2.4s" repeatCount="indefinite"/></circle></g>
    <text x="110" y="186" fill="#D5DDE8" font-size="14" text-anchor="middle" font-family="sans-serif">drücken – loslassen – auftanken</text>`),
  muskel: armModell()
};
/* Arm mit Bizeps & Trizeps: Der Unterarm wird gebeugt, der Bizeps wird kürzer und dicker und zieht über seine Sehne am Unterarm,
   der Trizeps auf der Rückseite wird dabei lang und dünn. Alle Formen werden für mehrere Winkel vorberechnet und per SVG-Animation abgespielt. */
function armModell(){
  const E = [78, 128], LEN = 92, DUR = "3.6s";
  const WINKEL = [14, 6, -10, -30, -50, -66, -72, -66, -50, -30, -10, 6, 14];   // Grad, 0 = Unterarm waagerecht
  const f = v => v.toFixed(1), add = (p,q) => [p[0]+q[0], p[1]+q[1]], mul = (p,k) => [p[0]*k, p[1]*k], sub = (p,q) => [p[0]-q[0], p[1]-q[1]];
  const len = v => Math.hypot(v[0], v[1]), nrm = v => mul(v, 1/len(v)), perp = v => [-v[1], v[0]];
  const dir = w => [Math.cos(w*Math.PI/180), Math.sin(w*Math.PI/180)];
  function bauch(T, I, sehnenL, dicke, seite){   // Muskelbauch von T bis kurz vor I, Sehne von dort bis I
    const u = nrm(sub(I, T)), B = sub(I, mul(u, sehnenL)), M = mul(add(T, B), .5), n = mul(perp(u), seite);
    const L = len(sub(B, T)), w = dicke / Math.max(L, 30) * 60;
    const c1 = add(M, mul(n, w)), c2 = add(M, mul(n, -w*.55));
    return { m:`M${f(T[0])} ${f(T[1])} Q${f(c1[0])} ${f(c1[1])} ${f(B[0])} ${f(B[1])} Q${f(c2[0])} ${f(c2[1])} ${f(T[0])} ${f(T[1])} Z`,
             s:`M${f(B[0])} ${f(B[1])} L${f(I[0])} ${f(I[1])}`, w };
  }
  const bi = [], biS = [], tr = [], trS = [];
