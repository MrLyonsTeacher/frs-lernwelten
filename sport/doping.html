<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16112A">
<title>Doping-Lernwelt</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../lernwelt/lernwelt.css">
<link rel="stylesheet" href="sport-kit.css">
<style>
:root{
  color-scheme:light;
  --bg:#EFEEF4; --surface:#FFFFFF; --surface-2:#F4F3F8; --ink:#1C1730; --muted:#5E5A72; --line:#D3D0DE;
  --accent:#6B3FD1; --accent-ink:#FFFFFF; --accent-2:#8CFF4A; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --xray:#101A33; --glow:#8CFF4A;
  --radius:16px; --radius-btn:12px; --radius-ic:12px;
  --border:1px solid #D8D5E3; --shadow:0 3px 0 #C9C5D8; --border-opt:2px solid #D8D5E3;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:#E8E0FF; --card-back:#16112A; --tile-bg:#E4FFD2; --tile-ink:#1C1730;
  --chip-bg:#16112A; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #D8D5E3;
  --track:#E1DFEA; --star:#6B3FD1; --star-off:#D8D5E3;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(107,63,209,.13),transparent 42%)}
.chip{border:0}
.labor-hero{background:linear-gradient(160deg,#16112A 0,#2A1B4F 60%,#3B7A1E 160%)}
.labor-hero .kicker{color:#8CFF4A}
@media (prefers-reduced-motion: no-preference){ .labor-hero .blase{animation:blase 3s ease-in infinite} @keyframes blase{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
  .labor-hero .lupe{transform-box:fill-box;transform-origin:50% 50%;animation:lupe 5s ease-in-out infinite} @keyframes lupe{50%{transform:translate(-16px,8px) rotate(-8deg)}} }
</style>
</head>
<body>
<main class="lw" id="app"></main>

<script src="../qrcode.js"></script>
<script src="../ergebnis.js"></script>
<script src="../lernwelt/lernwelt.js"></script>
<script src="sport-kit.js"></script>
<script>
/* Bilder: ChatGPT-Illustrationen (sport/doping-bilder/NAME.webp), sobald vorhanden in BILDER eintragen. */
const BILDER = new Set([]);
const FOTO = (n, alt, ersatz) => BILDER.has(n) ? `<img class="lnbild" src="doping-bilder/${n}.webp" alt="${alt||""}">` : ersatz;

/* =========================================================
   Selbst gezeichnete Schaubilder
   ========================================================= */
const GE = "#FFD34D", OR = "#FF9A3D", GR = "#5BE38C", RO = "#FF6B6B", BL = "#5FE9FF", HG = "#9FB0CF", LI = "#C99BFF", NE = "#8CFF4A";
const zeile = (x, y, w, h, farbe, a, b, sa=13.5) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="8" height="${h}" rx="3" fill="${farbe}"/>` +
  TX(x + 18, y + (b ? h/2 - 3 : h/2 + 5), a, {s:sa, a:"start", c:"#FFFFFF"}) + (b ? TX(x + 18, y + h/2 + 14, b, {s:11, a:"start", c:HG, w:600}) : "");

// Mittel-Steckbrief: Wirkung (grün) und Gefahren (rot)
const MITTEL = (name, c, wirk, gef) => KARTE(380, 236, TX(190, 32, name, {s:20, c}) +
  `<rect x="14" y="48" width="170" height="172" rx="12" fill="#14301F"/><rect x="196" y="48" width="170" height="172" rx="12" fill="#3A1A22"/>` +
  TX(99, 72, "gewünschte Wirkung", {s:12.5, c:GR}) + TX(281, 72, "Gefahren", {s:13.5, c:RO}) +
  TX(99, 100, wirk, {s:12, c:"#FFFFFF", w:600, lh:1.35}) + TX(281, 100, gef, {s:12, c:"#FFFFFF", w:600, lh:1.35}));

// Ampel: erlaubt – Grauzone – verboten (als Infokarte oder Antipp-Schaubild)
function ampel(fig){
  const L = [["verboten","verboten",RO,"Regelverstoß = Doping"],["grauzone","Grauzone",GE,"erlaubt, aber umstritten|oder riskant"],["erlaubt","erlaubt",GR,"nach den Regeln in Ordnung"]];
  let s = `<rect x="40" y="26" width="120" height="330" rx="26" fill="#22273A" stroke="#4A5170" stroke-width="4"/><rect x="92" y="356" width="16" height="40" fill="#4A5170"/>`;
  L.forEach(([id,t,c,b],k) => { const y = 82 + k*108;
    const g = `<circle cx="100" cy="${y}" r="40" fill="${c}"/><circle cx="88" cy="${y - 12}" r="10" fill="#FFFFFF" opacity=".35"/>` + TX(186, y - 6, t, {s:22, a:"start", c}) + TX(186, y + 18, b, {s:12.5, a:"start", c:HG, w:600});
    s += fig ? `<g data-z="${id}"><rect class="zr" x="50" y="${y - 50}" width="320" height="100" rx="16"/>${g}</g>` : g; });
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 380 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ampel: erlaubt, Grauzone, verboten"><rect width="380" height="410" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.ampel = () => ampel(true);

// Körper mit Organen: Wo schaden Dopingmittel? (als Infokarte oder Antipp-Schaubild)
function koerper(fig){
  const HAUT = "#E9C3A0", HAUTD = "#C99A74";
  let s = `<g opacity=".95">
    <circle cx="210" cy="70" r="40" fill="${HAUT}"/><rect x="196" y="104" width="28" height="22" fill="${HAUT}"/>
    <path d="M150 128 Q210 112 270 128 L282 250 Q276 300 268 316 L152 316 Q144 300 138 250 Z" fill="${HAUT}"/>
    <path d="M150 132 Q126 140 120 170 L104 268 Q100 290 112 292 Q122 292 124 270 L144 182 Z" fill="${HAUT}"/>
    <path d="M270 132 Q294 140 300 170 L316 268 Q320 290 308 292 Q298 292 296 270 L276 182 Z" fill="${HAUT}"/>
    <path d="M152 312 L268 312 L262 360 L240 484 Q236 500 222 498 L214 372 L206 372 L198 498 Q184 500 180 484 L158 360 Z" fill="${HAUT}"/>
    <path d="M210 330 L210 372" stroke="${HAUTD}" stroke-width="3"/></g>`;
  // Organe
  const O = {
    gehirn: `<path d="M182 62 Q182 36 210 34 Q238 36 238 62 Q238 76 224 78 L196 78 Q182 76 182 62 Z" fill="#F4A6C0" stroke="#B5577A" stroke-width="2"/><path d="M196 46 q6 6 0 12 M210 40 q-6 8 0 16 M224 46 q-6 6 0 12" stroke="#B5577A" stroke-width="2" fill="none"/>`,
    herz: `<path d="M226 166 C226 152 210 150 206 162 C202 150 186 152 186 166 C186 180 206 192 206 198 C206 192 226 180 226 166 Z" fill="#E5484D" stroke="#9E1F28" stroke-width="2"/>`,
    leber: `<path d="M160 214 Q168 196 206 198 Q232 200 236 214 Q216 222 196 236 Q170 240 160 214 Z" fill="#9E4B3A" stroke="#5E2A1F" stroke-width="2"/>`,
    niere: `<path d="M178 248 q-12 0 -12 16 q0 16 12 16 q8 0 6 -8 q-4 -8 0 -16 q2 -8 -6 -8z" fill="#C2574A" stroke="#7A2E26" stroke-width="2"/><path d="M242 248 q12 0 12 16 q0 16 -12 16 q-8 0 -6 -8 q4 -8 0 -16 q-2 -8 6 -8z" fill="#C2574A" stroke="#7A2E26" stroke-width="2"/>`,
    blut: `<path d="M138 160 Q126 220 114 284" stroke="#C81E2C" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M178 330 Q176 410 188 488" stroke="#C81E2C" stroke-width="5" fill="none" stroke-linecap="round"/>${[[124,232],[118,262],[180,388],[184,430]].map(([x,y]) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4.5" fill="#FF8A8A" stroke="#C81E2C" stroke-width="1.5"/>`).join("")}`,
    haut: `${[[194,84],[226,86],[220,96],[200,98]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="3.6" fill="#D0505A"/>`).join("")}`,
    wachstum: `<rect x="226" y="390" width="12" height="70" rx="5" fill="#F4E9D2" stroke="#8B7B5A" stroke-width="1.5"/><rect x="224" y="404" width="16" height="4" fill="${LI}"/><rect x="224" y="444" width="16" height="4" fill="${LI}"/>`
  };
  const LAB = [["gehirn","Gehirn & Psyche",60,48,182,58,"start"],["haut","Haut",360,90,232,92,"end"],["herz","Herz & Kreislauf",360,168,228,170,"end"],["leber","Leber",40,206,162,214,"start"],
    ["niere","Nieren",40,262,166,264,"start"],["blut","Blut & Gefäße",40,330,118,262,"start"],["wachstum","Knochen & Wachstum",360,438,240,424,"end"]];
  const ZR = {gehirn:[176,28,68,54], haut:[184,78,52,26], herz:[180,146,52,58], leber:[154,192,88,50], niere:[158,242,104,44], blut:[100,150,96,350], wachstum:[218,380,30,90]};
  s += Object.keys(O).map(id => { const [lid, t, lx, ly, px, py, an] = LAB.find(l => l[0] === id), [rx, ry, rw, rh] = ZR[id];
    const tw = t.length * 7.6, bx = an === "start" ? 10 : 410 - tw - 18;
    const lab = `<line x1="${an === "start" ? bx + tw + 14 : bx + 4}" y1="${ly}" x2="${px}" y2="${py}" stroke="#FFFFFF" stroke-width="1.6" opacity=".8"/><rect x="${bx}" y="${ly - 15}" width="${tw + 18}" height="28" rx="8" fill="#1E2C4D" stroke="#4A5A85"/>` + TX(bx + 9 + tw/2, ly + 4, t, {s:13});
    const inner = O[id] + lab;
    return fig ? `<g data-z="${id}"><rect class="zr" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="10"/><rect class="zr" x="${bx - 3}" y="${ly - 18}" width="${tw + 24}" height="34" rx="10"/>${inner}</g>` : inner; }).join("");
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Körper mit Organen"><rect width="420" height="520" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.koerper = () => koerper(true);

const ICON = {
  definition: KARTE(380, 236, TX(190, 32, "Was ist Doping?", {s:19, c:NE}) +
    SCHILD(20, 50, 340, 44, "Ein Verstoß gegen die Anti-Doping-Regeln", {s:15, c:"#FFFFFF"}) +
    `<circle cx="100" cy="150" r="34" fill="#1E3A7A"/><path d="M66 150 h68 M100 116 v68 M76 128 q24 22 48 0 M76 172 q24 -22 48 0" stroke="${BL}" stroke-width="2.4" fill="none"/><ellipse cx="100" cy="150" rx="16" ry="34" fill="none" stroke="${BL}" stroke-width="2.4"/>` +
    TX(100, 206, "WADA", {s:17, c:BL}) + TX(100, 224, "weltweit: Verbotsliste", {s:11.5, c:HG, w:600}) +
    `<rect x="250" y="120" width="60" height="20" fill="#1A1A1A"/><rect x="250" y="140" width="60" height="20" fill="#D9262C"/><rect x="250" y="160" width="60" height="20" fill="#F2C230"/>` +
    TX(280, 206, "NADA", {s:17, c:GE}) + TX(280, 224, "Deutschland: Kontrollen", {s:11.5, c:HG, w:600})),
  verstoesse: KARTE(380, 236, TX(190, 28, "Das alles ist ein Doping-Verstoß", {s:16.5, c:NE}) +
    [["verbotene Substanzen","nehmen oder besitzen",RO],["verbotene Methoden","anwenden, z. B. Blutdoping",OR],["Kontrolle","verweigern",GE],["beim Dopen helfen","auch Trainer und Ärzte",LI]].map(([a,b,c],k) =>
      zeile(k % 2 ? 196 : 16, 48 + Math.floor(k/2)*90, 168, 78, c, a, b, 13)).join("")),
  erlaubt: KARTE(380, 236, TX(190, 28, "Erlaubt – kein Doping", {s:17, c:GR}) +
    [["Kaffee","Koffein steht nicht auf der Verbotsliste"],["Höhentraining","erlaubte Methode: mehr rote Blutkörperchen"],["Asthmaspray mit","ärztlicher Ausnahmegenehmigung"],["Training & Ernährung","der faire Weg zur Leistung"]].map(([a,b],k) =>
      `<rect x="16" y="${44 + k*46}" width="348" height="40" rx="10" fill="#14301F"/>` + `<circle cx="38" cy="${64 + k*46}" r="11" fill="${GR}"/><path d="M32 ${64 + k*46} l4 5 l8 -10" stroke="#101A33" stroke-width="3.5" fill="none" stroke-linecap="round"/>` +
      TX(58, 60 + k*46, a, {s:13.5, a:"start", c:"#FFFFFF"}) + TX(58, 76 + k*46, b, {s:11, a:"start", c:HG, w:600})).join("")),
  motive: KARTE(400, 260, TX(200, 26, "Warum dopen Menschen?", {s:17, c:NE}) +
    [["Geld","Prämien, Sponsoren",GE],["Ruhm","Rekorde, Medaillen",OR],["Druck","Trainer, Familie, Fans",RO],["„Alle tun es“","Angst, sonst chancenlos",LI],["Comeback","nach Verletzung schnell zurück",BL],["Selbstzweifel","„Ohne Hilfe schaffe ich es nicht“",GR],["Aussehen","mehr Muskeln, weniger Gewicht","#FFB3D1"],["Unwissen","Risiken werden unterschätzt",HG]].map(([a,b,c],k) =>
      zeile(k % 2 ? 204 : 12, 40 + Math.floor(k/2)*54, 184, 48, c, a, b, 13)).join("")),
  epo: KARTE(400, 270, TX(200, 26, "Die Wirkungskette von EPO", {s:17, c:NE}) +
    [["EPO","Hormon",LI],["mehr rote|Blut-|körperchen","",RO],["mehr|Sauerstoff|zu Muskeln","",BL],["mehr|Ausdauer","",GR]].map(([a,b,c],k) => { const x = 12 + k*97;
      return `<rect x="${x}" y="44" width="86" height="70" rx="12" fill="#1E2C4D" stroke="${c}" stroke-width="2.5"/>` + TX(x + 43, 84 - (a.split("|").length - 1) * 7.5, a, {s:12, c}) + (k < 3 ? PFEIL(x + 88, 79, x + 96, 79, "#FFFFFF", 3) : ""); }).join("") +
    `<rect x="12" y="132" width="376" height="124" rx="12" fill="#3A1A22"/>` + TX(200, 154, "Aber: Das Blut wird dicker!", {s:15, c:RO}) +
    `<path d="M40 200 h130" stroke="#C81E2C" stroke-width="34" stroke-linecap="round" opacity=".55"/>${[50,66,82,98,114,130,146,160,58,74,90,106,122,138,154].map((x,k) => `<ellipse cx="${x}" cy="${k < 8 ? 192 : 208}" rx="7" ry="5" fill="#FF6B6B" stroke="#8E1520" stroke-width="1.2"/>`).join("")}` +
    TX(290, 186, "Herz muss stärker pumpen", {s:12, c:"#FFFFFF", w:600}) + TX(290, 206, "Blutgerinnsel möglich", {s:12, c:"#FFFFFF", w:600}) + TX(290, 230, "→ Herzinfarkt, Schlaganfall", {s:12.5, c:RO})),
  nem: KARTE(380, 236, `<rect x="40" y="56" width="104" height="140" rx="16" fill="#2A2040"/><rect x="50" y="36" width="84" height="26" rx="8" fill="${LI}"/>` + TX(92, 112, "?", {s:58, c:NE}) + TX(92, 172, "„Booster“", {s:14, c:"#FFFFFF"}) +
    TX(264, 64, "Nahrungsergänzung", {s:14.5, c:NE}) + TX(264, 92, "kann verunreinigt sein:", {s:12.5, c:"#FFFFFF", w:600}) + TX(264, 110, "verbotene Stoffe, die", {s:12.5, c:"#FFFFFF", w:600}) + TX(264, 128, "nicht draufstehen", {s:12.5, c:"#FFFFFF", w:600}) +
    TX(264, 160, "Profis prüfen mit der", {s:12, c:HG, w:600}) + TX(264, 178, "„Kölner Liste“", {s:14, c:GE}) + TX(264, 208, "Jugendliche: Essen reicht!", {s:13, c:GR})),
  ablauf: KARTE(400, 300, TX(200, 26, "Ablauf einer Dopingkontrolle", {s:17, c:NE}) +
    ["Kontrollperson (Chaperon)|benachrichtigt die Athletin","Chaperon begleitet sie ohne|Unterbrechung zur Station","Urinprobe unter Sicht|einer Kontrollperson","Aufteilen in A- und B-Probe,|versiegeln","Untersuchung im|anerkannten Labor","A-Probe positiv? Athletin kann|Öffnung der B-Probe verlangen"].map((t,k) => { const x = k % 2 ? 206 : 12, y = 42 + Math.floor(k/2)*84;
      return `<rect x="${x}" y="${y}" width="182" height="74" rx="12" fill="#1E2C4D"/><circle cx="${x + 22}" cy="${y + 37}" r="14" fill="${NE}"/>` + TX(x + 22, y + 42, k + 1, {s:15, c:"#101A33"}) + TX(x + 112, y + 32, t, {s:11.2, c:"#FFFFFF", w:600}); }).join("")),
  kontrolle: KARTE(380, 236, TX(190, 28, "Wer kontrolliert – wann – wie?", {s:16.5, c:NE}) +
    [["WADA","macht die Regeln & die weltweite Verbotsliste",BL],["NADA","plant und organisiert die Kontrollen in Deutschland",GE],["wann?","im Wettkampf und im Training – auch unangemeldet",GR],["wie?","mit Urin- und Blutproben",OR]].map(([a,b,c],k) => { const y = 44 + k*46;
      return `<rect x="16" y="${y}" width="348" height="40" rx="10" fill="#1E2C4D"/>` + TX(28, y + 25, a, {s:14.5, a:"start", c}) + TX(96, y + 25, b, {s:11.2, a:"start", c:"#FFFFFF", w:600}); }).join("")),
  meldepflicht: KARTE(380, 236, `<rect x="30" y="40" width="130" height="160" rx="16" fill="#1E2C4D"/><rect x="42" y="56" width="106" height="110" rx="6" fill="#2A3E69"/>` +
    `<path d="M95 80 c-18 0 -26 14 -26 24 c0 20 26 44 26 44 c0 0 26 -24 26 -44 c0 -10 -8 -24 -26 -24z" fill="${RO}"/><circle cx="95" cy="104" r="9" fill="#FFFFFF"/>` + TX(95, 188, "Wo bin ich?", {s:13, c:"#FFFFFF"}) +
    TX(270, 80, "Meldepflicht", {s:17, c:NE}) + TX(270, 108, "Spitzensportler im", {s:12.5, c:"#FFFFFF", w:600}) + TX(270, 126, "Testpool geben an,", {s:12.5, c:"#FFFFFF", w:600}) + TX(270, 144, "wo sie sich aufhalten –", {s:12.5, c:"#FFFFFF", w:600}) +
    TX(270, 174, "für unangemeldete", {s:12.5, c:GE}) + TX(270, 192, "Kontrollen", {s:12.5, c:GE})),
  abprobe: KARTE(340, 220, [["A",70],["B",190]].map(([b,x]) => `<rect x="${x}" y="70" width="70" height="110" rx="14" fill="#F2E7A8" stroke="#D9C66A" stroke-width="3"/><rect x="${x + 10}" y="50" width="50" height="26" rx="6" fill="${b === "A" ? BL : LI}"/>` +
      `<rect x="${x + 6}" y="108" width="58" height="34" rx="6" fill="#FFFFFF"/>` + TX(x + 35, 133, b + "-Probe", {s:13, c:"#101A33"})).join("") +
    TX(170, 30, "eine Probe – zwei Flaschen", {s:15, c:NE}) + TX(170, 206, "versiegelt · B nur bei positivem A-Befund", {s:12, c:HG, w:600})),
  fishbowl: KARTE(380, 290, TX(190, 26, "Fishbowl-Debatte", {s:17, c:NE}) +
    `<circle cx="190" cy="142" r="104" fill="none" stroke="#3A4A75" stroke-width="22"/>` + [...Array(14)].map((_,k) => { const a = k/14*2*Math.PI; return `<circle cx="${(190 + Math.cos(a)*104).toFixed(1)}" cy="${(142 + Math.sin(a)*104).toFixed(1)}" r="8" fill="${HG}"/>`; }).join("") +
    [[0,"Pro",GR],[1,"Pro",GR],[2,"Contra",RO],[3,"Contra",RO],[4,"Moderation",GE],[5,"frei",BL]].map(([k,t,c]) => { const a = k/6*2*Math.PI - Math.PI/2, x = 190 + Math.cos(a)*50, y = 142 + Math.sin(a)*50;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="${t === "frei" ? "none" : c}" stroke="${c}" stroke-width="3" ${t === "frei" ? 'stroke-dasharray="4 3"' : ""}/>` + TX(+x.toFixed(1), +(y + (y < 142 ? -18 : 28)).toFixed(1), t, {s:11, c}); }).join("") +
    TX(190, 280, "innen diskutieren · außen beobachten · freier Stuhl", {s:11.5, c:HG, w:600})),
  treppe: KARTE(400, 260, TX(200, 26, "Die Argumenten-Treppe", {s:17, c:NE}) +
    [["Behauptung","Was ist meine Meinung?",LI],["Begründung","Warum ist das so?",BL],["Beleg","Fakt oder Quelle",GR],["Beispiel","ein konkreter Fall",GE],["Schluss","Was folgt daraus?",OR]].map(([a,b,c],k) => { const x = 14 + k*76, y = 196 - k*36;
      return `<rect x="${x}" y="${y}" width="${400 - 28 - k*76}" height="34" rx="6" fill="${c}" opacity=".92"/>` + TX(x + 8, y + 15, a, {s:12.5, a:"start", c:"#101A33"}) + TX(x + 8, y + 29, b, {s:10, a:"start", c:"#101A33", w:600}); }).join("")),
  regeln: KARTE(380, 220, TX(190, 30, "Gesprächsregeln", {s:17, c:NE}) +
    ["ausreden lassen","sachlich bleiben","auf Vorredner eingehen","keine persönlichen Angriffe"].map((t,k) =>
      `<rect x="30" y="${48 + k*40}" width="320" height="32" rx="9" fill="#1E2C4D"/><circle cx="50" cy="${64 + k*40}" r="9" fill="${GR}"/>` + TX(70, 69 + k*40, t, {s:14, a:"start", c:"#FFFFFF"})).join(""))
};

/* =========================================================
   Inhalte (abgestimmt auf AB 20, 21, 22 und 23)
   ========================================================= */
const LERNEN = {
  was: { titel:"Was ist Doping?", folien:[
    {bild:ICON.definition, titel:"Doping – die Definition", text:"**Doping ist ein Verstoß gegen die Anti-Doping-Regeln.** Welche Stoffe und Methoden verboten sind, steht in der weltweiten **Verbotsliste der WADA** (Welt-Anti-Doping-Agentur). In Deutschland organisiert die **NADA** (Nationale Anti Doping Agentur) die Kontrollen."},
    {bild:ICON.verstoesse, titel:"Was zählt als Verstoß?", text:"Verbotene **Substanzen nehmen oder besitzen** · verbotene **Methoden** anwenden, z. B. **Blutdoping** · eine **Kontrolle verweigern** · **anderen beim Dopen helfen** – das gilt auch für Trainer oder Ärzte."},
