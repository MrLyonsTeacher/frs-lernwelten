<style>
:root{
  color-scheme:light;

  --chip-bg:#1F3B2A; --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #DCD8C8;
  --track:#E3E0D3; --star:#2F8A4C; --star-off:#DCD8C8;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(47,138,76,.13),transparent 42%)}
.chip{border:0}
.markt-hero{background:linear-gradient(160deg,#1F3B2A 0,#2F6B3F 60%,#E8A33A 150%)}

  .markt-hero .tropfen{animation:tropf 2.4s ease-in infinite} @keyframes tropf{0%{transform:translateY(-12px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}} }
</style>

<script>
/* Bilder: ChatGPT-Illustrationen (sport/ernaehrung-bilder/NAME.webp), sobald vorhanden in BILDER eintragen. */
const BILDER = new Set(["er9-eiweissshake","er9-trinkpause","er9-bens-tag","er9-turniertag","er9-trinkflasche"]);
const FOTO = (n, alt, ersatz) => BILDER.has(n) ? `<img class="lnbild" src="ernaehrung-bilder/${n}.webp" alt="${alt||""}">` : ersatz;

/* =========================================================
   Selbst gezeichnete Schaubilder
   ========================================================= */
const GE = "#FFD34D", OR = "#FF9A3D", GR = "#5BE38C", RO = "#FF6B6B", BL = "#5FE9FF", HG = "#9FB0CF", LI = "#C99BFF";
const zeile = (x, y, w, h, farbe, a, b) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#1E2C4D"/><rect x="${x}" y="${y}" width="8" height="${h}" rx="3" fill="${farbe}"/>` +
  TX(x + 18, y + (b ? h/2 - 2 : h/2 + 5), a, {s:13.5, a:"start", c:"#FFFFFF"}) + (b ? TX(x + 18, y + h/2 + 14, b, {s:11, a:"start", c:HG, w:600}) : "");
const wuerfel = (x, y, n, gr=13) => [...Array(n)].map((_,k) => `<rect x="${x + (k % 9) * (gr + 3)}" y="${y + Math.floor(k / 9) * (gr + 3)}" width="${gr}" height="${gr}" rx="2.5" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="1.2"/>`).join("");

// Ernährungspyramide (eigene Darstellung, angelehnt an die 6 Stufen des BZfE) – als Infokarte oder Antipp-Schaubild
const STUFEN = [["getraenke","Getränke",GR,"reichlich"],["gemuese","Gemüse & Obst",GR,"reichlich"],["getreide","Brot, Getreide, Kartoffeln",GR,"reichlich"],
  ["milch","Milchprodukte, Fleisch, Fisch, Ei",GE,"mäßig"],["fette","Öle & Fette",GE,"mäßig"],["suesses","Süßes & Knabbereien",RO,"sparsam"]];
function pyramide(fig){
  const H = 54, B = [372, 320, 268, 236, 172, 156];
  let s = TX(200, 30, "Die Ernährungspyramide", {s:17, c:GE});
  STUFEN.forEach(([id,t,c,m],k) => { const w = B[k] - k*0 , y = 372 - (k+1)*H, x = 200 - w/2;
    const g = `<rect x="${x}" y="${y}" width="${w}" height="${H - 5}" rx="8" fill="${c}" opacity=".92"/>` + TX(26 + 0, y + 30, k + 1, {s:15, c:"#FFFFFF", a:"start"}) + TX(200, y + 23, t, {s:k === 3 ? 13 : 14.5, c:"#13201A"}) + TX(200, y + 40, m, {s:11.5, c:"#13201A", w:600});
    s += fig ? `<g data-z="${id}"><rect class="zr" x="${x - 4}" y="${y - 3}" width="${w + 8}" height="${H + 1}" rx="10"/>${g}</g>` : g; });
  s += TX(200, 398, "grün = reichlich · gelb = mäßig · rot = sparsam", {s:12.5, c:HG, w:600});
  return `<svg class="${fig ? "bz" : "lnsvg"}" viewBox="0 0 400 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ernährungspyramide"><rect width="400" height="412" rx="22" fill="#101A33"/>${s}</svg>`;
}
FIG.pyramide = () => pyramide(true);

const ICON = {
  umsatz: KARTE(380, 240, TX(190, 30, "Wofür braucht der Körper Energie?", {s:16.5, c:GE}) +
    `<rect x="30" y="54" width="150" height="150" rx="14" fill="#1E2C4D" stroke="${BL}" stroke-width="3"/><rect x="200" y="54" width="150" height="150" rx="14" fill="#1E2C4D" stroke="${OR}" stroke-width="3"/>` +
    TX(105, 82, "Grundumsatz", {s:16, c:BL}) + TX(105, 100, "in völliger Ruhe", {s:11.5, c:HG, w:600}) + TX(105, 128, "Herz & Atmung", {s:13, c:"#FFFFFF"}) + TX(105, 150, "Gehirn", {s:13, c:"#FFFFFF"}) + TX(105, 172, "Temperatur 37 °C", {s:13, c:"#FFFFFF"}) + TX(105, 194, "– auch im Schlaf", {s:11.5, c:HG, w:600}) +
    TX(275, 82, "Leistungsumsatz", {s:16, c:OR}) + TX(275, 100, "zusätzlich für Bewegung", {s:11.5, c:HG, w:600}) + TX(275, 128, "Rad fahren", {s:13, c:"#FFFFFF"}) + TX(275, 150, "Treppen steigen", {s:13, c:"#FFFFFF"}) + TX(275, 172, "Training & Spiel", {s:13, c:"#FFFFFF"}) +
    TX(190, 228, "Gesamt = Grundumsatz + Leistungsumsatz", {s:13, c:GE})),
  gehirn: KARTE(320, 230, `<circle cx="110" cy="118" r="70" fill="#2A3E69"/><path d="M110 118 L110 48 A70 70 0 0 1 176.6 96.4 Z" fill="${LI}"/>` +
    TX(150, 84, "ca. 20 %", {s:13, c:"#101A33"}) + TX(240, 96, "Das Gehirn", {s:16, c:LI}) + TX(240, 118, "braucht etwa", {s:13, c:"#FFFFFF", w:600}) + TX(240, 140, "ein Fünftel", {s:16, c:"#FFFFFF"}) + TX(240, 160, "der Ruhe-Energie", {s:13, c:"#FFFFFF", w:600}) +
    TX(160, 214, "Energie brauchst du sogar im Schlaf.", {s:13.5, c:HG, w:600})),
  etikett: KARTE(380, 250, `<rect x="24" y="22" width="200" height="206" rx="8" fill="#FFFFFF"/>` + TX(124, 46, "Nährwerte pro 100 g", {s:13.5, c:"#13201A"}) +
    [["Energie","1 680 kJ / 400 kcal"],["Kohlenhydrate","60 g"],["– davon Zucker","28 g"],["Fett","14 g"],["Eiweiß","7 g"]].map(([a,b],k) =>
      `<line x1="32" y1="${58 + k*32}" x2="216" y2="${58 + k*32}" stroke="#13201A" stroke-width="${k ? 1 : 2.5}"/>` + TX(34, 80 + k*32, a, {s:12, a:"start", c:"#13201A", w:k === 2 ? 600 : 700}) + TX(214, 80 + k*32, b, {s:12, a:"end", c:"#13201A"})).join("") +
    TX(124, 222, "Müsliriegel · 1 Riegel = 25 g", {s:11.5, c:"#3B4A40", w:600}) +
    TX(300, 70, "1 Riegel", {s:15, c:GE}) + TX(300, 92, "= 25 g = ¼ von 100 g", {s:11.5, c:HG, w:600}) + TX(300, 124, "100 kcal", {s:17, c:"#FFFFFF"}) + TX(300, 152, "7 g Zucker", {s:17, c:"#FFFFFF"}) + TX(300, 178, "≈ 2 Zuckerwürfel", {s:13, c:HG, w:600}) +
    wuerfel(282, 192, 2, 16)),
  kj: KARTE(340, 200, TX(170, 34, "Energie wird angegeben in …", {s:16, c:GE}) + SCHILD(26, 58, 130, 56, "kJ|Kilojoule", {s:17, c:"#FFFFFF"}) + SCHILD(184, 58, 130, 56, "kcal|Kilokalorien", {s:17, c:"#FFFFFF"}) +
    TX(170, 148, "1 kcal ≈ 4,2 kJ", {s:22, c:GR}) + TX(170, 178, "1 680 kJ : 400 kcal = 4,2", {s:13, c:HG, w:600})),
  ranking: KARTE(380, 260, TX(190, 28, "Energie pro Stunde: von wenig bis viel", {s:15.5, c:GE}) +
    [["schlafen",14],["Hausaufgaben",20],["zügig spazieren",44],["Volleyball im Unterricht",58],["Fußballspiel",84],["zügig joggen",94]].map(([t,w],k) => { const y = 44 + k*34;
      return TX(18, y + 20, k + 1, {s:14, a:"start", c:HG}) + `<rect x="36" y="${y + 4}" width="${w*3.2}" height="24" rx="7" fill="${["#2E6FB0","#3E86C8","#4FA36A","#E0B03A",OR,RO][k]}"/>` + TX(44, y + 21, t, {s:12.5, a:"start", c:"#FFFFFF"}); }).join("") +
    TX(190, 252, "Fußball & Joggen: je nach Tempo austauschbar", {s:11.5, c:HG, w:600})),
  waage: KARTE(380, 240, TX(190, 30, "Die Energiebilanz", {s:17, c:GE}) +
    `<path d="M190 70 L190 196" stroke="#C9D4E6" stroke-width="6"/><path d="M160 206 h60" stroke="#C9D4E6" stroke-width="8" stroke-linecap="round"/><path d="M70 78 L310 78" stroke="#C9D4E6" stroke-width="6" stroke-linecap="round"/><circle cx="190" cy="74" r="8" fill="${GE}"/>` +
    `<path d="M70 78 L40 132 M70 78 L100 132 M310 78 L280 132 M310 78 L340 132" stroke="#9FB0CF" stroke-width="2"/><path d="M34 132 h72 a36 18 0 0 1 -72 0z" fill="${GR}"/><path d="M274 132 h72 a36 18 0 0 1 -72 0z" fill="${OR}"/>` +
    TX(70, 172, "Zufuhr", {s:15, c:GR}) + TX(70, 190, "Essen & Trinken", {s:11.5, c:HG, w:600}) + TX(310, 172, "Verbrauch", {s:15, c:OR}) + TX(310, 190, "Grund- + Leistungsumsatz", {s:11, c:HG, w:600}) +
    TX(190, 230, "Hunger und Sättigung zeigen, was du brauchst.", {s:12.5, c:"#FFFFFF", w:600})),
  zuwenig: KARTE(380, 236, TX(190, 28, "Wer zu wenig isst …", {s:16.5, c:GE}) +
    [["ist ständig müde",RO],["Leistung sinkt",OR],["Konzentration schlechter",GE],["öfter krank",LI],["mehr Verletzungen",BL],["Wachstum gestört",GR]].map(([t,c],k) =>
      zeile(k % 2 ? 196 : 16, 44 + Math.floor(k/2)*62, 168, 52, c, t)).join("")),
  naehrstoffe: KARTE(380, 250, TX(190, 28, "Die Nährstoffe und ihre Aufgabe", {s:16, c:GE}) +
    [["Kohlenhydrate","schnelle Energie",OR],["Eiweiß","Baustoff: Muskeln, Zellen",RO],["Fett","Energiespeicher",GE],["Vitamine","Abwehr, Stoffwechsel",GR],["Mineralstoffe","Knochen, Muskeln, Nerven",LI],["Wasser","Transport, Kühlung",BL]].map(([a,b,c],k) =>
      zeile(k % 2 ? 196 : 16, 42 + Math.floor(k/2)*68, 168, 58, c, a, b)).join("")),
  teller: KARTE(340, 230, `<circle cx="120" cy="118" r="84" fill="#F4F1E8"/><circle cx="120" cy="118" r="68" fill="#FFFFFF" stroke="#E1DCCB" stroke-width="2"/>` +
    `<path d="M120 118 L120 50 A68 68 0 0 1 186 136 Z" fill="#E9C46A"/><path d="M120 118 L186 136 A68 68 0 0 1 70 164 Z" fill="#F4A3A3"/><path d="M120 118 L70 164 A68 68 0 0 1 120 50 Z" fill="#8FD18F"/>` +
    TX(150, 98, "KH", {s:14, c:"#13201A"}) + TX(128, 158, "Eiweiß", {s:13, c:"#13201A"}) + TX(84, 112, "Obst", {s:13, c:"#13201A"}) +
    TX(262, 90, "Nach dem", {s:14, c:"#FFFFFF"}) + TX(262, 110, "Training:", {s:14, c:"#FFFFFF"}) + TX(262, 142, "Kohlenhydrate", {s:14, c:GE}) + TX(262, 160, "+ Eiweiß", {s:14, c:RO}) + TX(262, 190, "Speicher füllen,", {s:11.5, c:HG, w:600}) + TX(262, 206, "Muskeln reparieren", {s:11.5, c:HG, w:600})),
  wasser: KARTE(320, 240, `<defs><clipPath id="kp"><circle cx="90" cy="52" r="22"/><rect x="58" y="78" width="64" height="86" rx="20"/><rect x="62" y="150" width="24" height="76" rx="10"/><rect x="94" y="150" width="24" height="76" rx="10"/><rect x="36" y="84" width="18" height="70" rx="9"/><rect x="126" y="84" width="18" height="70" rx="9"/></clipPath></defs>` +
    `<g clip-path="url(#kp)"><rect x="20" y="20" width="140" height="220" fill="#2A3E69"/><rect x="20" y="108" width="140" height="130" fill="${BL}"/></g>` +
    `<path d="M20 108 h140" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>` + TX(234, 104, "mehr als", {s:14, c:"#FFFFFF"}) + TX(234, 132, "die Hälfte", {s:20, c:BL}) + TX(234, 156, "des Körpers", {s:14, c:"#FFFFFF"}) + TX(234, 176, "ist Wasser", {s:14, c:"#FFFFFF"})),
  urin: KARTE(380, 220, TX(190, 30, "Urin-Farbe: Habe ich genug getrunken?", {s:15.5, c:GE}) +
    ["#FBF6C8","#F7EC9A","#F2DC64","#E7C23A","#D9A22A","#B9781C"].map((c,k) => `<rect x="${26 + k*56}" y="58" width="48" height="72" rx="10" fill="${c}"/>`).join("") +
    `<rect x="26" y="142" width="104" height="8" rx="4" fill="${GR}"/><rect x="138" y="142" width="104" height="8" rx="4" fill="${GE}"/><rect x="250" y="142" width="104" height="8" rx="4" fill="${RO}"/>` +
    TX(78, 172, "hell: gut so", {s:13, c:GR}) + TX(190, 172, "trinken!", {s:13, c:GE}) + TX(302, 172, "dunkel: dringend", {s:13, c:RO}) + TX(302, 188, "trinken", {s:13, c:RO}) +
    TX(190, 208, "Weitere Signale: Durst, Kopfschmerzen, Müdigkeit, Schwindel", {s:11.4, c:HG, w:600})),
  zucker: KARTE(400, 270, TX(200, 26, "Zuckerwürfel (je ca. 3 g) in 0,5 Liter", {s:15, c:GE}) +
    [["Wasser",0,GR],["Schorle 1 : 3",4,GR],["Eistee",12,GE],["Apfelsaft pur",17,RO],["Cola",18,RO],["Energydrink",18,RO]].map(([t,n,c],k) => { const y = 42 + k*37;
      return `<rect x="12" y="${y}" width="376" height="32" rx="9" fill="#1E2C4D"/>` + TX(24, y + 21, t, {s:13, a:"start", c}) +
        [...Array(n)].map((_,j) => `<rect x="${130 + j*12.2}" y="${y + 11}" width="10" height="10" rx="2" fill="#FFFFFF"/>`).join("") + TX(378, y + 21, n, {s:13.5, a:"end", c:"#FFFFFF"}); }).join("") +
    TX(200, 262, "Energydrink zusätzlich mit viel Koffein · gerundete Werte", {s:11.2, c:HG, w:600})),
  trinktipps: KARTE(380, 220, TX(190, 28, "Trinken am Trainingstag", {s:16.5, c:GE}) +
    [["vorher","1–2 h vorher ein|großes Glas",BL],["während","regelmäßig ein|paar Schlucke",GR],["nachher","Verlust ausgleichen:|Wasser oder Schorle",OR]].map(([a,b,c],k) => { const x = 16 + k*122;
      return `<rect x="${x}" y="48" width="114" height="140" rx="12" fill="#1E2C4D" stroke="${c}" stroke-width="2.5"/>` + TX(x + 57, 76, a, {s:15.5, c}) +
        `<path d="M${x+57} 92 c-9 13 -14 20 -14 27 a14 14 0 0 0 28 0 c0 -7 -5 -14 -14 -27z" fill="${c}"/>` + TX(x + 57, 158, b, {s:11.5, c:"#FFFFFF", w:600}); }).join("") +
    TX(190, 210, "Durst ist ein spätes Warnsignal – also regelmäßig trinken.", {s:11.8, c:HG, w:600})),
  timing: KARTE(400, 236, TX(200, 28, "Essen rund ums Training", {s:16.5, c:GE}) + PFEIL(20, 198, 386, 198, "#5B6C93", 3) +
    [["2–3 h vorher","leichte,|kohlenhydrat-|reiche|Mahlzeit",BL,20],["kurz vorher","nur Kleinig-|keiten, z. B.|eine Banane",GE,116],["während","Wasser;|beim Turnier|kleine Snacks",GR,212],["danach","Kohlen-|hydrate|+ Eiweiß,|trinken",OR,308]].map(([a,b,c,x]) =>
      `<rect x="${x}" y="48" width="88" height="130" rx="12" fill="#1E2C4D" stroke="${c}" stroke-width="2.5"/>` + TX(x + 44, 74, a, {s:12.8, c}) + `<circle cx="${x + 44}" cy="198" r="7" fill="${c}"/>` + TX(x + 44, 102, b, {s:11.5, c:"#FFFFFF", w:600})).join("") +
    `<rect x="203" y="186" width="10" height="24" rx="3" fill="#E5484D"/>` + TX(208, 226, "Sport", {s:12, c:"#FF8A8A"})),
  schwer: KARTE(380, 230, TX(190, 28, "Was liegt schwer im Magen?", {s:16.5, c:GE}) +
    zeile(16, 44, 348, 54, GR, "leicht verdaulich", "Banane, Reiswaffeln, Brot, Nudeln mit Tomatensoße") + zeile(16, 104, 348, 54, RO, "liegt schwer im Magen", "Pommes mit Mayo, Döner, Fettiges, riesige Portionen") +
    TX(190, 186, "Verdauen braucht Blut im Magen –", {s:13, c:"#FFFFFF", w:600}) + TX(190, 206, "beim Sport brauchen es die Muskeln.", {s:13, c:"#FFFFFF", w:600})),
  hand: KARTE(440, 270, TX(220, 26, "Das Hand-Maß: 1 Portion ist …", {s:16, c:GE}) +
    [["Getränke","1 Glas (ca. 200 ml)",BL],["Gemüse & Obst","1 Handvoll",GR],["Brot, Getreide, Kartoffeln","1 Scheibe Brot · 2 Hände Nudeln · 2 Kartoffeln",GR],["Milchprodukte","1 Glas Milch · 1 Becher Joghurt · 2 Scheiben Käse",GE],["Fleisch, Fisch, Ei","so groß wie die Handfläche · 1 Ei",GE],["Öle & Fette","1 Esslöffel",GE],["Süßes & Knabbereien","1 Handvoll · 1 kleiner Riegel · 1 Dose Limo",RO]].map(([a,b,c],k) => { const y = 38 + k*31;

/* =========================================================

   ========================================================= */
