<!doctype html>
<html lang="de">
<head>

<body>
<div id="app"></div>
<div class="ui"><div><h1>Das Wrack</h1><p>Vorschau der 3D-Welt. Ziehen zum Umsehen.</p></div><button id="cam">Kamera: Rundflug</button></div>
<div class="load" id="load"><span>Wrack wird geladen ...</span></div>
<script src="lib/three.min.js"></script>

<script>
(function(){
'use strict';
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0a4f60);
app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a4f60);scene.fog=new THREE.FogExp2(0x0a4f60,.024);
const camera=new THREE.PerspectiveCamera(62,1,.1,300);
const clock=new THREE.Clock();
const loader=new THREE.TextureLoader();
const TEX={};
function loadTex(n,rep){return new Promise(res=>{loader.load('wrack/assets/tex_'+n+'.jpg',t=>{t.wrapS=t.wrapT=THREE.MirroredRepeatWrapping;t.anisotropy=4;TEX[n]=t;res()},undefined,()=>res())})}
function mat(n,rs,rt,extra){const t=TEX[n]?TEX[n].clone():null;if(t){t.needsUpdate=true;t.repeat.set(rs||1,rt||1)}return new THREE.MeshStandardMaterial(Object.assign({map:t,roughness:.92,metalness:.05,side:THREE.DoubleSide},extra||{}))}
function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;return o}
/* Wasserlicht (Caustics), selbst gerechnet und nahtlos */
function caustics(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),im=g.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u=x/S*6.2832,v=y/S*6.2832;
    const a=Math.sin(u*2+Math.sin(v*3)*1.2)+Math.sin(v*2+Math.sin(u*3)*1.2)+Math.sin((u+v)*3+Math.sin(u-v)*1.5);
    let k=1-Math.abs(a)/1.5;k=Math.max(0,k);k=Math.pow(k,5);
    const i=(y*S+x)*4;im.data[i]=120*k;im.data[i+1]=235*k;im.data[i+2]=255*k;im.data[i+3]=255;
  }
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
function rayTex(){const c=document.createElement('canvas');c.width=16;c.height=256;const g=c.getContext('2d'),r=g.createLinearGradient(0,0,0,256);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,16,256);const h=g.createLinearGradient(0,0,16,0);h.addColorStop(0,'rgba(0,0,0,1)');h.addColorStop(.5,'rgba(0,0,0,0)');h.addColorStop(1,'rgba(0,0,0,1)');g.globalCompositeOperation='destination-out';g.fillStyle=h;g.fillRect(0,0,16,256);return new THREE.CanvasTexture(c)}
function holeTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,128,128);g.fillStyle='#000';let s=7;function r(){s=(s*16807)%2147483647;return s/2147483647}
  for(let i=0;i<14;i++){g.beginPath();g.ellipse(r()*128,r()*128,3+r()*10,3+r()*14,r()*3,0,6.28);g.fill()}
  const e=g.createLinearGradient(0,0,0,128);g.globalCompositeOperation='destination-out';return new THREE.CanvasTexture(c)}

let CAU;const flick=[];const sway=[];const tick=[];
function quad(a,b,c,d,m,su,sv){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...c,...a,...c,...d],3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,su,0,su,sv,0,0,su,sv,0,sv],2));
  g.computeVertexNormals();const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o;
}
const ship=new THREE.Group();scene.add(ship);ship.position.y=.4;ship.rotation.x=.1;
function build(){
  CAU=caustics();
  const sandM=mat('sand',24,24,{emissive:new THREE.Color(0x4fd8d0),emissiveMap:CAU,emissiveIntensity:.3,side:THREE.FrontSide});
  /* Meeresboden mit sanften Hügeln */
  const SG=new THREE.PlaneGeometry(220,220,90,90);SG.rotateX(-Math.PI/2);

    p.setY(i,(Math.sin(x*.13)*Math.cos(z*.11)*1.2+Math.sin(x*.4+z*.3)*.25)*fl-.3*(1-fl))}

  ship.add(wall(-18,14,Y0,Y1,-1,barn));
  ship.add(wall(-18,-4,Y0,Y1,1,barn));ship.add(wall(3,14,Y0,Y1,1,barn));
  ship.add(wall(-4,3,Y0,2.2,1,barn));ship.add(wall(-4,3,5.6,Y1,1,plank));
  [-1,1].forEach(s=>ship.add(quad([14,Y0,s*4],[22,2.5,0],[22,8,0],[14,Y1,s*zAt(Y1)],plank,2,1.5)));
  ship.add(quad([-18,Y0,-4],[-18,Y0,4],[-18,Y1,6.2],[-18,Y1,-6.2],plank,2,1.2));
  ship.add(quad([-18,Y0,-4],[14,Y0,-4],[14,Y0,4],[-18,Y0,4],floorM,6,2));
  /* Oberdeck mit Loch in der Mitte */
  const dk=mat('planks',1,1);
  [[-18,-3],[4,14]].forEach(r=>ship.add(quad([r[0],6,-6],[r[1],6,-6],[r[1],6,6],[r[0],6,6],dk,(r[1]-r[0])/5,2)));
  ship.add(quad([-3,6,-6],[4,6,-6],[4,6,-3.2],[-3,6,-3.2],dk,1.5,.8));ship.add(quad([-3,6,3.2],[4,6,3.2],[4,6,6],[-3,6,6],dk,1.5,.8));
  /* Rippen */

    [-1,1].forEach(s=>{if(s===1&&x>-6&&x<5)return;const r=mesh(rib,plank,x,4,s*(zAt(4)-.35));r.rotation.x=-s*phi;ship.add(r)});

  for(let i=-2;i<=2;i++){const w=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.6),winM);w.position.set(-18.05,9.1,i*2.1);w.rotation.y=-Math.PI/2;ship.add(w)}
  const lant=new THREE.PointLight(0xffb450,2.2,26,1.6);lant.position.set(-16,8,0);ship.add(lant);flick.push(lant);
  /* Masten, Rahen, Segel */

      const sail=new THREE.Mesh(new THREE.PlaneGeometry(9-i*2,y>14?6:5),new THREE.MeshStandardMaterial({map:TEX.canvas,alphaMap:holeTex(),transparent:true,alphaTest:.3,side:THREE.DoubleSide,roughness:1}));
      sail.position.set(0,y-3,0);sail.rotation.y=Math.PI/2;g.add(sail);sway.push({o:sail,a:.06,s:.8+i*.2,p:i});});

  [[-12,-3],[-11,-1.6],[-13.5,-2.2],[5,3],[7,-3.2],[9,2.6]].forEach(b=>{const o=mesh(barrelG,barrelM,b[0],Y0+.75,b[1]);o.rotation.y=b[0];ship.add(o)});
  const crateM=mat('planks',1.2,1.2);[[-9,3],[-9,1.8],[-8.6,2.4],[11,-1]].forEach((b,i)=>{const o=mesh(new THREE.BoxGeometry(1.4,1.2+i%2*.4,1.4),crateM,b[0],Y0+.7,b[1]);o.rotation.y=i;ship.add(o)});
  const chest=new THREE.Group();chest.add(mesh(new THREE.BoxGeometry(2.2,1.1,1.3),mat('copper',1,.6),0,.55,0));
  const lid=mesh(new THREE.BoxGeometry(2.2,.2,1.3),mat('copper',1,.5),0,1.6,-.9);lid.rotation.x=-1.3;chest.add(lid);
  const gold=new THREE.MeshStandardMaterial({color:0xffc93a,emissive:0xff9a10,emissiveIntensity:.9,metalness:.8,roughness:.3});
  for(let i=0;i<46;i++){const c=mesh(new THREE.CylinderGeometry(.14,.14,.04,10),gold,(Math.random()-.5)*1.9,1.1+Math.random()*.35,(Math.random()-.5)*1);c.rotation.set(Math.random(),Math.random(),Math.random());chest.add(c)}
  chest.position.set(-8,Y0,-2.2);chest.rotation.y=.4;ship.add(chest);
  const gl=new THREE.PointLight(0xffb030,2.4,12,1.5);gl.position.set(-8,Y0+1.6,-2);ship.add(gl);flick.push(gl);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0xffc040,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.8,fog:false}));sp.scale.set(5,5,1);sp.position.set(-8,Y0+1.5,-2.2);ship.add(sp);
  const cannon=mesh(new THREE.CylinderGeometry(.35,.5,3,12),mat('rust',1,1),2,Y0+1,-3.2);cannon.rotation.z=Math.PI/2;cannon.rotation.y=.3;ship.add(cannon);
  [0,1,2].forEach(i=>{const t=mesh(new THREE.TorusGeometry(.7,.28,8,18),mat('rope',2,1),11+i*.2,Y0+.3+i*.5,2.5);t.rotation.x=Math.PI/2;ship.add(t)});
  /* Innenlicht, kühl von oben durch das Deckloch */
  const hole=new THREE.SpotLight(0x9fefff,1.8,40,.5,.6,1);hole.position.set(.5,22,0);hole.target.position.set(.5,0,0);hole.castShadow=true;hole.shadow.mapSize.set(1024,1024);ship.add(hole,hole.target);
  /* Felsen, Korallen, Tang */
  const rockM=mat('stone',2,2),coralM=mat('coral',1,1);
  for(let i=0;i<26;i++){const a=Math.random()*6.28,r=18+Math.random()*50,x=Math.cos(a)*r*1.3,z=Math.sin(a)*r;if(Math.abs(z)<9&&Math.abs(x)<26)continue;
    const s=.7+Math.random()*2.6;const o=mesh(new THREE.IcosahedronGeometry(s,1),rockM,x,s*.3,z);o.scale.y=.7;o.rotation.set(Math.random(),Math.random(),Math.random());scene.add(o);
    for(let k=0;k<3;k++){const c=mesh(new THREE.ConeGeometry(.25,1.2+Math.random()*1.4,6),new THREE.MeshStandardMaterial({map:TEX.coral,color:[0xff7a5a,0xc77aff,0xffb35a][k],emissive:[0x401008,0x200a40,0x402008][k],roughness:.8}),x+(Math.random()-.5)*s,s*.6,z+(Math.random()-.5)*s);c.rotation.z=(Math.random()-.5)*.6;scene.add(c)}}
  const weedM=new THREE.MeshStandardMaterial({color:0x4a9a40,emissive:0x0a2a10,side:THREE.DoubleSide,roughness:.9});
  for(let i=0;i<110;i++){const a=Math.random()*6.28,r=10+Math.random()*60,x=Math.cos(a)*r*1.3,z=Math.sin(a)*r;if(Math.abs(z)<8&&Math.abs(x)<24)continue;
    const g=new THREE.PlaneGeometry(.5,3+Math.random()*3.5,1,5);g.translate(0,g.parameters.height/2,0);const m=new THREE.Mesh(g,weedM);m.position.set(x,0,z);m.rotation.y=Math.random()*3;scene.add(m);sway.push({o:m,a:.18,s:.6+Math.random()*.5,p:Math.random()*6,axis:'x'})}
  /* Lichtstrahlen */
  const rt=rayTex();
  for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(4+Math.random()*5,34),new THREE.MeshBasicMaterial({map:rt,color:0x9ff3ff,transparent:true,opacity:.10+Math.random()*.08,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    m.position.set((Math.random()-.5)*90,16,(Math.random()-.5)*70);m.rotation.set(0,Math.random()*3,.28);scene.add(m);sway.push({o:m,a:.04,s:.15+Math.random()*.1,p:Math.random()*6,axis:'y'})}
  scene.add(new THREE.HemisphereLight(0x9ae8f2,0x123c46,.95));
  const sun=new THREE.DirectionalLight(0xb6f1ff,.65);sun.position.set(10,50,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-45;sc.right=45;sc.top=30;sc.bottom=-30;sc.far=120;scene.add(sun);const fill=new THREE.DirectionalLight(0x8fe6f0,.4);fill.position.set(-30,12,-25);scene.add(fill);const fill2=new THREE.DirectionalLight(0x8fe6f0,.3);fill2.position.set(25,8,30);scene.add(fill2);
  /* Meeresschnee und Blasen */
  const N=900,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*120;pos[i*3+1]=Math.random()*30;pos[i*3+2]=(Math.random()-.5)*90}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const snow=new THREE.Points(sg,new THREE.PointsMaterial({size:.12,color:0xcff,transparent:true,opacity:.6,depthWrite:false,fog:true}));scene.add(snow);
  tick.push((t,dt)=>{const a=sg.attributes.position;for(let i=0;i<N;i++){let y=a.getY(i)+dt*(.18+(i%5)*.02);if(y>30)y=0;a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(t*.3+i)*dt*.1)}a.needsUpdate=true});
  const B=160,bp=new Float32Array(B*3),vent=[[8,0,-14],[-20,0,12],[14,1,3],[-2,0,22]];
  for(let i=0;i<B;i++){const v=vent[i%4];bp[i*3]=v[0];bp[i*3+1]=Math.random()*26;bp[i*3+2]=v[2]}
  const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
  const bt=glowTex();const bubbles=new THREE.Points(bg,new THREE.PointsMaterial({size:.45,map:bt,color:0xdffcff,transparent:true,opacity:.75,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(bubbles);
  tick.push((t,dt)=>{const a=bg.attributes.position;for(let i=0;i<B;i++){let y=a.getY(i)+dt*(1.4+(i%7)*.25);const v=vent[i%4];if(y>26){y=0;a.setX(i,v[0]+(Math.random()-.5)*.8);a.setZ(i,v[2]+(Math.random()-.5)*.8)}a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(t*2+i)*dt*.25)}a.needsUpdate=true});
  /* Quallen */
  [[-26,10,12,0x9fe8ff],[-8,13,-20,0xc8a0ff],[24,9,14,0xa8ffd8],[10,15,-8,0xc8a0ff],[-34,8,-12,0x9fe8ff],[30,12,-16,0xffa0e0]].forEach((j,i)=>{
    const g=new THREE.Group(),col=j[3],dome=new THREE.Mesh(new THREE.SphereGeometry(1.2,18,10,0,6.2832,0,1.45),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));g.add(dome);
    const lines=[];for(let k=0;k<8;k++){const pts=[];for(let q=0;q<7;q++)pts.push(new THREE.Vector3(0,-q*.45,0));const geo=new THREE.BufferGeometry().setFromPoints(pts);const l=new THREE.Line(geo,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.6,fog:false}));l.userData.a=k/8*6.28;g.add(l);lines.push(l)}
    g.position.set(j[0],j[1],j[2]);g.scale.setScalar(.9+i%3*.4);scene.add(g);
    tick.push(t=>{g.position.y=j[1]+Math.sin(t*.5+i)*1.4;g.rotation.y=t*.15+i;const s=1+Math.sin(t*1.6+i)*.1;dome.scale.set(1/s,s,1/s);
      lines.forEach(l=>{const a=l.geometry.attributes.position,ang=l.userData.a;for(let q=0;q<7;q++){const r=.9*(1-q*.03);a.setXYZ(q,Math.cos(ang)*r+Math.sin(t*1.4+q*.6+ang)*.18*q/3,-q*.45*s,Math.sin(ang)*r+Math.cos(t*1.2+q*.5+ang)*.18*q/3)}a.needsUpdate=true})});
  });
  /* Fischschwärme */
  const fishM=new THREE.MeshStandardMaterial({color:0xb9d6e0,emissive:0x203840,metalness:.5,roughness:.4});
  [[-10,9,28,14,0],[12,11,-26,16,2],[34,7,2,12,4]].forEach((c,si)=>{
    for(let i=0;i<14;i++){const f=new THREE.Group();const b=new THREE.Mesh(new THREE.ConeGeometry(.14,.6,6),fishM);b.rotation.z=-Math.PI/2;f.add(b);const t=new THREE.Mesh(new THREE.ConeGeometry(.12,.25,4),fishM);t.rotation.z=Math.PI/2;t.position.x=-.38;f.add(t);scene.add(f);
      const ph=i*.45,rr=c[3]+(i%4)*.8,sp=.18+si*.03;tick.push(tm=>{const a=tm*sp+ph,x=c[0]+Math.cos(a)*rr,z=c[2]+Math.sin(a)*rr*.6,y=c[1]+Math.sin(tm*.7+i)*1.2;f.position.set(x,y,z);const a2=a+.05;f.lookAt(c[0]+Math.cos(a2)*rr,y,c[2]+Math.sin(a2)*rr*.6);f.rotateY(-Math.PI/2)})}
  });
}
/* Kamerapfad */
const P=[[-48,10,30,0,5,0],[-24,6.5,22,-2,4,0],[-2,5,17,0,4,2],[0,4,9,0,3.2,0],[.5,3.6,3.6,-4,2.8,-1],[-2,3.3,.4,-8,2.2,-2.2],[-5.5,3,-.8,-9,1.6,-2.2],[-3.4,4.6,.4,0,11,0],[.5,12,0,6,8,0],[14,18,20,-5,8,0],[-30,13,38,0,6,0]];
let curP,curL;
function curves(){curP=new THREE.CatmullRomCurve3(P.map(p=>new THREE.Vector3(p[0],p[1],p[2])),true,'catmullrom',.4);curL=new THREE.CatmullRomCurve3(P.map(p=>new THREE.Vector3(p[3],p[4],p[5])),true,'catmullrom',.4)}
let yaw=0,pitch=0,drag=false,lx=0,ly=0,auto=true,tAuto=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture&&el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1,Math.min(1,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{drag=false}));
document.getElementById('cam').addEventListener('click',function(){auto=!auto;this.textContent='Kamera: '+(auto?'Rundflug':'angehalten')});
let composer=null;
function post(){try{if(!THREE.EffectComposer||!THREE.UnrealBloomPass)return;const w=innerWidth,h=innerHeight,pr=renderer.getPixelRatio();const rt=new THREE.WebGLRenderTarget(w*pr,h*pr,{format:THREE.RGBAFormat});composer=new THREE.EffectComposer(renderer,rt);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(w,h),.4,.6,.93))}catch(e){composer=null}}
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(composer)composer.setSize(w,h)}
addEventListener('resize',size);
const DUR=110;
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  if(auto)tAuto+=dt;
  const u=(tAuto/DUR)%1,pos=curP.getPointAt(u),tg=curL.getPointAt(u);
  camera.position.copy(pos);
  const d=tg.clone().sub(pos);
  const ax=new THREE.Vector3(0,1,0);d.applyAxisAngle(ax,yaw);const right=new THREE.Vector3().crossVectors(d,ax).normalize();d.applyAxisAngle(right,pitch);
  camera.lookAt(pos.clone().add(d));
  if(!drag){yaw*=1-Math.min(1,dt*.6);pitch*=1-Math.min(1,dt*.6)}
  CAU.offset.set(t*.03,t*.02);
  flick.forEach((l,i)=>{l.intensity=(i?2.4:2.2)*(1+Math.sin(t*7+i*3)*.06+Math.sin(t*13+i)*.04)});
  sway.forEach(s=>{if(s.axis==='x')s.o.rotation.x=Math.sin(t*s.s+s.p)*s.a;else if(s.axis==='y')s.o.rotation.y+=Math.sin(t*s.s+s.p)*s.a*.002;else s.o.rotation.z=Math.sin(t*s.s+s.p)*s.a});
  tick.forEach(f=>f(t,dt));
  if(composer){try{composer.render()}catch(e){composer=null;renderer.render(scene,camera)}}else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
Promise.all(['planks','barnacle','rust','stone','sand','coral','copper','canvas','rope'].map(n=>loadTex(n))).then(()=>{
  build();curves();size();post();
  const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),1000);
  window.__wr={camera:camera,setT:v=>{tAuto=v*DUR;auto=true},ready:true};
  requestAnimationFrame(frame);
});
})();
</script>
</body>
