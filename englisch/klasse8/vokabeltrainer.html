<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Vokabeltrainer Klasse 8 – Sky Empire</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{--ink:#16305A;--bg:#E4F0FF;--card:#fff;--soft:#EEF5FF;--muted:#4A6A98;--accent:#3A78E0;--gold:#FFC24A;--ok:#1F9D55;--okbg:#DDF5E6;--bad:#D6402F;--badbg:#FDE4E0;--line:#16305A;--track:#D2E2F6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Lexend,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#CFE4FF,#EAF4FF 55%,#F6FAFF) fixed;min-height:100dvh;padding:0 0 max(24px,env(safe-area-inset-bottom))}
h1,h2,h3,.fr{font-family:Fredoka,system-ui,sans-serif}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:2.5px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .back{font-family:Fredoka;font-weight:600;text-decoration:none;background:var(--gold);color:#2A1E06;padding:8px 14px;border-radius:12px;border:2px solid var(--line)}
.top h1{margin:0;font-size:20px;flex:1;min-width:160px}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{font-family:Fredoka;font-weight:600;font-size:16px;padding:10px 16px;border-radius:14px;border:2.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent);color:#fff}
.panel{background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 rgba(22,48,90,.15)}
.panel h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);margin:0 0 10px;font-size:14px}
.stat{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.bar{flex:1;min-width:180px;height:14px;border-radius:9px;background:var(--track);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5BC0FF,#3A78E0)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:600 14px Lexend;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;border:2.5px solid var(--line);background:var(--soft);cursor:pointer;color:var(--ink);font:inherit}
.mode b{font:700 19px Fredoka}.mode span{font-size:13px;color:var(--muted)}
.mode.mock{background:var(--gold);color:#2A1E06;grid-column:1/-1}.mode.mock span{color:#5A430C}
button{font:inherit;color:inherit}
.btn{font:700 17px Fredoka;padding:12px 20px;border-radius:14px;border:2.5px solid var(--line);background:var(--accent);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink)}.btn.gold{background:var(--gold);color:#2A1E06}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card3d{perspective:1000px;margin:10px auto;max-width:560px}
.flash{min-height:250px;border:3px solid var(--line);border-radius:22px;background:#fff;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;box-shadow:0 6px 0 rgba(22,48,90,.18);user-select:none}
.flash.back{background:var(--soft)}
.flash .w{font:700 32px Fredoka;line-height:1.15}.flash .de{font:600 24px Fredoka}.flash .ex{font-size:16px;color:var(--muted);font-style:italic}
.flash .forms{font-size:15px;color:var(--muted)}
.tag{display:inline-block;font:600 12px Lexend;padding:3px 9px;border-radius:999px;background:var(--track)}
.spk{border:2px solid var(--line);background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer}
.q{font:600 22px Fredoka;margin:10px 0}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opt{padding:14px;border-radius:14px;border:2.5px solid var(--line);background:#fff;text-align:left;font:600 17px Lexend;cursor:pointer;min-height:56px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
input.t{font:600 20px Lexend;padding:12px 14px;border-radius:12px;border:2.5px solid var(--line);width:100%;max-width:480px;background:#fff;color:var(--ink)}
input.t.ok{background:var(--okbg);border-color:var(--ok)}input.t.bad{background:var(--badbg);border-color:var(--bad)}input.t.half{background:#FFF3CC;border-color:#C79200}
.fb{margin:10px 0;padding:10px 14px;border-radius:12px;font-weight:600}
.wbank{margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--soft);border:2px dashed var(--line)}
.wchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.wchip{font:700 16px Lexend;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:#fff}
.wchip.used{opacity:.4;text-decoration:line-through}
select.t{max-width:340px;background:#fff}
.cap{display:inline-block;margin:6px 0 0;padding:4px 10px;border-radius:10px;background:#FFF3CC;color:#6B4B00;font:600 14px Lexend}
.fb.ok{background:var(--okbg);color:#0E5A30}.fb.bad{background:var(--badbg);color:#8C2217}.fb.half{background:#FFF3CC;color:#6B4B00}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.list{width:100%;border-collapse:collapse;font-size:15px}
.list td{padding:7px 8px;border-bottom:1px solid #D8E4F4;vertical-align:top}
.list td:first-child{font-weight:700;white-space:nowrap}
.list tr.k td:first-child:before{content:"✓ ";color:var(--ok)}
input.s{font:16px Lexend;padding:10px 12px;border-radius:12px;border:2px solid var(--line);width:100%;max-width:340px;margin:6px 0}
/* Test */
.test .part{margin:18px 0 6px;padding:8px 14px;border-radius:12px;background:var(--ink);color:#fff;font:600 18px Fredoka}
.it{padding:12px 0;border-bottom:1px dashed #B8CCE8}
.it .n{display:inline-block;min-width:30px;font-weight:700;color:var(--muted)}
.it .p{font-size:12px;color:var(--muted);margin-left:6px}
.it .gap{font-size:17px;margin:4px 0 8px}
.pic{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:4px}
.pic img{width:240px;max-width:100%;height:160px;object-fit:contain;border-radius:12px;border:2px solid var(--line);background:#eef}
.picfail{width:240px;max-width:100%;padding:14px;border-radius:12px;border:2px dashed var(--line);background:#f6f6fb;font-size:15px}
.credits{margin:8px 0 0;font-size:12px;color:#667}.credits li{margin:2px 0}
.mcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mcrow label{display:flex;gap:8px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:16px}
.mcrow input{width:20px;height:20px}
.mcrow label:has(input:checked){background:#D9E8FF}
.res{text-align:center}
.ring{width:190px;height:190px;border-radius:50%;margin:8px auto;display:grid;place-items:center;border:8px solid var(--line);background:#fff;font:700 54px Fredoka}
.ring small{display:block;font:600 16px Fredoka;color:var(--muted)}
.note{display:inline-block;font:700 28px Fredoka;padding:6px 18px;border-radius:16px;background:var(--gold);color:#2A1E06;border:2.5px solid var(--line)}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.bk div{padding:10px;border-radius:14px;background:var(--soft);border:2px solid var(--line)}
.err td{padding:6px 8px;border-bottom:1px solid #E8C8C4;font-size:14px;text-align:left;vertical-align:top}
.small{font-size:13px;color:var(--muted)}
@media (max-width:560px){.flash .w{font-size:26px}.top h1{font-size:17px}}
</style>

<body>
<div class="top"><a class="back" id="back" href="../welt.html?k=8&a=vocabulary">← Sky Empire</a><h1>📚 Vokabeltrainer · Klasse 8</h1></div>
<main class="wrap" id="v"></main>
<script src="../saetze.js"></script>
<script src="vokabeln8a.js"></script>
<script src="vokabeln8b.js"></script>
<script src="fotos8.js"></script>
<script src="gruppen8.js"></script>
<script src="../../lernwelt/freigabe.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s), V = $("#v");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

/* ---------- Daten einlesen ---------- */
function parseUnits(txts){
  const units = []; let U = null, S = "";
  for(const txt of txts) for(let line of txt.split("\n")){
    line = line.trim(); if(!line) continue;
    if(line.startsWith("## ")){ const m = line.slice(3).match(/^Unit (\d+)\s*\|\s*(.*)$/); U = {id:+m[1], n:+m[1], titel:m[2], items:[], secs:[]}; units.push(U); }
    else if(line.startsWith("# ")){ S = line.slice(2).replace("*",""); if(!U.secs.includes(S)) U.secs.push(S); }
    else { const p = line.split("|").map(x=>x.trim()); if(!p[0] || !p[1]) continue;
      const full = p[0], phrase = full.includes("…"), parts = phrase ? [full] : full.split(/,\s+/);
      const it = {u:U.id, en:full, head:parts[0], forms:parts.slice(1), de:p[1], ex:p[2]||(!phrase&&window.SAETZE&&SAETZE[parts[0].replace(/^to\s+/,"").toLowerCase()])||"", sec:S, phrase};
      it.key = U.id+"|"+full+"|"+it.de.slice(0,14); it.deShort = it.de.split(/;\s*/).slice(0,2).join("; ");
      it.typeOk = !phrase && !/^simple past/.test(it.de);
      U.items.push(it); } }
  return units;
}
const UNITS = parseUnits(window.VOK8 || []);
const IRR = (window.VOK8_IRR || "").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split("|").map(x=>x.trim()); return {inf:p[0], past:p[1], pp:p[2], de:p[3], key:"irr|"+p[0]}; });

/* ---------- Hilfen ---------- */
function norm(s, keep){
  return (keep ? String(s||"") : String(s||"").toLowerCase()).replace(/[’`]/g,"'").replace(/\s*\([^)]*\)/g," ").replace(/\b(sth|sb|etw|jmdn)\b\.?/g," ")
    .replace(/^\s*to\s+/,"").replace(/[.,!?;:…"]/g," ").replace(/\s+/g," ").trim();
}
function normB(s){ return norm(String(s||"").replace(/[()]/g,"").replace(/=\s*/,"")); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
/* Groß-/Kleinschreibung: zählt bei Eigennamen, Nationalitäten, Ländern … (alles mit Großbuchstaben, was kein ganzer Satz ist) */
const needsCap = s => { const t = String(s||"").replace(/\([^)]*\)/g,"").trim(); return /[A-Z]/.test(t) && !/[.?!…]\s*$/.test(t); };
let capWhy = false;   // letzter Fehler war nur die Großschreibung?
/* gleich wie grade(), aber: stimmt der Text und nur die Großschreibung nicht, gibt es „fast“ (1) */
function gradeC(input, answers){
  capWhy = false; const g = grade(input, answers); if(g!==2) return g;
  const x = norm(input), xk = norm(input, true);
  for(const a of answers){ if(!a) continue; const b = String(a).replace(/[()]/g,"").replace(/=\s*/,"");
    if(norm(a)===x || normB(a)===x){ if(needsCap(a) && norm(a,true)!==xk && norm(b,true)!==xk){ capWhy = true; return 1; } return 2; } }
  return 2;
}
/* 2 = richtig, 1 = fast (ein Tippfehler), 0 = falsch */
function grade(input, answers){
  const x = norm(input); if(!x) return 0; let best = 0;
  for(const a of answers.map(norm).concat(answers.map(normB))){ if(!a) continue; if(x===a) return 2; if(a.length>=6 && lev(x,a)<=1) best = 1; }
  return best;
}
const meanOf = it => it.de.split(/;\s*/).map(x=>x.replace(/\(.*?\)/g,"").replace(/^hier:\s*/,"").trim().toLowerCase()).filter(x=>x.length>2);
const overlap = (a,b) => { const m = meanOf(b); return meanOf(a).some(x=>m.includes(x)); };
/* gleichbedeutende Wörter derselben Unit gelten ebenfalls als richtig (z. B. harbor/port = Hafen) */
function answersOf(it){ const U = UNITS.find(u=>u.id===it.u); return U ? U.items.filter(o=>o.typeOk && (o===it || overlap(o,it))).map(o=>o.head) : [it.head]; }
function speak(t){ try{ const u = new SpeechSynthesisUtterance(String(t).replace(/\(.*?\)/g,"").replace(/\bsth\b|\bsb\b/g,"something")); u.lang="en-US"; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
const boxes = store.get("vt8-box", {});
const getBox = it => boxes[it.key] || 0;
const setBox = (it,v) => { boxes[it.key] = Math.max(0,Math.min(3,v)); store.set("vt8-box", boxes); };
const bump = (it,ok) => setBox(it, ok ? getBox(it)+1 : 0);

/* Lückensatz aus dem Beispielsatz */
function cloze(it){
  const ex = it.ex; if(!it.typeOk || !ex || !/[.!?]["”]?$/.test(ex) || /[→↔=]|^AE:|^BE:|Achtung|^[a-z]/.test(ex)) return null;
  const base = norm(it.head); if(!base || base.length<3) return null;
  const re = new RegExp("(^|[^A-Za-z'])("+base.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?=[^A-Za-z']|$)","i"); let m = ex.match(re);
  if(m){ const at = m.index + m[1].length; return {text: ex.slice(0,at)+"_____"+ex.slice(at+m[2].length), ans:[m[2]]}; }
  if(!base.includes(" ")){ const stem = base.slice(0, Math.max(3, base.length-1)); const toks = ex.match(/[A-Za-z'’-]+/g)||[];
    for(const t of toks){ const l=t.toLowerCase(); if(l.startsWith(stem) && l.length<=base.length+4 && l.length>=base.length-1 && l!==base){ const at = ex.indexOf(t); return {text: ex.slice(0,at)+"_____"+ex.slice(at+t.length), ans:[t]}; } } }
  return null;
}
/* Mehrfachauswahl: 4 Optionen */
function mcOptions(it, pool, dir){
  const fmt = dir==="en" ? x=>x.deShort : x=>x.head, correct = fmt(it);
  const same = pool.filter(o=>o!==it && fmt(o)!==correct && !overlap(o,it) && (o.head.startsWith("to ")===it.head.startsWith("to ")) && !o.phrase===!it.phrase);
  let d = shuffle(same).slice(0,3); if(d.length<3) d = d.concat(shuffle(pool.filter(o=>o!==it && fmt(o)!==correct && !overlap(o,it) && !d.includes(o))).slice(0,3-d.length));
  return shuffle([it].concat(d)).map(o=>({t:fmt(o), ok:o===it}));
}
const NOTEN = [[92,1,"sehr gut"],[81,2,"gut"],[67,3,"befriedigend"],[50,4,"ausreichend"],[30,5,"mangelhaft"],[0,6,"ungenügend"]];
const noteOf = p => NOTEN.find(n=>p>=n[0]);

/* ---------- Zustand ---------- */
const params = new URLSearchParams(location.search);
let cur = params.get("u")==="irr" ? "irr" : (+params.get("u")>=1 && +params.get("u")<=5 ? +params.get("u") : 1);
let secs = new Set();
const unit = () => UNITS.find(u=>u.id===cur);
const pool = () => cur==="irr" ? IRR : unit().items.filter(i=>!secs.size || secs.has(i.sec));
const ID = () => cur==="irr" ? "vtri" : "vtr"+cur;
const TITLE = () => cur==="irr" ? "Irregular verbs" : "Unit "+cur+" · "+unit().titel;

/* ---------- Startseite ---------- */
function home(){
  const P = pool(), all = cur==="irr" ? IRR : unit().items, known = all.filter(i=>getBox(i)>=2).length;
  const best = store.get("vt8-best", {})[ID()];
  const lk = id => !!(window.FREI && (FREI.locked(8,"vocabulary") || FREI.lockedThema(8,id)));   // von der Lehrkraft gesperrt?
  const tabs = UNITS.map(u=>`<button class="tab" data-u="${u.id}" aria-pressed="${cur===u.id}">${lk("vtr"+u.id)?"🔒 ":""}Unit ${u.id}</button>`).join("") + `<button class="tab" data-u="irr" aria-pressed="${cur==="irr"}">${lk("vtri")?"🔒 ":""}Irregular verbs</button>`;
  if(lk(ID())){ V.innerHTML = `<div class="tabs">${tabs}</div><section class="panel" style="text-align:center"><div style="font-size:56px">🔒</div><h2>Not open yet</h2><p class="sub">Your teacher will open <b>${esc(TITLE())}</b> soon.<br>Dieser Teil ist noch gesperrt – deine Lehrkraft schaltet ihn bald frei.</p></section>`; return; }
  const chips = cur==="irr" ? "" : `<div class="chips"><button class="chip" data-sec="" aria-pressed="${!secs.size}">Alle Abschnitte</button>${unit().secs.map(s=>`<button class="chip" data-sec="${esc(s)}" aria-pressed="${secs.has(s)}">${esc(s)} (${unit().items.filter(i=>i.sec===s).length})</button>`).join("")}</div>`;
  V.innerHTML = `<div class="tabs">${tabs}</div>
  <section class="panel"><h2>${esc(TITLE())}</h2><p class="sub">${all.length} ${cur==="irr"?"Verben":"Vokabeln"} · gewählt: ${P.length}</p>
    <div class="stat"><div class="bar" title="gelernt"><i style="width:${Math.round(known/all.length*100)}%"></i></div><b>${known}/${all.length} gelernt</b></div>${chips}</section>
  <section class="panel"><h2>Üben</h2><p class="sub">Neue Wörter zuerst: Was du nicht weißt, kommt öfter dran.</p>
    <div class="modes">
      <button class="mode" data-m="cards"><b>📇 Karteikarten</b><span>Antippen zum Umdrehen, mit Aussprache</span></button>
      <button class="mode" data-m="quiz"><b>❓ Quiz</b><span>Antwort aus vier Möglichkeiten wählen</span></button>
      <button class="mode" data-m="type"><b>⌨️ Eintippen</b><span>${cur==="irr"?"Past und Participle schreiben":"Deutsch → Englisch schreiben"}</span></button>
      <button class="mode" data-m="list"><b>📋 Liste</b><span>Alle Wörter ansehen und suchen</span></button>
      ${cur==="irr"?"":`<button class="mode" data-m="mix"><b>🎲 Aufgabenmix</b><span>Zuordnen · Das passt nicht · Fehler finden · Diktat (28 Punkte)</span></button>`}
      <button class="mode mock" data-m="mock"><b>📝 Mock Test · ${esc(TITLE())}${cur!=="irr"&&secs.size?" · "+[...secs].map(esc).join(" + "):""}</b><span>${cur!=="irr"&&secs.size?"nur die gewählten Abschnitte · eigener Übungstest (zählt nicht für Bestwert)":"50 Punkte"} · Prozent und vorläufige Note${best?` · Dein Bestwert: ${best.pct} % (Note ${best.note})`:""}</span></button>
    </div></section>`;
}

/* ---------- Karteikarten ---------- */
function cards(list){
  let q = list || shuffle(pool()).sort((a,b)=>getBox(a)-getBox(b)).slice(0,15), i = 0, back = false, again = 0, total = q.length;
  const show = () => {
    if(i>=q.length){ V.innerHTML = `<section class="panel res"><h2>Geschafft! 🎉</h2><p>${total} Karten durchgearbeitet${again?`, ${again}× „noch nicht“`:""}.</p><div class="row" style="justify-content:center"><button class="btn" data-a="again">Neue Runde</button><button class="btn alt" data-a="home">Zur Übersicht</button></div></section>`; return; }
    const it = q[i];
    const front = cur==="irr" ? `<div class="w">${esc(it.inf)}</div><div class="small">Wie heißen Past und Participle?</div>` : `<div class="w">${esc(it.head)}</div>${it.forms.length?`<div class="forms">${esc(it.forms.join(" · "))}</div>`:""}<span class="tag">${esc(it.sec)}</span>`;
    const bk = cur==="irr" ? `<div class="de">${esc(it.past)} · ${esc(it.pp)}</div><div>${esc(it.de)}</div>` : `<div class="de">${esc(it.de)}</div>${it.ex?`<div class="ex">${esc(it.ex)}</div>`:""}`;
    V.innerHTML = `<div class="prog"><span>Karte ${i+1} von ${q.length}</span><button class="chip" data-a="home">Beenden</button></div><div class="bar"><i style="width:${i/q.length*100}%"></i></div>
      <div class="card3d"><div class="flash ${back?"back":""}" data-a="flip">${back?bk:front}<div class="row" style="justify-content:center"><button class="spk" data-a="say" aria-label="Vorlesen">🔊</button></div>${back?"":`<div class="small">Antippen zum Umdrehen</div>`}</div></div>

function typoOf(w){ const L = w.split(""), n = L.length, t = [];
  for(let i=Math.floor(n/2); i<n-1; i++) if(L[i]!==L[i+1] && /[a-z]{2}/i.test(L[i]+L[i+1])){ const a = L.slice(); [a[i],a[i+1]] = [a[i+1],a[i]]; t.push(a.join("")); }
  for(let i=1; i<n-1; i++) if(L[i]===L[i+1]) t.push(L.slice(0,i).concat(L.slice(i+1)).join(""));
  for(let i=2; i<n-1; i++) if(/[bcdfglmnprst]/.test(L[i]) && L[i]!==L[i-1] && L[i]!==L[i+1]) t.push(L.slice(0,i+1).concat(L[i], L.slice(i+1)).join(""));
  const ok = t.filter(x=>x.toLowerCase()!==w.toLowerCase()); return ok.length ? rnd(ok) : null; }

  const M = []; for(const it of shuffle(all.filter(i=>i.typeOk && !i.phrase && i.deShort.length<=26))){ if(M.length>=6) break; if(M.some(o=>overlap(o,it)||o.deShort===it.deShort)) continue; M.push(it); }
  M.forEach(it=>used.add(norm(it.head)));

  const G = window.GRUPPEN8 || {}, every = UNITS.flatMap(u=>u.items), byKey = {}; every.forEach(i=>{ const k = norm(i.head); if(!byKey[k]) byKey[k] = i; });
  const members = g => G[g].map(w=>byKey[norm(w)]).filter(Boolean), names = Object.keys(G).filter(g=>members(g).length>=4), O = [];
  for(const g of shuffle(names).slice(0,4)){ const others = shuffle(names.filter(n=>n!==g)), og = others[0]; if(!og) continue;
    const three = shuffle(members(g)).slice(0,3), odd = rnd(members(og)); if(three.length<3||!odd) continue;
    O.push({kind:"mc", it:odd, pts:1, q:"Welches Wort passt <b>nicht</b> zu den anderen?", opts:shuffle(three.concat(odd)).map(o=>({t:o.head.replace(/\s*\(.*?\)/g,""), ok:o===odd}))}); }
  // 3) Fehler finden: ein Wort im Satz ist falsch geschrieben
  const F = []; for(const it of take(all.filter(i=>cloze(i)), 20)){ if(F.length>=4) break; const c = cloze(it), w = c.ans[0]; if(/[^A-Za-z]/.test(w) || w.length<5) continue; const bad = typoOf(w); if(!bad) continue;
    F.push({kind:"fix", it, pts:2, ans:w, wrong:bad, html:esc(c.text).replace("_____", `<mark>${esc(bad)}</mark>`), plain:c.text.replace("_____", bad)}); }
  // 4) Diktat
  const D = take(all.filter(i=>i.typeOk && !i.phrase && norm(i.head).length>=4), 5).map(it=>({kind:"dict", it, pts:2}));
  return [{id:"1", titel:"Teil 1 · Zuordnen: Welche deutsche Bedeutung gehört zum englischen Wort? (1 Punkt je Wort)", items:M.map(it=>({kind:"match", it, pts:1}))},
    {id:"2", titel:"Teil 2 · Das passt nicht (1 Punkt je Aufgabe)", items:O},
    {id:"3", titel:"Teil 3 · Fehler finden: Das markierte Wort ist falsch geschrieben – schreibe es richtig (2 Punkte je Satz)", items:F},
    {id:"4", titel:"Teil 4 · Diktat: Hör zu und schreibe das Wort (2 Punkte je Wort)", items:D}]; }

  V.onchange = e => { if(!e.target.classList.contains("bk-sel")) return; const used = [...V.querySelectorAll(".bk-sel")].map(x=>x.value);
    V.querySelectorAll(".wchip").forEach(c=>c.classList.toggle("used", used.includes(c.dataset.w))); };
  V.onclick = e => { const b = e.target.closest("[data-a]"); if(!b) return; if(b.dataset.a==="say"){ speak(b.dataset.w); return; } if(b.dataset.a==="home"){ if(confirm("Test wirklich abbrechen?")) go(); return; }
    if(b.dataset.a==="submit"){ const items = parts.flatMap(p=>p.items), blank = items.filter(x=> x.kind==="mc" ? !document.querySelector(`input[name=i${x.n}]:checked`) : x.kind==="irr" ? !$("#i"+x.n+"a").value.trim() && !$("#i"+x.n+"b").value.trim() : !$("#i"+x.n).value.trim()).length;
      if(blank && !confirm(blank+" Aufgabe(n) sind noch leer. Trotzdem abgeben?")) return; finish(parts, maxPts); } };
}
function finish(parts, maxPts){
  let tot = 0; const errs = [], br = [];
  for(const p of parts){ let s = 0, m = 0;
    for(const x of p.items){ m += x.pts; let got = 0, mine = "", sol = "";
      if(x.kind==="mc"){ const r = document.querySelector(`input[name=i${x.n}]:checked`); const o = r ? x.opts[+r.value] : null; mine = o ? o.t : "–"; sol = x.opts.find(o=>o.ok).t; got = o && o.ok ? 1 : 0; }
      else if(x.kind==="pic"){ mine = $("#i"+x.n).value.trim(); sol = x.it.head; const g = gradeC(mine, answersOf(x.it)); got = g===2 ? 2 : g===1 ? 1 : 0; }
      else if(x.kind==="match"){ mine = $("#i"+x.n).value; sol = x.it.deShort; got = mine===sol ? 1 : 0; }
      else if(x.kind==="fix"){ mine = $("#i"+x.n).value.trim(); sol = x.ans; const g = norm(mine,true)===norm(x.wrong,true) ? 0 : gradeC(mine,[x.ans]); got = g===2 ? 2 : g===1 ? 1 : 0; }
      else if(x.kind==="dict"){ mine = $("#i"+x.n).value.trim(); sol = x.it.head; const g = gradeC(mine, answersOf(x.it)); got = g===2 ? 2 : g===1 ? 1 : 0; }
      else if(x.kind==="type"){ mine = $("#i"+x.n).value.trim(); sol = x.it.head; const g = gradeC(mine, answersOf(x.it)); got = g===2 ? 2 : g===1 ? 1 : 0; }
      else if(x.kind==="gap"){ mine = $("#i"+x.n).value.trim(); sol = x.c.ans[0]; const g = gradeC(mine, x.c.ans); got = g===2 ? 2 : g===1 ? 1 : 0; }
      else { const a = $("#i"+x.n+"a").value.trim(), b = $("#i"+x.n+"b").value.trim(); mine = a+" / "+b; sol = x.it.past+" / "+x.it.pp; got = (grade(a,x.it.past.split("/"))?1:0) + (grade(b,x.it.pp.split("/"))?1:0); }
      s += got; if(got<x.pts) errs.push({x, mine, sol, got}); if(x.kind!=="irr" || true) bump(x.it, got===x.pts); }
    tot += s; br.push([p.id, s, m]); }
  const pct = Math.round(tot/maxPts*100), [lo, note, txt] = noteOf(pct);
  // Bestwert speichern – im Format der Klassenwelt, damit die Inselübersicht und der Ergebnis-Code ihn mitzählen
  const save = MODE!=="mix" && (cur==="irr" || !secs.size);   // der Aufgabenmix ist reine Übung: kein Bestwert, kein Ergebnis-Code
  if(save){ const bests = store.get("vt8-best", {}), old = bests[ID()]; if(!old || pct>old.pct) bests[ID()] = {pct, note, pts:tot}; store.set("vt8-best", bests); }
  if(save) try{ const key = "lw-"+ID()+"-v1", r = store.get(key, {lv:{}, name:"", done:false, seen:{}}); const lv = r.lv.mock || (r.lv.mock = {best:0, runs:0, it:{}}); lv.runs = (lv.runs||0)+1; lv.best = Math.max(lv.best||0, tot); lv.it = lv.it||{}; if(tot>=maxPts) lv.pf = true; store.set(key, r);
    store.set("lw-meta-"+ID(), {max:maxPts, titel:"Vokabeltest "+TITLE(), ids:["mock"], maxima:[maxPts]}); }catch(e){}
  V.innerHTML = `<section class="panel res"><h2>Dein Ergebnis</h2><div class="ring" style="border-color:${pct>=50?"var(--ok)":"var(--bad)"}"><div>${pct} %<small>${tot} von ${maxPts} Punkten</small></div></div>
    <div class="note">Vorläufige Note: ${note} · ${txt}</div>
    <div class="bk">${br.map(([id,s,m])=>`<div><b>Teil ${id}</b><br>${s} / ${m} Punkte</div>`).join("")}</div>
    <p class="small">Notenschlüssel: ab 92 % = 1 · ab 81 % = 2 · ab 67 % = 3 · ab 50 % = 4 · ab 30 % = 5 · darunter 6. Die echte Note legt deine Lehrkraft fest.</p>
    ${errs.length?`<h3>Das solltest du noch üben (${errs.length})</h3><table class="err"><tbody>${errs.map(e=>`<tr><td>${e.x.n}.</td><td>${esc(e.x.kind==="irr"?e.x.it.inf+" – "+e.x.it.de:e.x.kind==="gap"?e.x.c.text:e.x.kind==="mc"?e.x.q.replace(/<[^>]+>/g,""):e.x.kind==="match"?e.x.it.head:e.x.kind==="fix"?e.x.plain:e.x.kind==="dict"?"🔊 Diktat":e.x.it.de)}</td><td>Du: ${esc(e.mine||"–")}</td><td><b>${esc(e.sol)}</b></td></tr>`).join("")}</tbody></table>`:"<p>Fehlerfrei – 🌟 Wow!</p>"}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-a="again">Neuer Test</button>${errs.length?`<button class="btn gold" data-a="fix">Fehler als Karten üben</button>`:""}<button class="btn alt" data-a="home">Übersicht</button></div></section>`;
  window.scrollTo(0,0);
  V.onclick = e => { const a = e.target.closest("[data-a]"); if(!a) return; if(a.dataset.a==="again") return mock(MODE); if(a.dataset.a==="fix") return cards(errs.map(e=>e.x.it)); go(); };
}

/* ---------- Steuerung ---------- */
function go(){ V.onkeydown = null; home(); V.onclick = e => {
  const t = e.target.closest("[data-u]"); if(t){ cur = t.dataset.u==="irr" ? "irr" : +t.dataset.u; secs = new Set(); try{ history.replaceState(null,"","?u="+cur); }catch(_){} return home(); }
  const c = e.target.closest("[data-sec]"); if(c){ const s = c.dataset.sec; if(!s) secs.clear(); else secs.has(s) ? secs.delete(s) : secs.add(s); return home(); }
  const m = e.target.closest("[data-m]"); if(m){ ({cards, quiz, type:typing, list, mock:()=>mock("test"), mix:()=>mock("mix")})[m.dataset.m](); window.scrollTo(0,0); } }; }
go();
</script>
