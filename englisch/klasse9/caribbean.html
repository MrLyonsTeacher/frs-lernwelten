      {"foto":"Santa_Maria_replica_ship.jpg", "bild":"⛵","titel":"Columbus and the colonies","text":"In **1492** Christopher Columbus reached the Caribbean. Soon Spain, Britain, France and the Netherlands fought for the islands. The native **Taíno** people almost all died from war and disease.","de":"**1492** erreichte Kolumbus die Karibik. Bald kämpften Spanien, Großbritannien, Frankreich und die Niederlande um die Inseln. Die einheimischen **Taíno** starben fast alle durch Krieg und Krankheiten."},
