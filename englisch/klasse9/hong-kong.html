      {"bild":"⚓","titel":"A British colony","text":"After the **First Opium War**, China had to give Hong Kong Island to Britain in **1842**. For more than **150 years** Hong Kong was a **British colony** and became an important trading port.","de":"Nach dem **Ersten Opiumkrieg** musste China **1842** die Insel Hongkong an Großbritannien abtreten. Über **150 Jahre** war Hongkong eine **britische Kolonie** und wurde ein wichtiger Handelshafen."},
