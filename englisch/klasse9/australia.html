      {"bild":"🗺️","titel":"A continent and a country","text":"Australia is the only country that is also a **continent**. It is about **21 times as big as Germany**, but only about **27 million** people live there – most of them near the **coast**.","de":"Australien ist das einzige Land, das auch ein **Kontinent** ist. Es ist etwa **21-mal so groß wie Deutschland**, aber nur rund **27 Millionen** Menschen leben dort – die meisten an der **Küste**."},
      {"bild":"🏛️","titel":"Canberra, not Sydney","text":"The biggest cities are **Sydney** and **Melbourne**, but the capital is **Canberra**. It was built as a compromise between the two rivals.","de":"Die größten Städte sind **Sydney** und **Melbourne**, aber die Hauptstadt ist **Canberra** – gebaut als Kompromiss zwischen den beiden Rivalen."},
      {"bild":"🖐️","titel":"The first Australians","text":"**Aboriginal and Torres Strait Islander peoples** have lived in Australia for **more than 60,000 years** – the oldest living cultures in the world. There were over **250 languages**.","de":"**Aborigines und Torres-Strait-Insulaner** leben seit **über 60.000 Jahren** in Australien – die ältesten lebenden Kulturen der Welt. Es gab über **250 Sprachen**."},
      {"bild":"⛵","titel":"Convicts and settlers","text":"In **1788** the British arrived with the **First Fleet**, many of them **convicts**. The Aboriginal people lost much of their land. Today Australia is a **multicultural** country.","de":"**1788** kamen die Briten mit der **First Fleet**, viele davon **Sträflinge**. Die Aborigines verloren viel Land. Heute ist Australien ein **multikulturelles** Land."},
      {"bild":"📻","titel":"The School of the Air","text":"Children on farms in the **Outback** often live hundreds of kilometres from the next school. They have lessons with the **School of the Air** – first by **radio**, today **online**.","de":"Kinder auf Farmen im **Outback** wohnen oft Hunderte Kilometer von der nächsten Schule entfernt. Sie lernen mit der **School of the Air** – früher per **Funk**, heute **online**."},
      {"bild":"🚁","titel":"The Flying Doctors","text":"In the Outback a doctor sometimes comes **by plane**. The **Royal Flying Doctor Service** has helped people in remote areas since **1928**.","de":"Im Outback kommt der Arzt manchmal **mit dem Flugzeug**. Der **Royal Flying Doctor Service** hilft seit **1928** Menschen in abgelegenen Gegenden."},
      {"bild":"🐠","titel":"The Great Barrier Reef","text":"The **Great Barrier Reef** is the **largest coral reef** in the world – you can even see it from space. But **global warming** causes **coral bleaching**.","de":"Das **Great Barrier Reef** ist das **größte Korallenriff** der Welt – sogar aus dem All sichtbar. Doch die **Erderwärmung** verursacht **Korallenbleiche**."},
      {"bild":"🦘","titel":"Amazing animals","text":"Most Australian animals live **nowhere else**: kangaroos, koalas, wombats, platypuses. Australia also has some of the world’s most **dangerous** animals – like the **box jellyfish** and the **saltwater crocodile**.","de":"Die meisten Tiere Australiens gibt es **nirgendwo sonst**: Kängurus, Koalas, Wombats, Schnabeltiere. Dazu einige der **gefährlichsten** Tiere der Welt – wie die **Würfelqualle** und das **Salzwasserkrokodil**."},
      {"bild":"🗣️","titel":"Aussie English","text":"Australians love short words: **G’day** (hello), **arvo** (afternoon), **brekkie** (breakfast), **barbie** (barbecue), **mate** (friend). And they say “**No worries!**” a lot.","de":"Australier lieben Kurzwörter: **G’day** (Hallo), **arvo** (Nachmittag), **brekkie** (Frühstück), **barbie** (Grill), **mate** (Kumpel). Und sie sagen oft „**No worries!**“ (Kein Problem!)."}

      text:"G’day [[mate|mat|meat]]!\nI’m Tilly and I live on a cattle station in the [[Outback|Outside|Outlook]] – the nearest town is 200 km away! That’s why I don’t go to a normal school. I learn with the [[School of the Air|School of the Sea|Air School of]]. Every morning I log on and see my teacher and classmates online.\nLast month my dad hurt his leg badly. We called the [[Flying Doctors|Driving Doctors|Flying Teachers]] and a plane landed on our farm!\nIn the holidays we’re going to Cairns to go snorkelling on the [[Great Barrier Reef|Great Barrier Rift|Big Coral Wall]]. I hope there are no box [[jellyfish|jellybeans|starfish]]! 😬\nSee you this [[arvo|avo|army]] online!\nTilly",
