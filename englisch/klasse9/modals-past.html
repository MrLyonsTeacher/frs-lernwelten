  lernen: {

      {"bild":"⏭️","titel":"Future","formel":["will be able to","will have to","will be allowed to"],"bsp":["One day you **will be able to** visit the rock again.","You **won’t have to** pay for the shuttle bus."],"de":"Zukunft: **will + Ersatzform**."},

    ]},
    uluru: { titel:"Uluru – a sacred place", folien:[
      {"bild":"🪨","titel":"A giant rock","text":"**Uluru** is a huge sandstone rock in the middle of Australia. It is about **348 m** high and changes colour at **sunrise and sunset**. Many people call it by its English name, **Ayers Rock**.","de":"**Uluru** ist ein riesiger Sandsteinfelsen mitten in Australien, etwa **348 m** hoch. Bei **Sonnenauf- und -untergang** ändert er die Farbe. Der englische Name ist **Ayers Rock**."},
      {"bild":"🖐️","titel":"The Anangu","text":"For the **Anangu**, the Aboriginal people of the area, Uluru is **sacred**. Their stories and ceremonies are connected with the rock. They have lived there for thousands of years.","de":"Für die **Anangu**, die Aborigines dieser Gegend, ist Uluru **heilig**. Ihre Geschichten und Zeremonien sind mit dem Felsen verbunden. Sie leben dort seit Tausenden von Jahren."},
      {"bild":"🚫","titel":"No more climbing","text":"For many years tourists climbed Uluru, although the Anangu asked them not to. Since **October 2019** climbing has been **banned**. At some sacred places you also **mustn’t take photos**.","de":"Viele Jahre lang kletterten Touristen auf den Uluru, obwohl die Anangu darum baten, es nicht zu tun. Seit **Oktober 2019** ist das Klettern **verboten**. An manchen heiligen Orten darf man auch **nicht fotografieren**."}
    ]}
  },
  levels: [

      ]},
    { id:"quiz", typ:"quiz", lernen:"mod", icon:"🍃", titel:"The Elders’ Rules", art:"Substitutes · quiz",
      anleitung:"Choose the right form.",
      anleitungDe:"Wähle die richtige Form.",
      tipp:"Signalwörter: yesterday, in 2019 → Vergangenheit · tomorrow, next year → Zukunft.",
      fragen:[
        {q:"Before 2019 tourists **___** climb Uluru.", o:["were allowed to","may","must"], c:0, e:"Past permission → **were allowed to**."},
        {q:"Yesterday we **___** get up at 4 am to see the sunrise.", o:["had to","must","have to"], c:0, e:"Past of *must* → **had to**."},
        {q:"Next week you **___** visit the cultural centre.", o:["will be able to","can will","will can"], c:0, e:"Future of *can* → **will be able to**."},

        {q:"If it rains, we **___** stay in the tent.", o:["will have to","must will","had to"], c:0, e:"Future → **will have to**."},

      ]},

        {t:"You take a stone from the rock as a souvenir.", r:"l", e:"Not respectful – you mustn’t take anything away."},
        {t:"You take photos where a sign says “No photos”.", r:"l", e:"Not respectful – some places are **sacred**."},

        {w:["We","weren't","allowed","to","climb","the","rock"], hint:"🇩🇪 Wir durften nicht auf den Felsen klettern."},
        {w:["They","had","to","walk","ten","kilometres"], hint:"🇩🇪 Sie mussten zehn Kilometer laufen."},
        {w:["Will","we","be","able","to","see","the","sunset","?"], hint:"🇩🇪 Werden wir den Sonnenuntergang sehen können?"},
        {w:["You","shouldn't","have","taken","that","stone"], hint:"🇩🇪 Du hättest diesen Stein nicht nehmen sollen."},
        {w:["I","didn't","have","to","pay","for","the","bus"], hint:"🇩🇪 Ich musste nicht für den Bus bezahlen."}
      ]},
    { id:"story", typ:"lueckentext", icon:"📓", titel:"Travel Diary: Red Centre", art:"Diary · fill in the gaps",

      tipp:"Vergangenheit, Gegenwart oder Zukunft?",
      ueberschrift:"Day 12 – Uluru",
      text:"Today was amazing! We [[had to|must|have to]] get up at 4:30 because we wanted to see the sunrise at Uluru. When the sun came up, we [[were able to|can|will be able to]] see the rock turn bright red.\nAfter breakfast we did the base walk. At some places we [[weren’t allowed to|didn’t have to|needn’t]] take photos because they are sacred to the Anangu. Our guide said that people [[were allowed to|are allowed to|will be allowed to]] climb the rock until 2019. One man in our group said he had climbed it in 2015. I think he [[shouldn’t have|mustn’t have|didn’t have to]] done that.\nTomorrow we [[will have to|had to|must to]] drive 450 km to Alice Springs. I hope we [[will be able to|could|were able to]] see some kangaroos on the way!",
      erklaerung:"Vergangenheit: **had to, were able to, weren’t allowed to** · Kritik: **shouldn’t have** · Zukunft: **will have to, will be able to**."}
  ]
});
