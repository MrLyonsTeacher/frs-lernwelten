<!DOCTYPE html>

<head>

<title>Dragon Questions – don't, doesn't, Do, Does</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">

<body>
<main class="lw" id="app"></main>
<script src="../../qrcode.js"></script>
<script src="../../ergebnis.js"></script>
<script src="../../lernwelt/lernwelt.js"></script>
<script src="../../lernwelt/thema.js"></script>
<script>
TH.start({
  k:5, kat:"grammar", id:"spq5", icon:"🔥", kartenSymbol:"❓",
  titel:"Dragon Questions", untertitel:"Simple present: don’t, doesn’t, Do …?, Does …?",
  text:"Interview the dragons of Fire Island! Ask questions and say what they don’t do – with do and does.",
  lernen: {
    q: { titel:"don’t, doesn’t, Do …?, Does …?", folien:[
      {"bild": "🚫", "titel": "don’t / doesn’t", "formel": ["I / you / we / they | don’t | Grundform", "he / she / it | doesn’t | Grundform"], "bsp": ["I **don’t** like snakes.", "He **doesn’t** like snakes."], "falsch": ["He doesn’t ~~likes~~ snakes."], "de": "Nach **don’t/doesn’t** steht das Verb **ohne -s**."},
      {"bild": "❓", "titel": "Do / Does …?", "formel": ["Do | I / you / we / they | Grundform …?", "Does | he / she / it | Grundform …?"], "bsp": ["**Do** you like pizza?", "**Does** she play tennis?"], "falsch": ["Does she ~~plays~~ tennis?"], "de": "Frage mit **Do/Does** – das Verb bleibt **ohne -s**."},
      {"bild": "👍", "titel": "Short answers", "bsp": ["Do you like cats? – Yes, I **do**. / No, I **don’t**.", "Does he like cats? – Yes, he **does**. / No, he **doesn’t**."], "de": "Kurzantwort mit **do / don’t / does / doesn’t** – nicht mit dem Verb."},
      {"bild": "🔎", "titel": "Question words", "formel": ["Where / What / When | do / does | Person | Grundform"], "bsp": ["**Where do** you live?", "**What does** the tiger eat?"], "de": "Fragewort + **do/does** + Person + Verb."}
    ]}
  },
  levels: [
    { id:"dd", typ:"swipe", lernen:"q", icon:"🚫", titel:"don't or doesn't?", art:"Swipe",
      anleitung:"Which word fits? Swipe **left for don’t** and **right for doesn’t**.",
      anleitungDe:"Welches Wort passt? Wische nach **links für don’t** und nach **rechts für doesn’t**.",
      tipp:"he, she, it → doesn’t.",
      links:{t:"don't", icon:"👈"}, rechts:{t:"doesn't", icon:"👉"},
      karten:[ {t:"I ___ like snakes.", r:"l", e:"Bei **I, you, we, they** heißt es **don’t**."}, {t:"The dragon ___ eat bananas.", r:"r", e:"The dragon = **it** → he/she/it bekommt **doesn’t**."}, {t:"We ___ go to school on Sundays.", r:"l", e:"**we** → **don’t**."}, {t:"My dad ___ watch TV.", r:"r", e:"my dad = **he** → **doesn’t**."},
               {t:"They ___ have a pet.", r:"l", e:"**they** → **don’t**."}, {t:"It ___ sleep at night.", r:"r", e:"**it** → **doesn’t**."}, {t:"You ___ play the guitar.", r:"l", e:"**you** → **don’t**."}, {t:"Olivia ___ like tea.", r:"r", e:"Olivia = **she** → **doesn’t**."},
               {t:"Penguins ___ like the sun.", r:"l", e:"penguins = **they** (mehrere) → **don’t**."}, {t:"The snake ___ sleep at night.", r:"r", e:"the snake = **it** → **doesn’t**."} ]},
    { id:"q", typ:"quiz", lernen:"q", icon:"❓", titel:"Interview a Dragon", art:"Do / Does · short answers · quiz",
      anleitung:"Choose the right word.",
      anleitungDe:"Wähle das richtige Wort.",
      tipp:"Do (I, you, we, they) – Does (he, she, it).",
      fragen:[
        {q:"**___** you like hot food?", o:["Do","Does","Are"], c:0, e:"Frage mit **you** → **Do** you …?"}, {q:"**___** your sister play netball?", o:["Does","Do","Is"], c:0, e:"your sister = **she** → **Does** she …?"},
        {q:"Where **___** you go after school?", o:["do","does","are"], c:0, e:"Fragewort + **do** + you … → Where **do** you go?"}, {q:"What **___** the tiger eat?", o:["does","do","is"], c:0, e:"the tiger = **it** → What **does** it eat?"},
        {q:"Does he **___** football?", o:["like","likes","liking"], c:0, e:"After *does* → **base form**: like."}, {q:"– Do you have a pet? – Yes, I **___**.", o:["do","does","am"], c:0, e:"Kurzantwort: Yes, I **do**. (Die Frage hat **do**.)"},
        {q:"– Does Flamy like water? – No, he **___**.", o:["doesn't","don't","isn't"], c:0, e:"Frage mit **does** → Kurzantwort: No, he **doesn’t**."}, {q:"When **___** you get up?", o:["do","does","are"], c:0, e:"**you** → When **do** you get up?"}
      ]},
    { id:"mistake", typ:"quiz", icon:"🕵️", titel:"Spot the Mistake", art:"Which sentence is right?",
      anleitung:"Only **one** sentence is correct. Find it!",
      anleitungDe:"Nur **ein** Satz ist richtig. Finde ihn!",
      tipp:"Nach don’t/doesn’t/do/does: kein -s!",
      fragen:[
        {q:"Which sentence is correct?", o:["He doesn't like cats.","He don't like cats.","He doesn't likes cats."], c:0, e:"he → **doesn’t** – und danach das Verb **ohne s**: like."},
        {q:"Which sentence is correct?", o:["Does she play tennis?","Do she play tennis?","Does she plays tennis?"], c:0, e:"she → **Does** – das s steckt schon in does, also **play** ohne s."},
        {q:"Which sentence is correct?", o:["We don't go to school on Saturday.","We doesn't go to school on Saturday.","We not go to school on Saturday."], c:0, e:"we → **don’t**. „We not go“ geht im Englischen nicht."},
        {q:"Which sentence is correct?", o:["Where do you live?","Where you live?","Where does you live?"], c:0, e:"Fragen brauchen **do**: Where **do** you live?"},
        {q:"Which sentence is correct?", o:["The monkey doesn't sleep.","The monkey don't sleep.","The monkey doesn't sleeps."], c:0, e:"the monkey = it → **doesn’t** + Verb ohne s: sleep."},
        {q:"Which sentence is correct?", o:["Do they like pizza?","Does they like pizza?","Do they likes pizza?"], c:0, e:"they → **Do** + Verb ohne s: like."}
      ]},
    { id:"build", regel:"Fragen: **(Fragewort) + do/does + Person + Verb**. Verneinung: **Person + don’t/doesn’t + Verb**.", typ:"satzbau", icon:"🧱", titel:"Question Builder", art:"Sentence builder",
      anleitung:"Build the question or sentence.",
      anleitungDe:"Bau die Frage oder den Satz, indem du die Wörter in der richtigen Reihenfolge antippst.",
      tipp:"Do/Does + Person + Grundform.",
      punkte:2,
      saetze:[
        {w:["Do","you","like","your","work","?"], hint:"🇩🇪 Magst du deine Arbeit?"}, {w:["Does","he","like","football","?"], hint:"🇩🇪 Mag er Fußball?"},
        {w:["Where","do","you","go","then","?"], hint:"🇩🇪 Wohin gehst du dann?"}, {w:["Penguins","don't","like","bananas"], hint:"🇩🇪 Pinguine mögen keine Bananen."},
        {w:["The","snake","doesn't","sleep","at","night"], hint:"🇩🇪 Die Schlange schläft nachts nicht."}, {w:["What","does","the","tiger","eat","?"], hint:"🇩🇪 Was frisst der Tiger?"}
      ]},
    { id:"story", typ:"lueckentext", icon:"🎙️", titel:"Zoo Interview", art:"Dialogue · fill in the gaps",
      anleitung:"Holly interviews Fred, the zookeeper. Tap a gap and choose the right word.",
      anleitungDe:"Holly interviewt Fred, den Tierpfleger. Tippe auf eine Lücke und wähle das richtige Wort.",
      tipp:"Do/Does – don’t/doesn’t.",
      ueberschrift:"Holly meets the zookeeper",
      text:"Holly: [[Do|Does|Are]] you like your work, Fred?\nFred: Yes, I [[do|does|am]]. I love animals!\nHolly: What [[does|do|is]] the tiger eat?\nFred: He eats 7 kilograms of meat a day. But he [[doesn't|don't|isn't]] eat fruit.\nHolly: [[Do|Does|Is]] the penguins like bananas?\nFred: No, they [[don't|doesn't|aren't]]! They eat fish.\nHolly: And the snake? Does it [[sleep|sleeps|sleeping]] at night?\nFred: No, it [[doesn't|don't|isn't]]. It sleeps in the day.",
      erklaerung:"**do / does** in questions – **don’t / doesn’t** in negatives – then the **base form**."}
  ]
});
</script>
</body>
</html>
