      text:"A 13-year-old boy from Bangor [[has had|had|have had]] a lucky escape. Yesterday afternoon he [[went|has gone|goes]] into an old slate mine with two friends. Inside the mine he [[fell|has fallen|falls]] and hurt his ankle.\nHis friends [[called|have called|has called]] 999 at about 4 pm. The cave rescue team [[arrived|has arrived|have arrived]] an hour later and carried him out.\n“We [[have rescued|rescued|rescue]] six people from old mines this year,” a rescuer told us today. “We [[have told|told|tell]] the boys many times: old mines are dangerous! Have you ever [[seen|saw|see]] how deep these tunnels are?”",
