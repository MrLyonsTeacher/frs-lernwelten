  k:10, kat:"country", id:"nz10", icon:"🥝", kartenSymbol:"🧭",

  text:"Beyond the frozen sea lies the “land of the long white cloud”. Discover New Zealand: Māori traditions, a treaty, flightless birds – and the place where Middle-earth was filmed.",
  lernen: {
    nz: { titel:"New Zealand in 11 cards", folien:[
      {"foto":"Milford_Sound_in_Fiordland_National_Park_01.jpg", "fotoText":"Milford Sound, Fiordland National Park", "bild":"☁️","titel":"Aotearoa","text":"The Māori name of New Zealand is **Aotearoa** – “the land of the long white cloud”. The country has two big islands, the **North Island** and the **South Island**, and about **5.3 million** people.","de":"Der Māori-Name Neuseelands ist **Aotearoa** – „das Land der langen weißen Wolke“. Es gibt zwei große Inseln, die **Nordinsel** und die **Südinsel**, und etwa **5,3 Millionen** Einwohner."},
      {"foto":"Te_Paranihi_-_Māori_waka_taua_(war_canoe)_from_the_Otago_Museum_01.jpg", "fotoText":"A Māori waka (canoe) in the Otago Museum", "bild":"🛶","titel":"The first people","text":"The **Māori** came from Polynesia in big canoes about **700 years ago**. They were the first people in New Zealand. Today about **one in six** New Zealanders is Māori.","de":"Die **Māori** kamen vor etwa **700 Jahren** in großen Kanus aus Polynesien. Sie waren die ersten Menschen in Neuseeland. Heute ist etwa **jeder sechste** Neuseeländer Māori."},
      {"foto":"00_27_0577_Waitangi,_New_Zealand_-_Treaty_House.jpg", "fotoText":"The Treaty House at Waitangi", "bild":"📜","titel":"The Treaty of Waitangi","text":"In **1840** British officials and many Māori chiefs signed the **Treaty of Waitangi**. But the English and Māori versions said different things, and Māori lost a lot of land. **6 February** is **Waitangi Day**.","de":"**1840** unterzeichneten britische Beamte und viele Māori-Häuptlinge den **Vertrag von Waitangi**. Doch die englische und die Māori-Fassung sagten Verschiedenes, und die Māori verloren viel Land. Der **6. Februar** ist **Waitangi Day**."},
      {"bild":"🗣️","titel":"Te reo Māori","text":"**Te reo Māori** is an official language. *Kia ora* means **hello** (and thanks), *whānau* means **family** and *kai* means **food**. Many places have Māori names.","de":"**Te reo Māori** ist Amtssprache. *Kia ora* heißt **Hallo** (und Danke), *whānau* **Familie** und *kai* **Essen**. Viele Orte haben Māori-Namen."},
      {"foto":"PoiIMG_2536.jpg", "fotoText":"A kapa haka performance (Māori song and dance)", "bild":"🏉","titel":"Haka and rugby","text":"A **haka** is a traditional Māori dance with strong movements and shouting. The national rugby team, the **All Blacks**, performs a haka before every match.","de":"Ein **Haka** ist ein traditioneller Māori-Tanz mit kraftvollen Bewegungen und Rufen. Die Rugby-Nationalmannschaft, die **All Blacks**, tanzt vor jedem Spiel einen Haka."},
      {"foto":"Ōrongomai_Marae_wharenui.jpg", "fotoText":"The meeting house (wharenui) of a marae", "bild":"🖋️","titel":"Tā moko and the marae","text":"**Tā moko** are traditional Māori tattoos that tell a person’s **family history**. A **marae** is a meeting place where families come together for celebrations and important events.","de":"**Tā moko** sind traditionelle Māori-Tätowierungen, die die **Familiengeschichte** eines Menschen erzählen. Ein **Marae** ist ein Versammlungsort, an dem Familien Feste und wichtige Ereignisse feiern."},
      {"foto":"Kate_Sheppard_National_Memorial,_Christchurch,_New_Zealand.jpg", "fotoText":"The memorial for women’s right to vote in Christchurch", "bild":"🗳️","titel":"Votes for women","text":"In **1893** New Zealand was the **first country in the world** where women could vote in national elections.","de":"**1893** durften in Neuseeland als **erstem Land der Welt** Frauen bei nationalen Wahlen wählen."},
      {"foto":"Kiwi_bird_transparent_background.png", "fotoText":"A kiwi – it can’t fly", "bild":"🥝","titel":"Kiwis","text":"The **kiwi** is a small bird that **can’t fly**. It’s the national symbol – and New Zealanders call themselves **Kiwis**, too. The fruit was renamed “kiwifruit” to sell it abroad.","de":"Der **Kiwi** ist ein kleiner Vogel, der **nicht fliegen** kann. Er ist das Nationalsymbol – und die Neuseeländer nennen sich selbst **Kiwis**. Die Frucht wurde für den Export „Kiwifruit“ genannt."},
      {"foto":"Hobbiton_Movie_Set,_Matamata.jpg", "fotoText":"A hobbit hole at the Hobbiton Movie Set", "bild":"🏔️","titel":"Middle-earth","text":"The **Lord of the Rings** and **Hobbit** films were shot in New Zealand. You can still visit **Hobbiton** near Matamata. Volcanoes, glaciers, fjords and beaches make it a paradise for adventure sports like **bungy jumping**, which started here.","de":"Die Filme **Der Herr der Ringe** und **Der Hobbit** wurden in Neuseeland gedreht. **Hobbiton** bei Matamata kann man besuchen. Vulkane, Gletscher, Fjorde und Strände machen es zum Paradies für Abenteuersport wie **Bungeejumping**, das hier erfunden wurde."},
      {"bild": "🇳🇿", "titel": "The accent of New Zealand", "text": "The short **“i”** sounds almost like “u”: *six* → “sux”, *kids* → “kuds”, *big* → “bug”. And **“e”** moves towards “i”: *fresh* → “frish”. Compare with Australia – the two accents are close, but this is the big difference! **Tip:** Play the two short clips in each row one after the other – how is the same phrase different?", "de": "Das kurze **„i“** klingt fast wie ein dumpfes „ö“: *six* → „söx“, *kids* → „köds“. Und **„e“** wandert Richtung „i“: *fresh* → „frisch“. Vergleiche mit Australien – die Akzente sind sich nah, aber hier liegt der große Unterschied! **Tipp:** Spiel die beiden kurzen Ausschnitte in einer Zeile nacheinander ab – wie klingt derselbe Satzteil anders?", "hoeren": [[{"src": "../audio/accents/newzealand.mp3", "label": "🇳🇿 Whole text – a man from Auckland"}], [{"src": "../audio/accents/newzealand-spoons.mp3", "label": "🇳🇿 “six spoons of fresh snow peas”"}, {"src": "../audio/accents/australia-spoons.mp3", "label": "🇦🇺 Australia"}], [{"src": "../audio/accents/newzealand-kids.mp3", "label": "🇳🇿 “big toy frog for the kids”"}, {"src": "../audio/accents/australia-kids.mp3", "label": "🇦🇺 Australia"}]], "hoerText": "Please call Stella. Ask her to bring these things with her from the store: six spoons of fresh snow peas, five thick slabs of blue cheese, and maybe a snack for her brother Bob. We also need a small plastic snake and a big toy frog for the kids. She can scoop these things into three red bags, and we will go meet her Wednesday at the train station."},
      {"video": "M6549TowW24", "titel": "Watch: the Kiwi accent", "text": "A pronunciation coach explains the typical sounds of New Zealand English.", "de": "Eine Aussprache-Trainerin erklärt die typischen Laute dieses Akzents (auf Englisch)."}

      ueberschrift:"Kia ora from Aotearoa!",
      text:"[[Kia ora|Kia ola|Kai ora]] everyone!\nI’ve been in New Zealand for two months now. My host family is Māori, and they always say I’m part of their [[whānau|kai|marae]] now. Last weekend we went to a [[marae|museum|mall]] for my host grandma’s birthday. The food was amazing – there was so much [[kai|haka|moko]]!\nAt school I’ve learnt a [[haka|hula|hockey]] and we performed it at the rugby match. My host uncle has a [[tā moko|tattoo shop|tomato]] that tells his family history.\nNext week we’re going to [[Hobbiton|Hogwarts|Hamburg]] where they filmed The Lord of the Rings. Oh – and I finally saw a real [[kiwi|koala|kangaroo]]! It can’t fly, but it’s so cute.\nKa kite anō,\nJonas",
