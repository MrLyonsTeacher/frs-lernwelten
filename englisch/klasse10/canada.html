  lernen: {

      {"bild":"🗺️","titel":"Huge and empty","text":"Canada is the **second-largest country** in the world – about **28 times as big as Germany**. But only about **41 million** people live there, most of them within **200 km of the US border**.","de":"Kanada ist das **zweitgrößte Land** der Welt – etwa **28-mal so groß wie Deutschland**. Aber nur rund **41 Millionen** Menschen leben dort, die meisten nahe der **US-Grenze**."},
      {"bild":"🏛️","titel":"Ottawa and the provinces","text":"The capital is **Ottawa**. Canada has **10 provinces** and **3 territories**. The biggest cities are **Toronto**, **Montreal** and **Vancouver**.","de":"Die Hauptstadt ist **Ottawa**. Kanada hat **10 Provinzen** und **3 Territorien**. Die größten Städte sind **Toronto, Montreal** und **Vancouver**."},
      {"bild":"🗣️","titel":"English and French","text":"Canada has **two official languages**: **English** and **French**. In the province of **Québec** most people speak French. Products in shops have labels in both languages.","de":"Kanada hat **zwei Amtssprachen**: **Englisch** und **Französisch**. In der Provinz **Québec** sprechen die meisten Französisch. Produkte haben Etiketten in beiden Sprachen."},
      {"bild":"🪶","titel":"First Nations, Inuit and Métis","text":"**Indigenous peoples** lived in Canada long before the Europeans came: the **First Nations**, the **Inuit** in the Arctic and the **Métis**. For a long time many Indigenous children were forced to go to **residential schools**, where they weren’t allowed to speak their languages.","de":"**Indigene Völker** lebten lange vor den Europäern in Kanada: die **First Nations**, die **Inuit** in der Arktis und die **Métis**. Lange wurden viele indigene Kinder in **Internatsschulen** gezwungen, wo sie ihre Sprache nicht sprechen durften."},
      {"bild":"🍁","titel":"A young country","text":"French and British settlers fought over the land. In **1867** Canada became a country (a **dominion**) – **1 July** is **Canada Day**. The King of the UK is still Canada’s **head of state**.","de":"Französische und britische Siedler kämpften um das Land. **1867** wurde Kanada ein eigener Staat – der **1. Juli** ist **Canada Day**. Der britische König ist bis heute Kanadas **Staatsoberhaupt**."},
      {"bild":"🏒","titel":"Hockey and lacrosse","text":"Canada has **two national sports**: **ice hockey** in winter and **lacrosse** in summer. Lacrosse was first played by First Nations peoples.","de":"Kanada hat **zwei Nationalsportarten**: **Eishockey** im Winter und **Lacrosse** im Sommer. Lacrosse wurde zuerst von den First Nations gespielt."},
      {"bild":"🐻‍❄️","titel":"The Arctic","text":"In the far north it is dark for weeks in winter. **Polar bears**, **caribou** and **narwhals** live there. The town of **Churchill** is called the “polar bear capital of the world”.","de":"Im hohen Norden ist es im Winter wochenlang dunkel. Dort leben **Eisbären, Karibus** und **Narwale**. Die Stadt **Churchill** gilt als „Eisbärenhauptstadt der Welt“."},
      {"bild":"🛢️","titel":"Energy and protests","text":"Canada has huge **oil sands** in Alberta and a lot of **hydropower**. New **pipelines** have caused big **protests** – often led by Indigenous communities who want to protect their land and water.","de":"Kanada hat riesige **Ölsande** in Alberta und viel **Wasserkraft**. Neue **Pipelines** haben große **Proteste** ausgelöst – oft angeführt von indigenen Gemeinschaften, die ihr Land und Wasser schützen wollen."},
      {"bild":"🚂","titel":"The Canadian Pacific Railway","text":"The **railway across Canada** was finished in **1885**. It connected the east with British Columbia in the west. Today you can still cross the country by train – it takes about **four days**!","de":"Die **Eisenbahn quer durch Kanada** wurde **1885** fertig. Sie verband den Osten mit British Columbia im Westen. Heute kann man das Land noch immer per Zug durchqueren – das dauert etwa **vier Tage**!"}
